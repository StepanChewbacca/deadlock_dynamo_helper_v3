services:
  deadlock-live-events:
    image: ghcr.io/deadlock-api/deadlock-live-events:latest
    restart: unless-stopped
    environment:
      - DEADLOCK_API_KEY=${DEADLOCK_API_KEY}
    expose:
      - '3000'

  api:
    image: ${DEADLOCK_API_IMAGE:-deadlock-adaptive-production:current}
    pull_policy: never
    depends_on:
      - deadlock-live-events
    ports:
      - '3000:3000'
    volumes:
      - deadlock-storage:/app/apps/api/storage
    environment:
      - DB_HOST=${DB_HOST:-aboba-telegramovich-postgres-1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-deadlock_builds}
      - DB_CONNECT_TIMEOUT_MS=${DB_CONNECT_TIMEOUT_MS:-10000}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_KEEP_ALIVE_INITIAL_DELAY_MS=${DB_KEEP_ALIVE_INITIAL_DELAY_MS:-10000}
      - DB_IDLE_TIMEOUT_MS=${DB_IDLE_TIMEOUT_MS:-30000}
      - DB_RUN_MIGRATIONS=${DB_RUN_MIGRATIONS:-false}
      - DEADLOCK_API_KEY=${DEADLOCK_API_KEY}
      - DEADLOCK_API_BASE_URL=${DEADLOCK_API_BASE_URL:-https://api.deadlock-api.com}
      - DEADLOCK_LIVE_EVENTS_BASE_URL=${DEADLOCK_LIVE_EVENTS_BASE_URL:-http://deadlock-live-events:3000}
      - DEADLOCK_TIMELINE_COLLECTOR_ENABLED=${DEADLOCK_TIMELINE_COLLECTOR_ENABLED:-true}
      - DEADLOCK_TIMELINE_MAX_CONCURRENT_MATCHES=${DEADLOCK_TIMELINE_MAX_CONCURRENT_MATCHES:-2}
      - DEADLOCK_TIMELINE_STORAGE_DIR=${DEADLOCK_TIMELINE_STORAGE_DIR:-/app/apps/api/storage/match-timeline-events-v1}
      - DEADLOCK_CONTEXTUAL_SHADOW_ENABLED=${DEADLOCK_CONTEXTUAL_SHADOW_ENABLED:-true}
      - DEADLOCK_CONTEXTUAL_SHADOW_SAMPLE_RATE=${DEADLOCK_CONTEXTUAL_SHADOW_SAMPLE_RATE:-0.1}
      - DEADLOCK_CONTEXTUAL_SHADOW_MAX_IN_FLIGHT=${DEADLOCK_CONTEXTUAL_SHADOW_MAX_IN_FLIGHT:-2}
      - DEADLOCK_CONTEXTUAL_V2_MIN_ACTION_OBSERVATIONS=${DEADLOCK_CONTEXTUAL_V2_MIN_ACTION_OBSERVATIONS:-50}
      - DEADLOCK_CONTEXTUAL_V2_MIN_CONTEXT_OBSERVATIONS=${DEADLOCK_CONTEXTUAL_V2_MIN_CONTEXT_OBSERVATIONS:-100}
      - DEADLOCK_CONTEXTUAL_V2_SHRINKAGE_STRENGTH=${DEADLOCK_CONTEXTUAL_V2_SHRINKAGE_STRENGTH:-100}
      - DEADLOCK_CONTEXTUAL_V2_LAMBDA=${DEADLOCK_CONTEXTUAL_V2_LAMBDA:-0.05}
      - DEADLOCK_CONTEXTUAL_V2_MAX_LOGIT_BONUS=${DEADLOCK_CONTEXTUAL_V2_MAX_LOGIT_BONUS:-0.1}
      - DEADLOCK_BUILD_EVALUATION_BATCH_SIZE=${DEADLOCK_BUILD_EVALUATION_BATCH_SIZE:-100}
      - DEADLOCK_BUILD_EVALUATION_MAX_RSS_MB=8192
      - DEADLOCK_BUILD_EVALUATION_STORAGE_DIR=${DEADLOCK_BUILD_EVALUATION_STORAGE_DIR:-/app/apps/api/storage/build-evaluation}
      - DEADLOCK_BUILD_EVALUATION_AUTO_RESUME=${DEADLOCK_BUILD_EVALUATION_AUTO_RESUME:-true}
      - DEADLOCK_BUILD_EVALUATION_V2_STORAGE_DIR=${DEADLOCK_BUILD_EVALUATION_V2_STORAGE_DIR:-/app/apps/api/storage/build-evaluation-v2}
      - DEADLOCK_BUILD_EVALUATION_V2_AUTO_RESUME=${DEADLOCK_BUILD_EVALUATION_V2_AUTO_RESUME:-true}
      - DEADLOCK_BUILD_EVALUATION_V2_FINAL_TEST_NOT_BEFORE=${DEADLOCK_BUILD_EVALUATION_V2_FINAL_TEST_NOT_BEFORE:-2026-07-17T11:46:14.000Z}
      - DEADLOCK_BUILD_EVALUATION_DB_RETRY_COUNT=${DEADLOCK_BUILD_EVALUATION_DB_RETRY_COUNT:-5}
      - DEADLOCK_BUILD_EVALUATION_DB_RETRY_DELAY_MS=${DEADLOCK_BUILD_EVALUATION_DB_RETRY_DELAY_MS:-500}
      - DEADLOCK_BUILD_DECISION_DATASET_V3_STORAGE_DIR=${DEADLOCK_BUILD_DECISION_DATASET_V3_STORAGE_DIR:-/app/apps/api/storage/build-decision-dataset-v3}
      - DEADLOCK_RECOMMENDATION_TELEMETRY_DIR=${DEADLOCK_RECOMMENDATION_TELEMETRY_DIR:-/app/apps/api/storage/recommendation-decision-telemetry}
      - DEADLOCK_RECOMMENDATION_DECISION_DATASET_V4_DIR=${DEADLOCK_RECOMMENDATION_DECISION_DATASET_V4_DIR:-/app/apps/api/storage/recommendation-decision-dataset-v4}
      - DEADLOCK_RECOMMENDATION_DECISION_DATASET_V4_BOOTSTRAP_TRAINING_DIR=${DEADLOCK_RECOMMENDATION_DECISION_DATASET_V4_BOOTSTRAP_TRAINING_DIR:-/app/apps/api/storage/contextual-v3-training}
      - DEADLOCK_RECOMMENDATION_DECISION_DATASET_V4_BOOTSTRAP_CANDIDATE_DIR=${DEADLOCK_RECOMMENDATION_DECISION_DATASET_V4_BOOTSTRAP_CANDIDATE_DIR:-/app/apps/api/storage/contextual-v3-candidate-evaluation-v2}
      - DEADLOCK_RECOMMENDATION_DECISION_DATASET_V4_BOOTSTRAP_OUTPUT_DIR=${DEADLOCK_RECOMMENDATION_DECISION_DATASET_V4_BOOTSTRAP_OUTPUT_DIR:-/app/apps/api/storage/recommendation-decision-dataset-v4-historical-bootstrap}
      - DEADLOCK_RECOMMENDATION_DECISION_DATASET_V5_SOURCE_DIR=${DEADLOCK_RECOMMENDATION_DECISION_DATASET_V5_SOURCE_DIR:-/app/apps/api/storage/recommendation-decision-dataset-v4}
      - DEADLOCK_RECOMMENDATION_DECISION_DATASET_V5_DIR=${DEADLOCK_RECOMMENDATION_DECISION_DATASET_V5_DIR:-/app/apps/api/storage/recommendation-decision-dataset-v5}
      - DEADLOCK_RECOMMENDATION_BEHAVIORAL_V4_SOURCE_DIR=${DEADLOCK_RECOMMENDATION_BEHAVIORAL_V4_SOURCE_DIR:-/app/apps/api/storage/recommendation-decision-dataset-v4}
      - DEADLOCK_RECOMMENDATION_BEHAVIORAL_V4_DIR=${DEADLOCK_RECOMMENDATION_BEHAVIORAL_V4_DIR:-/app/apps/api/storage/recommendation-behavioral-v4}
      - DEADLOCK_RECOMMENDATION_BEHAVIORAL_BUNDLE_REGISTRY_DIR=${DEADLOCK_RECOMMENDATION_BEHAVIORAL_BUNDLE_REGISTRY_DIR:-/app/apps/api/storage/recommendation-behavioral-bundles}
      - DEADLOCK_RECOMMENDATION_BEHAVIORAL_TRAINED_DIR=${DEADLOCK_RECOMMENDATION_BEHAVIORAL_TRAINED_DIR:-/app/apps/api/storage/recommendation-behavioral-trained}
      - DEADLOCK_RECOMMENDATION_VALUE_V4_DIR=${DEADLOCK_RECOMMENDATION_VALUE_V4_DIR:-/app/apps/api/storage/recommendation-value-v4}
      - DEADLOCK_RECOMMENDATION_VALUE_V5_DIR=${DEADLOCK_RECOMMENDATION_VALUE_V5_DIR:-/app/apps/api/storage/recommendation-value-v5}
      - DEADLOCK_RECOMMENDATION_VALUE_V6_DIR=${DEADLOCK_RECOMMENDATION_VALUE_V6_DIR:-/app/apps/api/storage/recommendation-value-v6}
      - DEADLOCK_RECOMMENDATION_VALUE_V6_LIVE_CONFIG_PATH=${DEADLOCK_RECOMMENDATION_VALUE_V6_LIVE_CONFIG_PATH:-/app/apps/api/storage/recommendation-value-v6/live-config.json}
      - DEADLOCK_RECOMMENDATION_VALUE_V6_FALLBACK_MODE=${DEADLOCK_RECOMMENDATION_VALUE_V6_FALLBACK_MODE:-BASELINE}
      - DEADLOCK_RECOMMENDATION_ROADMAP_PROVENANCE_PATH=${DEADLOCK_RECOMMENDATION_ROADMAP_PROVENANCE_PATH:-/app/CURRENT-ROADMAP.md}
      - DEADLOCK_RECOMMENDATION_V8_PRETRAINING_RUNBOOK_PATH=${DEADLOCK_RECOMMENDATION_V8_PRETRAINING_RUNBOOK_PATH:-/app/docs/recommendation-v8-pretraining-handoff.md}
      - DEADLOCK_RECOMMENDATION_V8_OPERATIONAL_RUNBOOK_PATH=${DEADLOCK_RECOMMENDATION_V8_OPERATIONAL_RUNBOOK_PATH:-/app/docs/recommendation-v8-final-operational-runbook.md}
      - ADAPTIVE_ECONOMY_RULES_STORE_DIR=${ADAPTIVE_ECONOMY_RULES_STORE_DIR:-/app/apps/api/storage/economy-rules-v1}
      - ADAPTIVE_BUILD_STRATEGY_SNAPSHOT_STORE_DIR=${ADAPTIVE_BUILD_STRATEGY_SNAPSHOT_STORE_DIR:-/app/apps/api/storage/build-strategy-snapshots-v1}
      - ADAPTIVE_STRATEGY_PLANNER_MODE=${ADAPTIVE_STRATEGY_PLANNER_MODE:-STRATEGY}
      - ADAPTIVE_STRATEGY_PROMOTION_APPROVED=${ADAPTIVE_STRATEGY_PROMOTION_APPROVED:-true}
    restart: unless-stopped

volumes:
  deadlock-storage:
    external: true

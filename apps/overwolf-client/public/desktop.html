<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deadlock Statlocker Adaptive</title>
    <style>
      :root {
        --bg: #0b0b0e;
        --card: #14141a;
        --border: #272733;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #ff6b4a;
        --success: #10b981;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }

      h1 { margin: 0; font-size: 18px; color: var(--accent); }
      #status { color: var(--muted); font-size: 12px; }
      #status.connected { color: var(--success); }
      #status.error { color: #ef4444; }

      .status-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .status-card, .adaptive-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }

      .status-label { color: var(--muted); font-size: 10px; text-transform: uppercase; }
      .status-value { margin-top: 5px; font-size: 12px; overflow-wrap: anywhere; }
      #indicator-dot.active { color: var(--success); }

      #guide-empty {
        flex: 1;
        min-height: 240px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        color: var(--muted);
      }

      #guide-active {
        display: none;
        flex: 1;
        flex-direction: column;
      }

      #situational-recommendation-panel {
        display: none;
        flex-direction: column;
        gap: 10px;
        border-left: 3px solid var(--accent);
      }

      #rec-decision-title {
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      #rec-item-name { font-size: 22px; font-weight: 700; }
      #rec-reason { color: var(--muted); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
      #console { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Statlocker Adaptive</h1>
      <div id="status">INITIALIZING...</div>
    </header>

    <section class="status-row">
      <div class="status-card">
        <div class="status-label">Connection</div>
        <div class="status-value"><span id="indicator-dot">●</span> <span id="indicator-text">Waiting</span></div>
      </div>
      <div class="status-card">
        <div class="status-label">Last event</div>
        <div class="status-value" id="last-event">None</div>
      </div>
      <div class="status-card">
        <div class="status-label">API sends</div>
        <div class="status-value" id="last-send">0</div>
      </div>
    </section>

    <section id="guide-empty" class="adaptive-card">
      <strong>Waiting for Statlocker recommendation</strong>
      <span>Only /deadlock/adaptive/v1/recommend is used. Legacy build and pro-build fallback paths are disabled.</span>
    </section>

    <section id="guide-active">
      <div id="situational-recommendation-panel" class="adaptive-card">
        <div id="rec-decision-title">Statlocker Adaptive</div>
        <div id="rec-item-name">Waiting...</div>
        <div id="rec-reason"></div>
      </div>
    </section>

    <pre id="console"></pre>
    <script src="dist/index.js"></script>
  </body>
</html>

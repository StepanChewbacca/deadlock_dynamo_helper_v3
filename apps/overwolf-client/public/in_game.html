<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deadlock Statlocker Adaptive HUD</title>
    <style>
      :root {
        --bg: rgba(12, 12, 16, 0.82);
        --card: rgba(24, 24, 31, 0.92);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #ff6b4a;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        font-family: Arial, sans-serif;
        background: transparent;
        color: var(--text);
        padding: 10px;
      }

      .hud-container {
        width: 100%;
        min-height: 240px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        user-select: none;
      }

      .guide-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: move;
      }

      .guide-title {
        margin: 0;
        color: var(--accent);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .controls { display: flex; gap: 6px; }
      button {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 8px;
        cursor: pointer;
      }

      #guide-empty {
        min-height: 170px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
        color: var(--muted);
      }

      #guide-active {
        display: none;
        flex-direction: column;
        gap: 8px;
      }

      #situational-recommendation-panel {
        display: none;
        flex-direction: column;
        gap: 8px;
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        padding: 10px;
      }

      #rec-decision-title {
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      #rec-item-name { font-size: 16px; font-weight: 700; }
      #rec-reason { color: var(--muted); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
      .waiting-title { color: var(--text); font-weight: 700; font-size: 15px; }
      .waiting-copy { max-width: 270px; font-size: 11px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main class="hud-container">
      <div class="guide-header">
        <h1 class="guide-title">Statlocker Adaptive</h1>
        <div class="controls">
          <button id="hud-refresh-build" type="button" onclick="overwolf.windows.getMainWindow().refreshBuild?.()">Refresh</button>
          <button id="hud-toggle-mode" type="button" onclick="toggleHudMode()">Compact</button>
        </div>
      </div>

      <section id="guide-empty">
        <div class="waiting-title">Waiting for Statlocker recommendation</div>
        <div class="waiting-copy">Only the adaptive Statlocker recommendation path is enabled. No legacy or pro-build fallback will be used.</div>
      </section>

      <section id="guide-active">
        <div id="situational-recommendation-panel">
          <div id="rec-decision-title">Statlocker Adaptive</div>
          <div id="rec-item-name">Waiting...</div>
          <div id="rec-reason"></div>
        </div>
      </section>
    </main>

    <script src="dist/index.js"></script>
  </body>
</html>

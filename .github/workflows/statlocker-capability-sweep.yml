name: Statlocker Chromium Capability Sweep

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-capability-sweep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capability-sweep:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact sweep commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Probe Statlocker model endpoints from anonymous Chromium
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/statlocker-capability-sweep"
          rm -rf "$work"
          mkdir -p "$work"

          cat > "$work/Dockerfile" <<'DOCKERFILE'
          FROM node:20-alpine
          WORKDIR /app
          RUN apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont \
            && npm init -y >/dev/null 2>&1 \
            && npm install puppeteer-core@24.16.0
          COPY sweep.mjs ./sweep.mjs
          CMD ["node", "sweep.mjs"]
          DOCKERFILE

          cat > "$work/sweep.mjs" <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/chromium-browser',
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });

          const page = await browser.newPage();
          await page.setViewport({ width: 1440, height: 1100 });
          await page.setUserAgent(
            'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
            '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
          );

          const report = {
            generatedAt: new Date().toISOString(),
            browserMode: true,
            apiKeyProvidedBySweep: false,
            sourcePage: 'https://statlocker.gg/items/meta-model',
            frontendEndpointStrings: [],
            context: {},
            probes: [],
          };

          try {
            await page.goto(report.sourcePage, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await sleep(5000);

            const scriptUrls = await page.evaluate(() =>
              Array.from(document.scripts).map((script) => script.src).filter(Boolean),
            );

            report.frontendEndpointStrings = await page.evaluate(async (urls) => {
              const found = new Set();
              for (const url of urls) {
                try {
                  const controller = new AbortController();
                  const timer = setTimeout(() => controller.abort(), 8000);
                  const response = await fetch(url, { signal: controller.signal });
                  const text = await response.text();
                  clearTimeout(timer);

                  const patterns = [
                    /\/api\/(?:info|match|profile|leaderboard)\/[A-Za-z0-9_?&=./{}:-]+/g,
                    /\/api\/[A-Za-z0-9_-]*wpa[A-Za-z0-9_?&=./{}:-]*/gi,
                  ];
                  for (const pattern of patterns) {
                    for (const match of text.matchAll(pattern)) {
                      const value = match[0].replace(/[)}\],;]+$/g, '').slice(0, 260);
                      if (/wpa|build|win-rate|leaderboard|performance|hero|patch|chain/i.test(value)) {
                        found.add(value);
                      }
                    }
                  }
                } catch {}
              }
              return [...found].sort();
            }, scriptUrls);

            async function browserFetch(label, path) {
              const result = await page.evaluate(async ({ path, label }) => {
                function summarize(value, depth = 0) {
                  if (value === null) return null;
                  if (Array.isArray(value)) {
                    return {
                      type: 'array',
                      length: value.length,
                      sample: value.length && depth < 3 ? summarize(value[0], depth + 1) : undefined,
                    };
                  }
                  if (typeof value === 'object') {
                    const keys = Object.keys(value);
                    const result = { type: 'object', keys: keys.slice(0, 80) };
                    if (depth < 3) {
                      const sample = {};
                      for (const key of keys.slice(0, 20)) sample[key] = summarize(value[key], depth + 1);
                      result.sample = sample;
                    }
                    return result;
                  }
                  if (typeof value === 'string') return value.slice(0, 240);
                  return value;
                }

                function collectInteresting(value, depth = 0, path = '$', out = []) {
                  if (out.length >= 12 || depth > 7 || value === null || typeof value !== 'object') return out;
                  if (!Array.isArray(value)) {
                    const keys = Object.keys(value);
                    const hasHero = keys.some((key) => /hero|opponent|enemy/i.test(key));
                    const hasSignal = keys.some((key) => /wpa|item|counter|sample|matchup/i.test(key));
                    if (hasHero && hasSignal) {
                      const row = {};
                      for (const key of keys.slice(0, 30)) {
                        const child = value[key];
                        if (child === null || ['string', 'number', 'boolean'].includes(typeof child)) row[key] = child;
                      }
                      out.push({ path, row, keys: keys.slice(0, 50) });
                    }
                  }
                  if (Array.isArray(value)) {
                    for (let i = 0; i < Math.min(value.length, 120) && out.length < 12; i += 1) {
                      collectInteresting(value[i], depth + 1, `${path}[${i}]`, out);
                    }
                  } else {
                    for (const [key, child] of Object.entries(value)) {
                      if (out.length >= 12) break;
                      collectInteresting(child, depth + 1, `${path}.${key}`, out);
                    }
                  }
                  return out;
                }

                const started = Date.now();
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 15000);
                try {
                  const response = await fetch(path, {
                    method: 'GET',
                    credentials: 'include',
                    cache: 'no-store',
                    signal: controller.signal,
                  });
                  const contentType = response.headers.get('content-type') || '';
                  let body;
                  if (contentType.includes('application/json')) body = await response.json();
                  else body = await response.text();

                  let extracted = null;
                  if (label === 'ITEM_META_WPA' && body && typeof body === 'object') {
                    extracted = {
                      availablePatches: Array.isArray(body.availablePatches) ? body.availablePatches.slice(0, 12) : [],
                      itemCount: Array.isArray(body.items) ? body.items.length : null,
                    };
                  } else if (label === 'PLAYER_PERFORMANCE' && body && typeof body === 'object') {
                    const candidates = [];
                    if (Array.isArray(body.matchHistory)) candidates.push(...body.matchHistory);
                    if (Array.isArray(body.profileAggregateStats?.matchHistory)) candidates.push(...body.profileAggregateStats.matchHistory);
                    if (Array.isArray(body.playerPerformance?.matchHistory)) candidates.push(...body.playerPerformance.matchHistory);
                    const match = candidates.find((entry) => entry && (entry.match_id || entry.matchId));
                    extracted = { matchId: match ? String(match.match_id || match.matchId) : null };
                  } else if (label === 'VS_HERO_WPA') {
                    extracted = { interesting: collectInteresting(body) };
                  }

                  return {
                    ok: response.ok,
                    status: response.status,
                    elapsedMs: Date.now() - started,
                    body: summarize(body),
                    extracted,
                  };
                } catch (error) {
                  return {
                    ok: false,
                    status: 0,
                    elapsedMs: Date.now() - started,
                    error: error instanceof Error ? error.message : String(error),
                    body: null,
                    extracted: null,
                  };
                } finally {
                  clearTimeout(timer);
                }
              }, { path, label });

              report.probes.push({ label, path, ...result });
              return result;
            }

            const wpa = await browserFetch(
              'ITEM_META_WPA',
              '/api/info/wpa-filtered-items?hero=Abrams&tier=all&rank=ranked&category=all&gameState=all&purchaseTime=all&teamComp=Average%20Comp&buildType=all&patch=all&minSampleSize=500&searchTerm=&sortBy=wpa',
            );
            await browserFetch('T4_BUILD_CHAINS', '/api/info/t4-chains-data');
            await browserFetch('VS_HERO_WPA', '/api/info/vs-hero-wpa-data');
            await browserFetch('WPA_PATCHES', '/api/info/wpa-patches');
            await browserFetch('PRO_BUILD_ANALYSIS', '/api/info/player-build-analysis/281768392/6');
            await browserFetch('HERO_LEADERBOARD', '/api/leaderboard/get-valve-leaderboard?region=Europe&heroId=6&page=1&pageSize=10&version=2');
            await browserFetch('ACCOUNT_IDS_WITH_HERO_MATCHES', '/api/profile/account-ids-with-hero-matches?heroId=6&accountIds=281768392');
            const performance = await browserFetch('PLAYER_PERFORMANCE', '/api/profile/get-performance-analysis/281768392/6');

            const patchId = wpa.extracted?.availablePatches?.[0] || null;
            report.context.patchId = patchId;
            if (patchId) await browserFetch('WPA_PATCH_DATA', `/api/info/wpa-patch-data/${encodeURIComponent(patchId)}`);

            const matchId = performance.extracted?.matchId || null;
            report.context.matchId = matchId;
            report.context.accountId = '281768392';
            report.context.heroId = '6';
            if (matchId) {
              await browserFetch('WIN_CHANCE', `/api/match/${encodeURIComponent(matchId)}/win-rate`);
              await browserFetch('PLAYER_WPA', `/api/match/${encodeURIComponent(matchId)}/wpa/281768392`);
              await browserFetch('BUILD_CONTEXT', `/api/match/build-context/${encodeURIComponent(matchId)}/281768392`);
            }
          } finally {
            await browser.close();
          }

          fs.writeFileSync('/out/statlocker-capability-sweep-result.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE

          docker build -t statlocker-capability-sweep "$work"
          docker run --rm --shm-size=1g \
            -v "$GITHUB_WORKSPACE:/out" \
            statlocker-capability-sweep

      - name: Persist sweep result temporarily
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statlocker-capability-sweep-result.json
          git commit -m 'test(statlocker): save Chromium capability sweep result'
          git push origin HEAD:agent/statlocker-model-probe-poc

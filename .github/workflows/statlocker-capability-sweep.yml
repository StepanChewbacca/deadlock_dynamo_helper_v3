name: Statlocker Chromium Capability Sweep

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-capability-sweep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capability-sweep:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact sweep commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deep probe Statlocker endpoints from anonymous Chromium
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/statlocker-capability-sweep"
          rm -rf "$work"
          mkdir -p "$work"

          cat > "$work/Dockerfile" <<'DOCKERFILE'
          FROM node:20-alpine
          WORKDIR /app
          RUN apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont \
            && npm init -y >/dev/null 2>&1 \
            && npm install puppeteer-core@24.16.0
          COPY sweep.mjs ./sweep.mjs
          CMD ["node", "sweep.mjs"]
          DOCKERFILE

          cat > "$work/sweep.mjs" <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/chromium-browser',
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 1440, height: 1100 });
          await page.setUserAgent(
            'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
            '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
          );

          const report = {
            generatedAt: new Date().toISOString(),
            browserMode: true,
            apiKeyProvidedBySweep: false,
            scriptEndpoints: [],
            probes: [],
          };

          function addProbe(value) {
            report.probes.push(value);
            console.log('PROBE=' + JSON.stringify(value));
          }

          try {
            const pages = [
              'https://statlocker.gg/items/meta-model',
              'https://statlocker.gg/builds/eternus-builds/abrams',
              'https://statlocker.gg/vision/win-chance',
            ];
            const scripts = new Set();
            for (const url of pages) {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await sleep(4000);
              const current = await page.evaluate(() =>
                Array.from(document.scripts).map((script) => script.src).filter(Boolean),
              );
              current.forEach((url) => scripts.add(url));
            }

            report.scriptEndpoints = await page.evaluate(async (urls) => {
              const found = new Set();
              for (const url of urls) {
                try {
                  const controller = new AbortController();
                  const timer = setTimeout(() => controller.abort(), 8000);
                  const text = await fetch(url, { signal: controller.signal }).then((r) => r.text());
                  clearTimeout(timer);
                  const regex = /["'`]([^"'`]{0,80}\/api\/[^"'`]{1,220})["'`]/g;
                  for (const match of text.matchAll(regex)) {
                    const raw = match[1].replace(/\\/g, '');
                    if (/\/api\/(info|match|profile|leaderboard)\//.test(raw)) found.add(raw.slice(0, 260));
                  }
                } catch {}
              }
              return [...found].sort();
            }, [...scripts]);

            await page.goto('https://statlocker.gg/items/meta-model', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await sleep(3000);

            async function probeJson(label, path, timeoutMs = 20000) {
              const result = await page.evaluate(async ({ path, timeoutMs }) => {
                function summarize(value, depth = 0) {
                  if (value === null) return null;
                  if (Array.isArray(value)) return {
                    type: 'array',
                    length: value.length,
                    sample: value.length && depth < 4 ? summarize(value[0], depth + 1) : undefined,
                  };
                  if (typeof value === 'object') {
                    const keys = Object.keys(value);
                    const sample = {};
                    if (depth < 4) {
                      for (const key of keys.slice(0, 30)) sample[key] = summarize(value[key], depth + 1);
                    }
                    return { type: 'object', keys: keys.slice(0, 100), sample };
                  }
                  return typeof value === 'string' ? value.slice(0, 300) : value;
                }
                const started = Date.now();
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                  const response = await fetch(path, { credentials: 'include', cache: 'no-store', signal: controller.signal });
                  const status = response.status;
                  const contentType = response.headers.get('content-type') || '';
                  let body;
                  if (contentType.includes('application/json')) body = await response.json();
                  else body = await response.text();
                  return { status, ok: response.ok, elapsedMs: Date.now() - started, summary: summarize(body), rawSmall: JSON.stringify(body).slice(0, 20000) };
                } catch (error) {
                  return { status: 0, ok: false, elapsedMs: Date.now() - started, error: error instanceof Error ? error.message : String(error) };
                } finally {
                  clearTimeout(timer);
                }
              }, { path, timeoutMs });
              addProbe({ label, path, ...result });
              return result;
            }

            async function probeStreamPrefix(label, path) {
              const result = await page.evaluate(async (path) => {
                const started = Date.now();
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 30000);
                try {
                  const response = await fetch(path, { credentials: 'include', cache: 'no-store', signal: controller.signal });
                  const status = response.status;
                  const headers = {
                    contentType: response.headers.get('content-type'),
                    contentLength: response.headers.get('content-length'),
                  };
                  const reader = response.body?.getReader();
                  const chunks = [];
                  let total = 0;
                  while (reader && total < 1024 * 1024) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    total += value.byteLength;
                  }
                  await reader?.cancel().catch(() => {});
                  const combined = new Uint8Array(total);
                  let offset = 0;
                  for (const chunk of chunks) {
                    combined.set(chunk, offset);
                    offset += chunk.byteLength;
                  }
                  const prefix = new TextDecoder().decode(combined).slice(0, 50000);
                  return { status, ok: response.ok, elapsedMs: Date.now() - started, headers, bytesRead: total, prefix };
                } catch (error) {
                  return { status: 0, ok: false, elapsedMs: Date.now() - started, error: error instanceof Error ? error.message : String(error) };
                } finally {
                  clearTimeout(timer);
                }
              }, path);
              addProbe({ label, path, ...result });
              return result;
            }

            await probeStreamPrefix('VS_HERO_WPA_PREFIX', '/api/info/vs-hero-wpa-data');
            await probeJson('VS_HERO_WPA_FULL', '/api/info/vs-hero-wpa-data', 75000);

            const patchList = await probeJson('WPA_PATCHES_EXACT', '/api/info/wpa-patches');
            await probeJson('WPA_PATCH_DATA_PREFIXED', '/api/info/wpa-patch-data/patch_676255623445218601');
            await probeJson('WPA_PATCH_DATA_RAW', '/api/info/wpa-patch-data/676255623445218601');

            // Re-probe gated match endpoints with a known valid recent match/account pair.
            await probeJson('WIN_CHANCE', '/api/match/102626994/win-rate');
            await probeJson('PLAYER_WPA', '/api/match/102626994/wpa/281768392');
            await probeJson('BUILD_CONTEXT', '/api/match/build-context/102626994/281768392');
          } finally {
            await browser.close();
          }

          fs.writeFileSync('/out/statlocker-capability-deep-result.json', JSON.stringify(report, null, 2));
          console.log('FINAL=' + JSON.stringify(report));
          NODE

          sudo docker build -t statlocker-capability-sweep "$work"
          sudo docker run --rm --shm-size=1g \
            -v "$GITHUB_WORKSPACE:/out" \
            statlocker-capability-sweep

      - name: Persist deep sweep result temporarily
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statlocker-capability-deep-result.json
          git commit -m 'test(statlocker): save deep Chromium capability result'
          git push origin HEAD:agent/statlocker-model-probe-poc

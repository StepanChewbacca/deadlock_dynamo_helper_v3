name: Recommendation Behavioral V5.1 Full Training

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-behavioral-v5-1-full-v1.json'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v5-1-full-v1
  cancel-in-progress: false

jobs:
  full-training:
    runs-on: self-hosted
    timeout-minutes: 4320
    steps:
      - name: Checkout requested implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for preflight
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate authorization, lineage, and capacity
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-behavioral-v5-1-full-v1.json'
          test -s "$request"
          jq -e '
            .schemaVersion == 1 and
            .operation == "RECOMMENDATION_BEHAVIORAL_V5_1_FULL_TRAINING" and
            .fullTrainingAuthorized == true and
            .selectedVariant == "B" and
            .valueV8TrainingAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowActivated == false and
            .randomizedCanaryAuthorized == false and
            .auditThresholdsLowered == false and
            .sourceDirectory == "recommendation-pro-decision-dataset-v6-terminal-5000-v2" and
            .sweepDirectory == "recommendation-behavioral-v5-1-sweep-v1" and
            .outputDirectory == "recommendation-behavioral-v5-1-terminal-5000-v3" and
            .configuration.hashDimension == 65536 and
            .configuration.epochs == 5 and
            .configuration.learningRate == 0.1 and
            .configuration.l2 == 0.0001 and
            .configuration.foldCount == 5 and
            .configuration.propensityFloor == 0.01 and
            .configuration.supportProbability == 0.01 and
            .configuration.majorGroupMinDecisions == 100
          ' "$request"

          node --check scripts/run-recommendation-behavioral-v5-1-full.mjs

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          source_name="$(jq -r '.sourceDirectory' "$request")"
          sweep_name="$(jq -r '.sweepDirectory' "$request")"
          output_name="$(jq -r '.outputDirectory' "$request")"
          source="$storage/$source_name"
          sweep="$storage/$sweep_name"
          sweep_b="$storage/recommendation-behavioral-v5-1-sweep-b-v1"
          output="$storage/$output_name"
          expected_dataset_sha="$(jq -r '.expectedDatasetSha256' "$request")"
          expected_sweep_sha="$(jq -r '.expectedSweepSummarySha256' "$request")"
          expected_sample_sha="$(jq -r '.expectedDiagnosticSampleSha256' "$request")"
          [[ "$expected_dataset_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$expected_sweep_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$expected_sample_sha" =~ ^[a-f0-9]{64}$ ]]

          sudo test -s "$source/manifest.json"
          sudo test -s "$source/audit.json"
          sudo test -s "$sweep/sweep-summary.json"
          sudo test -d "$sweep_b"
          source_manifest="$(sudo cat "$source/manifest.json")"
          source_audit="$(sudo cat "$source/audit.json")"
          sweep_summary="$(sudo cat "$sweep/sweep-summary.json")"

          jq -e '.auditPassed == true and .trainingArtifactEligible == true' <<<"$source_manifest"
          jq -e '.passed == true and .trainingArtifactEligible == true' <<<"$source_audit"
          test "$(jq -r '.artifact.sha256' <<<"$source_manifest")" = "$expected_dataset_sha"
          test "$(sudo sha256sum "$sweep/sweep-summary.json" | awk '{print $1}')" = "$expected_sweep_sha"

          jq -e \
            --arg dataset_sha "$expected_dataset_sha" \
            --arg sample_sha "$expected_sample_sha" '
              .operation == "RECOMMENDATION_BEHAVIORAL_V5_1_BOUNDED_SWEEP" and
              .expectedSourceSha256 == $dataset_sha and
              .preferredDiagnosticVariant == "B" and
              .diagnosticSample.unit == "MATCH" and
              .diagnosticSample.hash == "FNV1A_32" and
              .diagnosticSample.modulo == 16 and
              .diagnosticSample.remainder == 0 and
              .diagnosticSample.sha256 == $sample_sha and
              .diagnosticSample.futureTestEvaluated == false and
              .fullTrainingAuthorized == false and
              .valueV8TrainingAuthorized == false and
              ([.results[] | select(.variant == "B")] | length) == 1 and
              ([.results[] | select(.variant == "B")][0].auditPassed == true) and
              ([.results[] | select(.variant == "B")][0].trainingArtifactEligible == false) and
              ([.results[] | select(.variant == "B")][0].configuration.hashDimension == 65536) and
              ([.results[] | select(.variant == "B")][0].configuration.epochs == 5) and
              ([.results[] | select(.variant == "B")][0].configuration.learningRate == 0.1)
            ' <<<"$sweep_summary"

          if sudo test -e "$output"; then
            echo "Refusing destructive reuse of existing output: $output" >&2
            exit 1
          fi

          source_rows="$(jq -r '.artifact.rowCount' <<<"$source_manifest")"
          sample_rows="$(jq -r '[.results[] | select(.variant == "B")][0].diagnosticSampleRowCount' <<<"$sweep_summary")"
          test "$source_rows" -gt 0
          test "$sample_rows" -gt 0
          ratio=$(( (source_rows + sample_rows - 1) / sample_rows ))
          sweep_b_kib="$(sudo du -sk "$sweep_b" | awk '{print $1}')"
          available_kib="$(sudo df -Pk "$storage" | awk 'NR==2 {print $4}')"
          projected_kib=$(( sweep_b_kib * ratio * 12 / 10 + 2 * 1024 * 1024 ))
          echo "sourceRows=$source_rows sampleRows=$sample_rows scaleRatio=$ratio"
          echo "sweepBKiB=$sweep_b_kib projectedFullKiB=$projected_kib availableKiB=$available_kib"
          if [ "$available_kib" -lt "$projected_kib" ]; then
            echo "Insufficient disk for conservative full-training projection." >&2
            exit 1
          fi

          evidence_dir="$RUNNER_TEMP/recommendation-behavioral-v5-1-full-$GITHUB_RUN_ID"
          mkdir -p "$evidence_dir"
          sudo mkdir "$output"

          {
            echo "storage=$storage"
            echo "source_name=$source_name"
            echo "sweep_name=$sweep_name"
            echo "output_name=$output_name"
            echo "expected_dataset_sha=$expected_dataset_sha"
            echo "expected_sweep_sha=$expected_sweep_sha"
            echo "expected_sample_sha=$expected_sample_sha"
            echo "evidence_dir=$evidence_dir"
            echo "projected_kib=$projected_kib"
            echo "available_kib=$available_kib"
          } >> "$GITHUB_OUTPUT"

      - name: Build isolated Behavioral V5.1 full image
        shell: bash
        run: |
          set -euo pipefail
          sudo docker build \
            --label deadlock.recommendation.operation=behavioral-v5-1-full \
            --label deadlock.recommendation.git-sha="$GITHUB_SHA" \
            -t "deadlock-behavioral-v5-1-full:$GITHUB_RUN_ID" \
            .

      - name: Run selected full-corpus Behavioral V5.1
        id: training
        shell: bash
        run: |
          set -uo pipefail
          storage='${{ steps.preflight.outputs.storage }}'
          source_name='${{ steps.preflight.outputs.source_name }}'
          sweep_name='${{ steps.preflight.outputs.sweep_name }}'
          output_name='${{ steps.preflight.outputs.output_name }}'
          evidence_dir='${{ steps.preflight.outputs.evidence_dir }}'
          image="deadlock-behavioral-v5-1-full:$GITHUB_RUN_ID"

          set +e
          sudo docker run --rm \
            --name "deadlock-behavioral-v5-1-full-$GITHUB_RUN_ID" \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            -e NODE_OPTIONS=--max-old-space-size=6144 \
            -e DEADLOCK_RECOMMENDATION_BEHAVIORAL_V5_SOURCE_DIR="/app/apps/api/storage/$source_name" \
            -e DEADLOCK_RECOMMENDATION_BEHAVIORAL_V5_DIR="/app/apps/api/storage/$output_name" \
            -e BEHAVIORAL_SWEEP_SUMMARY_PATH="/app/apps/api/storage/$sweep_name/sweep-summary.json" \
            -e BEHAVIORAL_FULL_EVIDENCE_PATH=/evidence/full-training-evidence.json \
            -e EXPECTED_DATASET_SHA256='${{ steps.preflight.outputs.expected_dataset_sha }}' \
            -e EXPECTED_SWEEP_SUMMARY_SHA256='${{ steps.preflight.outputs.expected_sweep_sha }}' \
            -e EXPECTED_DIAGNOSTIC_SAMPLE_SHA256='${{ steps.preflight.outputs.expected_sample_sha }}' \
            -v "$storage/$source_name:/app/apps/api/storage/$source_name:ro" \
            -v "$storage/$sweep_name:/app/apps/api/storage/$sweep_name:ro" \
            -v "$storage/$output_name:/app/apps/api/storage/$output_name:rw" \
            -v "$evidence_dir:/evidence:rw" \
            "$image" \
            node /app/scripts/run-recommendation-behavioral-v5-1-full.mjs \
            2>&1 | tee "$evidence_dir/container.log"
          training_exit="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=$training_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify full-training evidence and release eligibility
        shell: bash
        run: |
          set -uo pipefail
          storage='${{ steps.preflight.outputs.storage }}'
          output_name='${{ steps.preflight.outputs.output_name }}'
          evidence_dir='${{ steps.preflight.outputs.evidence_dir }}'
          output="$storage/$output_name"
          evidence="$evidence_dir/full-training-evidence.json"
          training_exit='${{ steps.training.outputs.exit_code }}'
          verification_exit=0

          sudo test -s "$output/model.json" || verification_exit=1
          sudo test -s "$output/propensities.ndjson" || verification_exit=1
          sudo test -s "$output/evaluation.json" || verification_exit=1
          sudo test -s "$output/audit.json" || verification_exit=1
          sudo test -s "$output/manifest.json" || verification_exit=1
          test -s "$evidence" || verification_exit=1

          if [ -s "$evidence" ]; then
            jq -e '
              .operation == "RECOMMENDATION_BEHAVIORAL_V5_1_FULL_TRAINING" and
              .selectedVariant.id == "B" and
              .selectedVariant.hashDimension == 65536 and
              .selectedVariant.epochs == 5 and
              .selectedVariant.learningRate == 0.1 and
              .sweepEvidence.preferredDiagnosticVariant == "B" and
              .gateChecks.statusComplete == true and
              .gateChecks.statusReleaseGatePassed == true and
              .gateChecks.statusTrainingArtifactEligible == true and
              .gateChecks.auditPassed == true and
              .gateChecks.auditTrainingArtifactEligible == true and
              .gateChecks.auditFullCorpus == true and
              .gateChecks.manifestAuditPassed == true and
              .gateChecks.manifestReleaseGatePassed == true and
              .gateChecks.manifestTrainingArtifactEligible == true and
              .gateChecks.evaluationReleaseGatePassed == true and
              .gateChecks.futureTestReported == true and
              .gateChecks.futureTestNotUsedForTraining == true and
              .gateChecks.rawPropensityOutput == true and
              .gateChecks.noCandidateProbabilityFloor == true and
              .gateChecks.noIpsClippingInBehavioral == true and
              .gateChecks.observedOnlyFloorSensitivity == true and
              .gateChecks.rawAuditProbabilityContract == true and
              .gateChecks.auditPropensityFloorNotApplied == true and
              .gateChecks.sourceDatasetShaMatches == true and
              .manifest.trainingContract.propensityOutput == "RAW_SOFTMAX_WITHIN_DECISION" and
              .manifest.trainingContract.candidateProbabilityFloorApplied == false and
              .manifest.trainingContract.ipsClippingApplied == false and
              .manifest.trainingContract.probabilityFloorSensitivity == "OBSERVED_PROPENSITY_CLIP_ONLY" and
              .manifest.options.maxRows == null and
              .manifest.options.diagnosticMatchModulo == null and
              .manifest.options.diagnosticMatchRemainder == null and
              .manifest.artifacts.propensities.compression == "GZIP" and
              .evaluation.futureTestPolicy.reported == true and
              .evaluation.futureTestPolicy.usedForTraining == false and
              .fullTrainingAuthorized == true and
              .valueV8TrainingAuthorized == false and
              .passiveShadowAuthorized == false and
              .randomizedCanaryAuthorized == false
            ' "$evidence" || verification_exit=1
          fi

          if sudo test -s "$output/manifest.json"; then
            manifest="$(sudo cat "$output/manifest.json")"
            model_sha="$(sudo sha256sum "$output/model.json" | awk '{print $1}')"
            propensities_sha="$(sudo sha256sum "$output/propensities.ndjson" | awk '{print $1}')"
            evaluation_sha="$(sudo sha256sum "$output/evaluation.json" | awk '{print $1}')"
            audit_sha="$(sudo sha256sum "$output/audit.json" | awk '{print $1}')"
            manifest_sha="$(sudo sha256sum "$output/manifest.json" | awk '{print $1}')"
            test "$model_sha" = "$(jq -r '.artifacts.model.sha256' <<<"$manifest")" || verification_exit=1
            test "$propensities_sha" = "$(jq -r '.artifacts.propensities.sha256' <<<"$manifest")" || verification_exit=1
            test "$evaluation_sha" = "$(jq -r '.artifacts.evaluation.sha256' <<<"$manifest")" || verification_exit=1
            test "$audit_sha" = "$(jq -r '.artifacts.audit.sha256' <<<"$manifest")" || verification_exit=1
          else
            model_sha='missing'
            propensities_sha='missing'
            evaluation_sha='missing'
            audit_sha='missing'
            manifest_sha='missing'
          fi

          {
            echo "gitSha=$GITHUB_SHA"
            echo "runId=$GITHUB_RUN_ID"
            echo "trainingExit=$training_exit"
            echo "verificationExit=$verification_exit"
            echo "sourceDatasetSha256=${{ steps.preflight.outputs.expected_dataset_sha }}"
            echo "sweepSummarySha256=${{ steps.preflight.outputs.expected_sweep_sha }}"
            echo "diagnosticSampleSha256=${{ steps.preflight.outputs.expected_sample_sha }}"
            echo "selectedVariant=B"
            echo "readOnlySource=true"
            echo "fullTrainingAuthorized=true"
            echo "valueV8TrainingAuthorized=false"
            echo "productionRankingChanged=false"
            echo "passiveShadowActivated=false"
            echo "randomizedCanaryAuthorized=false"
            echo "projectedKiB=${{ steps.preflight.outputs.projected_kib }}"
            echo "availableKiBAtStart=${{ steps.preflight.outputs.available_kib }}"
            echo "modelSha256=$model_sha"
            echo "propensitiesSha256=$propensities_sha"
            echo "evaluationSha256=$evaluation_sha"
            echo "auditSha256=$audit_sha"
            echo "manifestSha256=$manifest_sha"
            echo '=== evidence ==='
            if [ -s "$evidence" ]; then jq '.' "$evidence"; else echo 'missing'; fi
            echo '=== storage ==='
            sudo df -hT "$storage"
            sudo du -sh "$output" 2>/dev/null || true
          } | tee "$evidence_dir/full-training-report.txt"

          if [ "$training_exit" != '0' ] || [ "$verification_exit" != '0' ]; then
            exit 1
          fi

      - name: Upload full-training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-behavioral-v5-1-full-${{ github.run_id }}
          path: |
            ${{ steps.preflight.outputs.evidence_dir }}/full-training-evidence.json
            ${{ steps.preflight.outputs.evidence_dir }}/full-training-report.txt
            ${{ steps.preflight.outputs.evidence_dir }}/container.log
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient Docker image
        if: always()
        shell: bash
        run: |
          sudo docker image rm -f "deadlock-behavioral-v5-1-full:$GITHUB_RUN_ID" >/dev/null 2>&1 || true

name: Enforce Behavioral V5.1 Feature Version In V8

on:
  pull_request:
    paths:
      - 'scripts/enforce-recommendation-behavioral-v5-1-feature-version-in-v8.py'
      - '.github/workflows/enforce-recommendation-behavioral-v5-1-feature-version-in-v8.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python3 scripts/enforce-recommendation-behavioral-v5-1-feature-version-in-v8.py
      - run: |
          set -euo pipefail
          git diff --check
          grep -q 'manifest.featureVersion !== RECOMMENDATION_BEHAVIORAL_V5_FEATURE_VERSION' apps/api/src/deadlock-live/recommendation-value-v8-diagnostic-training.service.ts
          grep -q 'value.featureVersion !== RECOMMENDATION_BEHAVIORAL_V5_FEATURE_VERSION' apps/api/src/deadlock-live/recommendation-value-v8-diagnostic-training.service.ts
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/deadlock-live/recommendation-value-v8-diagnostic-training.service.ts
          git commit -m 'fix: enforce Behavioral V5.1 feature version in V8'
          git push origin HEAD:${GITHUB_HEAD_REF}

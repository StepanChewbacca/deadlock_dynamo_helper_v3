name: Recommendation Dataset Export

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: Immutable dataset id to create
        required: true
        type: string
      candidate_generator_version:
        description: Candidate generator version frozen for the dataset
        required: true
        type: string
      action_contract_version:
        description: Action contract version
        required: true
        default: recommendation-actions-v1
        type: string
      train_from:
        description: TRAIN start, ISO-8601 UTC
        required: true
        type: string
      train_to:
        description: TRAIN end / VALIDATION start, ISO-8601 UTC
        required: true
        type: string
      validation_to:
        description: VALIDATION end / SHADOW_HOLDOUT start, ISO-8601 UTC
        required: true
        type: string
      shadow_holdout_to:
        description: SHADOW_HOLDOUT end / FUTURE_TEST start, ISO-8601 UTC
        required: true
        type: string
      future_test_to:
        description: FUTURE_TEST end, ISO-8601 UTC
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recommendation-dataset-export
  cancel-in-progress: false

jobs:
  export-dataset-v8:
    environment: recommendation-dataset-export
    runs-on: [self-hosted, linux, x64, recommendation-dataset-export]
    timeout-minutes: 180
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL: ${{ vars.DB_SSL }}
      DB_SSL_REJECT_UNAUTHORIZED: ${{ vars.DB_SSL_REJECT_UNAUTHORIZED }}
    steps:
      - name: Checkout frozen exporter
        uses: actions/checkout@v4

      - name: Validate secure export runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RECOMMENDATION_DATASET_OUTPUT_ROOT:-}" || { echo "RECOMMENDATION_DATASET_OUTPUT_ROOT is required on the secure runner" >&2; exit 1; }
          case "$RECOMMENDATION_DATASET_OUTPUT_ROOT" in
            /*) ;;
            *) echo "RECOMMENDATION_DATASET_OUTPUT_ROOT must be absolute" >&2; exit 1 ;;
          esac
          OUTPUT_DIR="$RECOMMENDATION_DATASET_OUTPUT_ROOT/${{ inputs.dataset_id }}"
          test ! -e "$OUTPUT_DIR" || { echo "Immutable dataset output already exists: $OUTPUT_DIR" >&2; exit 1; }
          mkdir -p "$OUTPUT_DIR"
          rmdir "$OUTPUT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install repository dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared contracts
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build deterministic domain
        run: yarn workspace @deadlock-live-probe/build-domain build

      - name: Create frozen export config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/recommendation-dataset-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          python3 - "$CONFIG" "$OUTPUT_DIR" <<'PY'
          import json, os, sys
          config = {
              "datasetId": "${{ inputs.dataset_id }}",
              "sourceCommitSha": os.environ["GITHUB_SHA"],
              "actionContractVersion": "${{ inputs.action_contract_version }}",
              "candidateGeneratorVersion": "${{ inputs.candidate_generator_version }}",
              "outputDir": sys.argv[2],
              "maximumAlignmentAgeMs": 5000,
              "maximumHistoryEvents": 64,
              "minimumDevelopmentExportCoverage": 0.99,
              "splits": [
                  {"split": "TRAIN", "from": "${{ inputs.train_from }}", "to": "${{ inputs.train_to }}"},
                  {"split": "VALIDATION", "from": "${{ inputs.train_to }}", "to": "${{ inputs.validation_to }}"},
                  {"split": "SHADOW_HOLDOUT", "from": "${{ inputs.validation_to }}", "to": "${{ inputs.shadow_holdout_to }}"},
                  {"split": "FUTURE_TEST", "from": "${{ inputs.shadow_holdout_to }}", "to": "${{ inputs.future_test_to }}"},
              ],
          }
          with open(sys.argv[1], "x", encoding="utf-8") as handle:
              json.dump(config, handle, indent=2)
              handle.write("\n")
          PY
          echo "EXPORT_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Require prospective-data preflight
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace @deadlock-live-probe/api recommendation:dataset:preflight "$EXPORT_CONFIG" \
            | tee "$RUNNER_TEMP/recommendation-dataset-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

      - name: Export immutable Recommendation Dataset V8
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace @deadlock-live-probe/api recommendation:dataset:export "$EXPORT_CONFIG" \
            | tee "$RUNNER_TEMP/recommendation-dataset-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

      - name: Emit registry handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUTPUT_DIR" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "manifest.json").read_text())
          def canonical(value):
              if value is None or isinstance(value, (bool, int, float, str)):
                  return json.dumps(value, separators=(",", ":"), ensure_ascii=False)
              if isinstance(value, list):
                  return "[" + ",".join(canonical(v) for v in value) + "]"
              return "{" + ",".join(json.dumps(k) + ":" + canonical(value[k]) for k in sorted(value)) + "}"
          handoff = {
              "status": "EXPORTED_NOT_REGISTERED",
              "datasetId": manifest["datasetId"],
              "datasetSha256": manifest["datasetSha256"],
              "manifestSha256": hashlib.sha256(canonical(manifest).encode()).hexdigest(),
              "outputDir": str(root),
              "futureTestTouched": False,
              "futureTestDiagnosticMetricsExposed": False,
              "nextRequiredStep": "Upload the directory to an approved immutable object store, register the manifest, independently verify exact file hashes, then use the verified dataset id for training preflight.",
          }
          (root / "registry-handoff.json").write_text(json.dumps(handoff, indent=2) + "\n")
          print(json.dumps(handoff))
          PY

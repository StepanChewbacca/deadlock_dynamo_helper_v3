name: Statlocker Adaptive Production Deploy

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-adaptive-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statlocker-adaptive-production-smoke
  cancel-in-progress: true

jobs:
  deploy-production:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify ARM64 production runner
        shell: bash
        run: |
          set -Eeuo pipefail
          arch="$(uname -m)"
          echo "runner=${RUNNER_NAME:-unknown} arch=${arch}"
          case "$arch" in
            aarch64|arm64) ;;
            *) echo "Expected ARM64 production runner, got ${arch}" >&2; exit 1 ;;
          esac
          command -v python3 >/dev/null
          command -v curl >/dev/null
          sudo docker version
          sudo docker compose version
          df -h /

      - name: Build production image natively on ARM64
        shell: bash
        run: |
          set -Eeuo pipefail
          image="deadlock-adaptive-production:${GITHUB_SHA}"
          sudo docker build --platform linux/arm64 -t "$image" .
          sudo docker run --rm --entrypoint sh "$image" -c \
            'test -x "$CHROMIUM_PATH" && node -e "require(\"puppeteer-core\"); require(\"@deadlock-live-probe/build-domain\")"'
          echo "ADAPTIVE_PRODUCTION_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy full adaptive API with rollback protection
        shell: bash
        env:
          DOMAIN: aboba-telegramovich.duckdns.org
        run: |
          set -Eeuo pipefail

          smoke_match="adaptive-prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_player="adaptive-prod-local-${GITHUB_RUN_ID}"
          override="$RUNNER_TEMP/statlocker-adaptive-production.override.yml"
          rollback_tag="deadlock-adaptive-rollback:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mutated=0
          previous_image_ref=''
          previous_image_id=''
          project=''
          working_dir=''
          config_files=''
          db_host=''
          db_user=''
          db_name=''

          api_container="$(sudo docker ps --filter 'label=com.docker.compose.service=api' --format '{{.Names}}' | head -n 1 || true)"
          [ -n "$api_container" ] || { echo 'Production Compose API container not found' >&2; exit 1; }

          project="$(sudo docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$api_container")"
          working_dir="$(sudo docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$api_container")"
          config_files="$(sudo docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$api_container")"
          previous_image_id="$(sudo docker inspect -f '{{.Image}}' "$api_container")"
          previous_image_ref="$(sudo docker inspect -f '{{.Config.Image}}' "$api_container")"
          db_env="$(sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$api_container")"
          db_host="$(printf '%s\n' "$db_env" | sed -n 's/^DB_HOST=//p' | head -n 1)"
          db_user="$(printf '%s\n' "$db_env" | sed -n 's/^DB_USER=//p' | head -n 1)"
          db_name="$(printf '%s\n' "$db_env" | sed -n 's/^DB_NAME=//p' | head -n 1)"

          [ -n "$project" ] && [ -n "$working_dir" ] && [ -n "$config_files" ]
          [ -d "$working_dir" ]
          [ -n "$previous_image_id" ] && [ -n "$previous_image_ref" ]
          [ -n "$db_host" ] && [ -n "$db_user" ] && [ -n "$db_name" ]
          sudo docker inspect "$db_host" >/dev/null
          case "$previous_image_ref" in
            *@sha256:*) echo "Production image reference is immutable digest and cannot be promoted safely: $previous_image_ref" >&2; exit 1 ;;
          esac

          compose_args=(sudo docker compose --project-name "$project" --project-directory "$working_dir")
          IFS=',' read -ra compose_files <<< "$config_files"
          for config_file in "${compose_files[@]}"; do
            [[ "$config_file" = /* ]] || config_file="$working_dir/$config_file"
            [ -f "$config_file" ] || { echo "Missing production Compose file: $config_file" >&2; exit 1; }
            compose_args+=(-f "$config_file")
          done

          wait_baseline() {
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --max-time 10 \
                'http://127.0.0.1:3000/deadlock/live/build-recommendations/status' >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          wait_adaptive() {
            local output="$1"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --max-time 10 \
                'http://127.0.0.1:3000/deadlock/adaptive/v1/status' -o "$output"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          legacy_catalog_counts() {
            sudo docker exec "$db_host" psql -At -v ON_ERROR_STOP=1 -U "$db_user" -d "$db_name" \
              -c "SELECT (SELECT COUNT(*) FROM item_catalog_versions)::text || '|' || (SELECT COUNT(*) FROM item_catalog_items)::text || '|' || (SELECT COUNT(*) FROM item_catalog_recipes)::text;"
          }

          cleanup_smoke() {
            local current
            current="$("${compose_args[@]}" ps -q api 2>/dev/null || true)"
            if [ -n "$current" ]; then
              sudo docker exec "$current" rm -f "/app/apps/api/storage/deadlock-live/${smoke_match}.ndjson" || true
            fi
            if sudo docker exec "$db_host" psql -At -v ON_ERROR_STOP=1 -U "$db_user" -d "$db_name" \
              -c "SELECT to_regclass('public.adaptive_recommendation_decisions_v1') IS NOT NULL;" | grep -qx 't'; then
              sudo docker exec "$db_host" psql -v ON_ERROR_STOP=1 -U "$db_user" -d "$db_name" \
                -c "DELETE FROM adaptive_recommendation_decisions_v1 WHERE \"matchId\" = '${smoke_match}';" >/dev/null || true
            fi
          }

          rollback() {
            echo "Rolling production API back to ${previous_image_id}" >&2
            sudo docker tag "$rollback_tag" "$previous_image_ref" || sudo docker tag "$previous_image_id" "$previous_image_ref" || true
            "${compose_args[@]}" up -d --no-deps --force-recreate --no-build api || true
            wait_baseline || true
          }

          on_exit() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$mutated" -eq 1 ]; then
              rollback
            fi
            cleanup_smoke || true
            exit "$status"
          }
          trap on_exit EXIT

          legacy_before="$(legacy_catalog_counts)"
          candidate_image_id="$(sudo docker image inspect -f '{{.Id}}' "$ADAPTIVE_PRODUCTION_IMAGE")"
          sudo docker tag "$previous_image_id" "$rollback_tag"
          sudo docker tag "$ADAPTIVE_PRODUCTION_IMAGE" "$previous_image_ref"

          cat > "$override" <<EOF
          services:
            api:
              image: ${previous_image_ref}
              environment:
                DB_RUN_MIGRATIONS: 'true'
                CHROMIUM_PATH: /usr/bin/chromium-browser
          EOF

          mutated=1
          "${compose_args[@]}" -f "$override" up -d --no-deps --force-recreate --no-build api
          wait_adaptive "$RUNNER_TEMP/adaptive-production-status.json" || {
            current="$("${compose_args[@]}" ps -q api 2>/dev/null || true)"
            [ -z "$current" ] || sudo docker logs --tail 300 "$current" || true
            exit 1
          }

          current="$("${compose_args[@]}" ps -q api)"
          running_image_id="$(sudo docker inspect -f '{{.Image}}' "$current")"
          [ "$running_image_id" = "$candidate_image_id" ] || {
            echo "Production image mismatch: expected $candidate_image_id got $running_image_id" >&2
            exit 1
          }

          migration_count="$(sudo docker exec "$db_host" psql -At -v ON_ERROR_STOP=1 -U "$db_user" -d "$db_name" \
            -c "SELECT COUNT(*) FROM migrations WHERE name = 'CreateRecommendationRuntimeTables1788220800000';")"
          [ "$migration_count" = '1' ] || { echo "Adaptive migration count is $migration_count" >&2; exit 1; }

          missing_tables="$(sudo docker exec "$db_host" psql -At -v ON_ERROR_STOP=1 -U "$db_user" -d "$db_name" -c "SELECT string_agg(name, ',') FROM (VALUES
            ('adaptive_recommendation_decisions_v1'),('model_bundle_registry_v1'),('recommendation_dataset_registry_v1'),
            ('recommendation_decision_candidates_v8'),('recommendation_decisions_v8'),('recommendation_evidence_snapshots_v8'),
            ('recommendation_exposure_acks_v8'),('recommendation_roadmap_evidence_v1'),('recommendation_telemetry_events'),
            ('recommendation_telemetry_rejections_v8'),('recommendation_value_dataset_registry_v1'),('souls_affordability_evidence_v2'),
            ('statlocker_evidence_snapshots_v1'),('recommendation_item_catalog_versions_v1'),('recommendation_item_catalog_items_v1'),
            ('recommendation_item_catalog_recipes_v1')) AS required(name) WHERE to_regclass('public.' || name) IS NULL;")"
          [ -z "$missing_tables" ] || { echo "Missing adaptive tables: $missing_tables" >&2; exit 1; }

          legacy_after="$(legacy_catalog_counts)"
          [ "$legacy_after" = "$legacy_before" ] || {
            echo "Legacy catalog changed: ${legacy_before} -> ${legacy_after}" >&2
            exit 1
          }

          recommendation_catalog="$(sudo docker exec "$db_host" psql -At -v ON_ERROR_STOP=1 -U "$db_user" -d "$db_name" \
            -c "SELECT (SELECT COUNT(*) FROM recommendation_item_catalog_versions_v1)::text || '|' || (SELECT COUNT(*) FROM recommendation_item_catalog_items_v1)::text;")"
          versions="${recommendation_catalog%%|*}"
          items="${recommendation_catalog##*|}"
          [ "$versions" -gt 0 ] && [ "$items" -gt 0 ] || {
            echo "Recommendation catalog did not bootstrap: $recommendation_catalog" >&2
            exit 1
          }

          curl -k --fail --silent --show-error --max-time 20 \
            --resolve "${DOMAIN}:443:127.0.0.1" \
            "https://${DOMAIN}/deadlock/adaptive/v1/status" \
            -o "$RUNNER_TEMP/adaptive-production-public-status.json"

          SMOKE_MATCH="$smoke_match" SMOKE_PLAYER="$smoke_player" python3 - "$RUNNER_TEMP/adaptive-production-events.json" <<'PY'
          import json, os, sys, time
          from pathlib import Path
          match_id = os.environ['SMOKE_MATCH']
          local_id = os.environ['SMOKE_PLAYER']
          now = int(time.time() * 1000)
          events = [
              {'matchId': match_id, 'receivedAt': now, 'source': 'onInfoUpdates2', 'key': 'match_id', 'payload': match_id},
              {'matchId': match_id, 'receivedAt': now + 1, 'source': 'onInfoUpdates2', 'key': 'match_clock', 'payload': '12:00'},
              {'matchId': match_id, 'receivedAt': now + 2, 'source': 'onInfoUpdates2', 'key': 'roster_0', 'payload': {
                  'steam_id': local_id, 'player_name': 'Adaptive Production Smoke', 'is_local': True,
                  'hero_id': 6, 'hero_name': 'Abrams', 'team': 1, 'lane': 1, 'level': 8, 'souls': 5000,
                  'health': 900, 'max_health': 1200, 'kills': 2, 'deaths': 1, 'assists': 4}},
              {'matchId': match_id, 'receivedAt': now + 3, 'source': 'onInfoUpdates2', 'key': 'roster_1', 'payload': {
                  'steam_id': 'adaptive-production-enemy', 'player_name': 'Adaptive Production Enemy', 'is_local': False,
                  'hero_id': 13, 'hero_name': 'Haze', 'team': 2, 'lane': 2, 'level': 8, 'souls': 5200,
                  'health': 800, 'max_health': 1000, 'kills': 3, 'deaths': 2, 'assists': 2}},
              {'matchId': match_id, 'receivedAt': now + 4, 'source': 'onInfoUpdates2', 'key': 'items_0', 'payload': {
                  'steam_id': local_id, 'items': [
                      {'id': 668299740, 'name': 'Rapid Rounds', 'class_name': 'upgrade_rapid_rounds', 'enhanced': False},
                      {'id': 558396679, 'name': 'Enduring Spirit', 'class_name': 'upgrade_resilience', 'enhanced': False},
                      {'id': 465043967, 'name': 'Spirit Strike', 'class_name': 'upgrade_acolytes_glove', 'enhanced': False}]}}
          ]
          Path(sys.argv[1]).write_text(json.dumps({'clientId': f'adaptive-prod-{match_id}', 'events': events}), encoding='utf-8')
          PY

          curl --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' \
            -X POST 'http://127.0.0.1:3000/deadlock/live/events' \
            --data-binary "@$RUNNER_TEMP/adaptive-production-events.json" >/dev/null

          printf '{"matchId":"%s","localSteamId":"%s"}' "$smoke_match" "$smoke_player" > "$RUNNER_TEMP/adaptive-production-request.json"
          curl --fail --silent --show-error --max-time 30 -H 'Content-Type: application/json' \
            -X POST 'http://127.0.0.1:3000/deadlock/adaptive/v1/recommend' \
            --data-binary "@$RUNNER_TEMP/adaptive-production-request.json" \
            -o "$RUNNER_TEMP/adaptive-production-recommendation.json"

          python3 - "$RUNNER_TEMP/adaptive-production-recommendation.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if result.get('ready') is not True:
              raise SystemExit(f"Adaptive recommendation not ready: {result.get('blockers')}")
          action = (result.get('nextAction') or {}).get('type')
          allowed = {'BUY','UPGRADE','SELL','REPLACE','WAIT','HOLD','CONTINUE_CORE','ABSTAIN'}
          if action not in allowed:
              raise SystemExit(f'Unexpected adaptive action: {action}')
          blockers = set(result.get('blockers') or [])
          if 'STATLOCKER_EVIDENCE_UNAVAILABLE' in blockers and action not in {'WAIT','HOLD','ABSTAIN'}:
              raise SystemExit('Unavailable Statlocker evidence produced a transaction action')
          if not re.fullmatch(r'[a-f0-9]{64}', str(result.get('stateRevision') or '')):
              raise SystemExit('Adaptive stateRevision is missing or invalid')
          PY

          sudo docker logs --since 10m "$current" > "$RUNNER_TEMP/adaptive-production-api.log" 2>&1 || true
          if grep -Eiq 'RecommendationBehavioralServing|RecommendationValueServing|RecommendationPolicyServing|Behavioral model invocation|Value model invocation|Policy model invocation' "$RUNNER_TEMP/adaptive-production-api.log"; then
            echo 'Legacy ML serving invocation marker found in production adaptive path' >&2
            exit 1
          fi

          cleanup_smoke
          mutated=0
          trap - EXIT
          echo "Production adaptive deploy succeeded: commit=${GITHUB_SHA} image=${candidate_image_id} previous=${previous_image_id}"

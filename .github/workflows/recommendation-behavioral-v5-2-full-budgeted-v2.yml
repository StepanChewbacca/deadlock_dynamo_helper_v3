name: Recommendation Behavioral V5.2 Full V2 Budgeted

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-behavioral-v5-2-full-v2.json'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v5-2-full-v2
  cancel-in-progress: true

jobs:
  full-training-v2:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout requested implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate explicit authorization, corrected refinement, and readiness SHA
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-behavioral-v5-2-full-v2.json'
          test -s "$request"
          jq -e '
            .schemaVersion == 1 and
            .executorVersion == "READINESS_PINNED_2" and
            .operation == "RECOMMENDATION_BEHAVIORAL_V5_2_FULL_TRAINING" and
            .fullTrainingAuthorized == true and
            .maximumTrainingMinutes == 20 and
            .valueV8TrainingAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowAuthorized == false and
            .randomizedCanaryAuthorized == false and
            .sourceDirectory == "recommendation-pro-decision-dataset-v6-terminal-5000-v2" and
            .refinementDirectory == "recommendation-behavioral-v5-2-refinement-v3" and
            .readinessDirectory == "recommendation-behavioral-v5-2-full-readiness-v2" and
            .outputDirectory == "recommendation-behavioral-v5-2-full-v2"
          ' "$request"
          node --check scripts/run-recommendation-behavioral-v5-2-full.mjs

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          source_name="$(jq -r '.sourceDirectory' "$request")"
          refinement_name="$(jq -r '.refinementDirectory' "$request")"
          readiness_name="$(jq -r '.readinessDirectory' "$request")"
          output_name="$(jq -r '.outputDirectory' "$request")"
          source="$storage/$source_name"
          refinement="$storage/$refinement_name/refinement-summary.json"
          readiness="$storage/$readiness_name/readiness-report.json"
          output="$storage/$output_name"
          dataset_sha="$(jq -r '.expectedDatasetSha256' "$request")"
          refinement_sha="$(jq -r '.expectedRefinementSummarySha256' "$request")"
          readiness_sha="$(jq -r '.expectedReadinessReportSha256' "$request")"
          [[ "$dataset_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$refinement_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$readiness_sha" =~ ^[a-f0-9]{64}$ ]]

          sudo test -s "$source/manifest.json"
          sudo test -s "$source/audit.json"
          sudo test -s "$refinement"
          sudo test -s "$readiness"
          test "$(sudo sha256sum "$source/$(sudo jq -r '.artifact.fileName' "$source/manifest.json")" | awk '{print $1}')" = "$dataset_sha"
          test "$(sudo sha256sum "$refinement" | awk '{print $1}')" = "$refinement_sha"
          test "$(sudo sha256sum "$readiness" | awk '{print $1}')" = "$readiness_sha"
          sudo jq -e '.auditPassed == true and .trainingArtifactEligible == true' "$source/manifest.json"
          sudo jq -e '.passed == true and .trainingArtifactEligible == true' "$source/audit.json"
          sudo jq -e '
            .executorVersion == "CANDIDATE_COVERAGE_FIXED_2" and
            .fullTrainingCandidatePrepared == true and
            .fullTrainingAuthorized == false and
            .valueV8TrainingAuthorized == false and
            .source.futureTestRowCount == 0
          ' "$refinement"
          selected="$(jq -c '.selectedConfiguration' "$request")"
          sudo jq -e \
            --arg dataset_sha "$dataset_sha" \
            --arg refinement_sha "$refinement_sha" \
            --argjson selected "$selected" '
              .schemaVersion == 2 and
              .executorVersion == "IMMUTABLE_COST_PROJECTION_2" and
              .source.datasetSha256 == $dataset_sha and
              .source.refinementSummarySha256 == $refinement_sha and
              .selectedConfiguration == $selected and
              .readyForExplicitCostDecision == true and
              .costProjection.hardTrainingBudgetMinutes == 20 and
              .costProjection.hardJobBudgetMinutes == 30 and
              .fullTrainingAuthorized == false and
              .valueV8TrainingAuthorized == false
            ' "$readiness"

          if sudo test -e "$output"; then
            echo "Refusing destructive reuse of existing output: $output" >&2
            exit 1
          fi
          sudo mkdir "$output"
          evidence_dir="$RUNNER_TEMP/recommendation-behavioral-v5-2-full-v2-$GITHUB_RUN_ID"
          mkdir -p "$evidence_dir"
          {
            echo "storage=$storage"
            echo "source_name=$source_name"
            echo "refinement_name=$refinement_name"
            echo "readiness_name=$readiness_name"
            echo "output_name=$output_name"
            echo "dataset_sha=$dataset_sha"
            echo "refinement_sha=$refinement_sha"
            echo "readiness_sha=$readiness_sha"
            echo "evidence_dir=$evidence_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Build isolated full-training image
        shell: bash
        run: |
          set -euo pipefail
          sudo docker build \
            --label deadlock.recommendation.operation=behavioral-v5-2-full-v2-budgeted \
            --label deadlock.recommendation.git-sha="$GITHUB_SHA" \
            -t "deadlock-behavioral-v5-2-full-v2:$GITHUB_RUN_ID" .

      - name: Run full training with hard 20-minute budget
        id: training
        shell: bash
        run: |
          set -uo pipefail
          storage='${{ steps.preflight.outputs.storage }}'
          source_name='${{ steps.preflight.outputs.source_name }}'
          refinement_name='${{ steps.preflight.outputs.refinement_name }}'
          output_name='${{ steps.preflight.outputs.output_name }}'
          evidence_dir='${{ steps.preflight.outputs.evidence_dir }}'
          container_name="deadlock-behavioral-v5-2-full-v2-$GITHUB_RUN_ID"
          image="deadlock-behavioral-v5-2-full-v2:$GITHUB_RUN_ID"

          set +e
          timeout --signal=TERM --kill-after=60s 20m sudo docker run --rm \
            --name "$container_name" \
            --stop-timeout 15 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -e NODE_OPTIONS=--max-old-space-size=6144 \
            -e BEHAVIORAL_V5_2_FULL_REQUEST_PATH='/app/.github/training-requests/recommendation-behavioral-v5-2-full-v2.json' \
            -e DEADLOCK_RECOMMENDATION_BEHAVIORAL_V5_2_SOURCE_DIR="/app/apps/api/storage/$source_name" \
            -e DEADLOCK_RECOMMENDATION_BEHAVIORAL_V5_2_DIR="/app/apps/api/storage/$output_name" \
            -e BEHAVIORAL_V5_2_REFINEMENT_SUMMARY_PATH="/app/apps/api/storage/$refinement_name/refinement-summary.json" \
            -e BEHAVIORAL_V5_2_FULL_EVIDENCE_PATH='/evidence/full-training-evidence.json' \
            -e EXPECTED_DATASET_SHA256='${{ steps.preflight.outputs.dataset_sha }}' \
            -e EXPECTED_REFINEMENT_SUMMARY_SHA256='${{ steps.preflight.outputs.refinement_sha }}' \
            -v "$storage/$source_name:/app/apps/api/storage/$source_name:ro" \
            -v "$storage/$refinement_name:/app/apps/api/storage/$refinement_name:ro" \
            -v "$storage/$output_name:/app/apps/api/storage/$output_name:rw" \
            -v "$evidence_dir:/evidence:rw" \
            "$image" node /app/scripts/run-recommendation-behavioral-v5-2-full.mjs \
            2>&1 | tee "$evidence_dir/container.log"
          training_exit="${PIPESTATUS[0]}"
          set -e
          if [ "$training_exit" = '124' ] || [ "$training_exit" = '137' ]; then
            sudo docker stop --time 15 "$container_name" >/dev/null 2>&1 || true
            sudo docker rm -f "$container_name" >/dev/null 2>&1 || true
          fi
          echo "exit_code=$training_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify full-training gates and pinned readiness
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.training.outputs.exit_code }}' = '0'
          output='${{ steps.preflight.outputs.storage }}/${{ steps.preflight.outputs.output_name }}'
          evidence='${{ steps.preflight.outputs.evidence_dir }}/full-training-evidence.json'
          sudo test -s "$output/manifest.json"
          test -s "$evidence"
          jq -e '
            .gateChecks.structuralAuditPassed == true and
            .gateChecks.releaseGatePassed == true and
            .gateChecks.trainingArtifactEligible == true and
            .gateChecks.fullCorpus == true and
            .gateChecks.candidateCoverage == true and
            .gateChecks.behaviorSupportCoverage == true and
            .gateChecks.noMajorLowSupportGroups == true and
            .gateChecks.extremeCandidateProbabilityRate == true and
            .gateChecks.floorSensitivity == true and
            .gateChecks.futureNotTraining == true and
            .gateChecks.futureNotSelection == true and
            .gateChecks.futureNotEvaluated == true and
            .valueV8TrainingAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowAuthorized == false and
            .randomizedCanaryAuthorized == false
          ' "$evidence"
          {
            echo "readinessReportSha256=${{ steps.preflight.outputs.readiness_sha }}"
            echo "refinementSummarySha256=${{ steps.preflight.outputs.refinement_sha }}"
            echo "datasetSha256=${{ steps.preflight.outputs.dataset_sha }}"
          } > '${{ steps.preflight.outputs.evidence_dir }}/pinned-readiness.txt'

      - name: Upload full-training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-behavioral-v5-2-full-v2-${{ github.run_id }}
          path: ${{ steps.preflight.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup transient container and image
        if: always()
        shell: bash
        run: |
          sudo docker rm -f "deadlock-behavioral-v5-2-full-v2-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          sudo docker image rm "deadlock-behavioral-v5-2-full-v2:$GITHUB_RUN_ID" >/dev/null 2>&1 || true

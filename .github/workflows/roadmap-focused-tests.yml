name: Roadmap Focused Tests

on:
  push:
    branches:
      - feat/threat-weighted-wpa-build
    paths:
      - '.github/workflows/roadmap-focused-tests.yml'
      - 'packages/deadlock-build-domain/**'
      - 'packages/shared/**'
      - 'apps/api/**'
      - 'apps/overwolf-client/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/threat-weighted-wpa-build
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Enable Yarn 1.22.22
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile

      - name: Run build-domain slot capability test
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace @deadlock-live-probe/build-domain test --runTestsByPath test/recommendation-category-slot-rules.spec.ts

      - name: Run API slot regression tests
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace @deadlock-live-probe/api test --runTestsByPath \
            test/adaptive-economy-12-flex-slots-v1.spec.ts \
            test/adaptive-economy-v1.spec.ts \
            test/adaptive-build-planner-capacity-v1.spec.ts \
            test/adaptive-decision-state-v1.spec.ts

      - name: Build API
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace @deadlock-live-probe/api build

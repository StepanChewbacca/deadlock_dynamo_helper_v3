name: Recommendation Behavioral V7 Temporal Audit V2

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-behavioral-v7-temporal-audit-v1.yml'
      - 'scripts/refine-recommendation-behavioral-v7-temporal-audit.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run semantic temporal audit
        shell: bash
        env:
          BEHAVIORAL_V7_OBSERVABILITY_INVENTORY_PATH: /var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data/recommendation-behavioral-v7-observability-inventory-v2/report.json
          BEHAVIORAL_V7_TEMPORAL_AUDIT_PATH: ${{ runner.temp }}/recommendation-behavioral-v7-temporal-audit-v2.json
        run: |
          set -euo pipefail
          node --check scripts/refine-recommendation-behavioral-v7-temporal-audit.mjs
          sudo test -s "$BEHAVIORAL_V7_OBSERVABILITY_INVENTORY_PATH"
          stage="$RUNNER_TEMP/v7-stage-a-report.json"
          sudo cp "$BEHAVIORAL_V7_OBSERVABILITY_INVENTORY_PATH" "$stage"
          sudo chown "$(id -u):$(id -g)" "$stage"
          BEHAVIORAL_V7_OBSERVABILITY_INVENTORY_PATH="$stage" node scripts/refine-recommendation-behavioral-v7-temporal-audit.mjs
          jq -e '.schemaVersion == 2 and .summary.stageBGatePassed == true and .contracts.futureTestEvaluated == false and .contracts.netWorthMayRepresentWallet == false' "$BEHAVIORAL_V7_TEMPORAL_AUDIT_PATH"

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          canonical="$storage/recommendation-behavioral-v7-temporal-audit-v2"
          run_output="$canonical/runs/${{ github.run_id }}-${{ github.run_attempt }}"
          sudo mkdir -p "$run_output"
          sudo install -m 0644 "$BEHAVIORAL_V7_TEMPORAL_AUDIT_PATH" "$run_output/report.json"
          if ! sudo test -s "$canonical/report.json"; then
            sudo mkdir -p "$canonical"
            sudo install -m 0644 "$BEHAVIORAL_V7_TEMPORAL_AUDIT_PATH" "$canonical/report.json"
          fi

      - name: Upload temporal evidence
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-behavioral-v7-temporal-audit-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-behavioral-v7-temporal-audit-v2.json
          retention-days: 14

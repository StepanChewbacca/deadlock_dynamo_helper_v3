name: Recommendation Model Register Verify

on:
  workflow_dispatch:
    inputs:
      bundle_dir:
        description: Pre-staged immutable model bundle directory on the protected runner
        required: true
        type: string
      artifact_base_uri:
        description: Approved immutable remote object-store URI containing the exact bundle
        required: true
        type: string
      verifier:
        description: Immutable artifact verifier identity
        required: true
        default: recommendation-protected-runner-v1
        type: string

permissions:
  contents: read

concurrency:
  group: recommendation-model-register-verify
  cancel-in-progress: false

jobs:
  register-verify:
    environment: recommendation-artifact-registry
    runs-on: [self-hosted, linux, x64, recommendation-artifact-registry]
    timeout-minutes: 30
    env:
      BUNDLE_DIR_INPUT: ${{ inputs.bundle_dir }}
      ARTIFACT_BASE_URI: ${{ inputs.artifact_base_uri }}
      VERIFIER: ${{ inputs.verifier }}
      REGISTRY_API_BASE_URL: ${{ vars.RECOMMENDATION_ARTIFACT_API_BASE_URL }}
      ARTIFACT_TOKEN: ${{ secrets.RECOMMENDATION_ARTIFACT_REGISTRY_TOKEN }}
    steps:
      - name: Checkout frozen registry handoff code
        uses: actions/checkout@v4

      - name: Validate immutable bundle and remote identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RECOMMENDATION_MODEL_STAGING_ROOT:-}" || { echo "RECOMMENDATION_MODEL_STAGING_ROOT is required" >&2; exit 1; }
          test -n "$REGISTRY_API_BASE_URL" || { echo "RECOMMENDATION_ARTIFACT_API_BASE_URL is required" >&2; exit 1; }
          test -n "$ARTIFACT_TOKEN" || { echo "RECOMMENDATION_ARTIFACT_REGISTRY_TOKEN is required" >&2; exit 1; }
          case "$ARTIFACT_BASE_URI" in s3://*|gs://*|https://*) ;; *) echo "artifact_base_uri must use s3, gs, or https" >&2; exit 1;; esac
          [[ "$ARTIFACT_BASE_URI" != *".."* ]] || { echo "artifact_base_uri contains parent traversal" >&2; exit 1; }
          [[ "$VERIFIER" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "verifier identity is invalid" >&2; exit 1; }
          STAGING_ROOT="$(realpath -e "$RECOMMENDATION_MODEL_STAGING_ROOT")"
          BUNDLE_DIR="$(realpath -e "$BUNDLE_DIR_INPUT")"
          case "$BUNDLE_DIR" in "$STAGING_ROOT"/*) ;; *) echo "bundle_dir must be inside model staging root" >&2; exit 1;; esac
          test -f "$BUNDLE_DIR/manifest.json" || { echo "manifest.json is missing" >&2; exit 1; }
          REQUEST_DIR="$(mktemp -d "$RUNNER_TEMP/recommendation-model-registry-XXXXXX")"
          python3 - "$BUNDLE_DIR" "$REQUEST_DIR" <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          request_root = pathlib.Path(sys.argv[2])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          files = manifest.get("files")
          if not isinstance(files, list) or not files:
              raise SystemExit("Model manifest files are missing")
          verified = []
          for descriptor in files:
              relative = descriptor.get("path")
              if not isinstance(relative, str) or not relative or relative.startswith("/") or ".." in pathlib.PurePosixPath(relative).parts:
                  raise SystemExit("Unsafe model artifact path")
              path = root / relative
              raw = path.read_bytes()
              sha = hashlib.sha256(raw).hexdigest()
              if sha != descriptor.get("sha256") or len(raw) != descriptor.get("sizeBytes"):
                  raise SystemExit(f"Local artifact mismatch: {relative}")
              verified.append({"path": relative, "sha256": sha, "sizeBytes": len(raw)})
          register = {"manifest": manifest, "artifactBaseUri": os.environ["ARTIFACT_BASE_URI"]}
          (request_root / "register.json").write_text(json.dumps(register, separators=(",", ":")) + "\n", encoding="utf-8")
          (request_root / "verified-files.json").write_text(json.dumps(verified, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"
          echo "REQUEST_DIR=$REQUEST_DIR" >> "$GITHUB_ENV"

      - name: Register immutable model bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            -H "x-recommendation-artifact-token: $ARTIFACT_TOKEN" \
            --data-binary "@$REQUEST_DIR/register.json" \
            "$REGISTRY_API_BASE_URL/deadlock-live/recommendation-models/v1/register" \
            > "$REQUEST_DIR/register-response.json"
          python3 - "$REQUEST_DIR" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          response = json.loads((root / "register-response.json").read_text())
          files = json.loads((root / "verified-files.json").read_text())
          verify = {
              "modelId": response["modelId"],
              "modelVersion": response["modelVersion"],
              "verifier": os.environ["VERIFIER"],
              "manifestSha256": response["manifestSha256"],
              "files": files,
              "attestationRef": f"protected-runner://github/{os.environ['GITHUB_RUN_ID']}/{os.environ['GITHUB_RUN_ATTEMPT']}",
          }
          (root / "verify.json").write_text(json.dumps(verify, separators=(",", ":")) + "\n")
          PY

      - name: Independently verify exact artifact descriptors
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            -H "x-recommendation-artifact-token: $ARTIFACT_TOKEN" \
            --data-binary "@$REQUEST_DIR/verify.json" \
            "$REGISTRY_API_BASE_URL/deadlock-live/recommendation-models/v1/verify" \
            > "$REQUEST_DIR/verify-response.json"
          python3 - "$REQUEST_DIR/verify-response.json" <<'PY'
          import json, sys
          response = json.load(open(sys.argv[1], encoding="utf-8"))
          if response.get("status") != "VERIFIED":
              raise SystemExit("Model registry did not return VERIFIED")
          print(json.dumps({
              "status": "VERIFIED_NOT_ACTIVATED",
              "modelId": response.get("modelId"),
              "modelVersion": response.get("modelVersion"),
              "manifestSha256": response.get("manifestSha256"),
          }, sort_keys=True))
          PY

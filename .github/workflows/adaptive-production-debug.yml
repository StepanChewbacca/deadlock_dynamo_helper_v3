name: Adaptive Production Debug

on:
  workflow_dispatch:
  push:
    branches:
      - agent/live-inventory-evidence
    paths:
      - .github/workflows/adaptive-production-debug.yml

permissions:
  contents: read

concurrency:
  group: adaptive-production-debug
  cancel-in-progress: true

jobs:
  debug:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Compare production live state with adaptive response
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          container_id="$(sudo docker compose ps -q api)"
          sudo docker image inspect "$(sudo docker inspect --format='{{.Image}}' "$container_id")" --format='revision={{index .Config.Labels "org.opencontainers.image.revision"}}'

          python3 - <<'PY'
          import json
          import urllib.request

          BASE = 'http://127.0.0.1:3000'

          def get(path):
              with urllib.request.urlopen(BASE + path, timeout=15) as response:
                  return json.load(response)

          def post(path, body):
              request = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(body).encode('utf-8'),
                  headers={'content-type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          states = get('/deadlock/live/states')
          active = [m for m in states if isinstance(m, dict) and m.get('playersBySteamId')]
          if not active:
              raise SystemExit('No live match with players found')
          match = max(active, key=lambda m: str(m.get('lastUpdatedAt') or ''))
          locals_ = [
              (steam_id, player)
              for steam_id, player in (match.get('playersBySteamId') or {}).items()
              if player.get('isLocal') is True
          ]
          if len(locals_) != 1:
              raise SystemExit(f'Expected exactly one local player, got {len(locals_)}')
          _, local = locals_[0]
          owned_ids = [item.get('id') for item in (local.get('items') or [])]
          print('LIVE_STATE=' + json.dumps({
              'matchId': match.get('matchId'),
              'heroId': local.get('heroId'),
              'souls': local.get('souls'),
              'ownedItemIds': owned_ids,
              'ownedItems': [item.get('name') for item in (local.get('items') or [])],
          }, ensure_ascii=False))

          result = post('/deadlock/adaptive/v1/recommend', {'matchId': match.get('matchId')})
          print('ADAPTIVE_RESULT=' + json.dumps({
              'ready': result.get('ready'),
              'blockers': result.get('blockers'),
              'decisionId': result.get('decisionId'),
              'stateRevision': result.get('stateRevision'),
              'nextAction': result.get('nextAction'),
              'nextTargetItemId': result.get('nextTargetItemId'),
              'recommendedBuild': [
                  {
                      'itemId': item.get('itemId'),
                      'position': item.get('position'),
                      'status': item.get('status'),
                  }
                  for item in (result.get('recommendedBuild') or [])[:12]
              ],
              'changes': result.get('changes'),
          }, ensure_ascii=False))
          PY

name: Adaptive Production Debug

on:
  workflow_dispatch:
  push:
    branches:
      - agent/live-inventory-evidence
    paths:
      - .github/workflows/adaptive-production-debug.yml

permissions:
  contents: read

concurrency:
  group: adaptive-production-debug
  cancel-in-progress: true

jobs:
  debug:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Inspect production catalog ownership gap
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          container_id="$(sudo docker compose ps -q api)"
          sudo docker image inspect "$(sudo docker inspect --format='{{.Image}}' "$container_id")" --format='revision={{index .Config.Labels "org.opencontainers.image.revision"}}'

          sudo docker compose exec -T api node - <<'NODE'
          const { Client } = require('pg');

          const client = new Client({
            host: process.env.DB_HOST,
            port: Number(process.env.DB_PORT || 5432),
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            database: process.env.DB_NAME,
          });

          const pick = (row, names) => {
            for (const name of names) if (Object.prototype.hasOwnProperty.call(row, name)) return row[name];
            return undefined;
          };

          (async () => {
            await client.connect();
            const versionResult = await client.query('SELECT * FROM recommendation_item_catalog_versions_v1 ORDER BY "importedAt" DESC, "catalogVersionId" DESC LIMIT 1');
            const version = versionResult.rows[0];
            if (!version) throw new Error('No catalog version');
            const catalogVersionId = pick(version, ['catalogVersionId', 'catalog_version_id']);
            console.log('CATALOG_VERSION=' + JSON.stringify({
              catalogVersionId,
              contentCatalogVersionId: pick(version, ['contentCatalogVersionId', 'content_catalog_version_id']),
              clientVersion: pick(version, ['clientVersion', 'client_version']),
              rulesetKey: pick(version, ['rulesetKey', 'ruleset_key']),
              importedAt: pick(version, ['importedAt', 'imported_at']),
            }));

            const columns = await client.query(`
              SELECT column_name
              FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'recommendation_item_catalog_items_v1'
              ORDER BY ordinal_position
            `);
            console.log('ITEM_COLUMNS=' + JSON.stringify(columns.rows.map((row) => row.column_name)));

            const itemIdColumn = columns.rows.some((row) => row.column_name === 'itemId') ? '"itemId"' : 'item_id';
            const catalogIdColumn = columns.rows.some((row) => row.column_name === 'catalogVersionId') ? '"catalogVersionId"' : 'catalog_version_id';
            const items = await client.query(
              `SELECT * FROM recommendation_item_catalog_items_v1 WHERE ${catalogIdColumn} = $1 AND ${itemIdColumn} = ANY($2::bigint[]) ORDER BY ${itemIdColumn}`,
              [catalogVersionId, ['3862866912', '1437614329']],
            );
            console.log('CATALOG_ITEMS=' + JSON.stringify(items.rows.map((row) => ({
              itemId: String(pick(row, ['itemId', 'item_id'])),
              name: pick(row, ['name']),
              className: pick(row, ['className', 'class_name']),
              itemType: pick(row, ['itemType', 'item_type']),
              slotType: pick(row, ['slotType', 'slot_type']),
              cost: pick(row, ['cost']),
              tier: pick(row, ['tier']),
              shopable: pick(row, ['shopable']),
              disabled: pick(row, ['disabled']),
              active: pick(row, ['active']),
              isActiveItem: pick(row, ['isActiveItem', 'is_active_item']),
              activationType: pick(row, ['activationType', 'activation_type']),
            }))));
            await client.end();
          })().catch(async (error) => {
            console.error(error);
            try { await client.end(); } catch {}
            process.exit(1);
          });
          NODE

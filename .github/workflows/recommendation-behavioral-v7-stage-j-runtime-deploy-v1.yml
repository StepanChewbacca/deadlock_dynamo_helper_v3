name: Recommendation Behavioral V7 Stage J Runtime Deploy V1

on:
  pull_request:
    paths:
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/deadlock-live/hero-build-decision-dataset-v3.service.ts'
      - 'apps/api/src/deadlock-live/recommendation-observability-v7-*.ts'
      - 'apps/api/src/deadlock-live/recommendation-historical-pro-replay.ts'
      - 'apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v6.ts'
      - 'apps/api/src/deadlock-live/entities/match-player.entity.ts'
      - 'apps/api/src/recommendation-observability-v7-identity-schema.cli.ts'
      - 'docker-compose.yml'
      - '.github/workflows/recommendation-behavioral-v7-stage-j-runtime-deploy-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v7-stage-j-runtime-deploy-v1
  cancel-in-progress: false

jobs:
  deploy-stage-j-runtime:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Capture rollback target and enforce preflight readiness
        shell: bash
        run: |
          set -euo pipefail
          target='/home/ubuntu/apps/deadlock_dynamo_helper'
          test -d "$target"
          test -r "$target/.env"
          actual="$(git rev-parse HEAD)"
          expected='${{ github.event.pull_request.head.sha }}'
          test "$actual" = "$expected"

          mkdir -p "$RUNNER_TEMP/stage-j/rollback-source"
          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'storage' \
            --exclude '.git' \
            "$target/" "$RUNNER_TEMP/stage-j/rollback-source/"

          cd "$target"
          container_id="$(sudo docker compose --env-file .env ps -q api 2>/dev/null || true)"
          test -n "$container_id"
          image_id="$(sudo docker inspect --format='{{.Image}}' "$container_id")"
          image_ref="$(sudo docker inspect --format='{{.Config.Image}}' "$container_id")"
          health="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
          test "$health" = 'healthy'

          printf '%s\n' "$container_id" > "$RUNNER_TEMP/stage-j/previous-container-id.txt"
          printf '%s\n' "$image_id" > "$RUNNER_TEMP/stage-j/previous-image-id.txt"
          printf '%s\n' "$image_ref" > "$RUNNER_TEMP/stage-j/previous-image-ref.txt"
          git -C "$target" rev-parse HEAD > "$RUNNER_TEMP/stage-j/previous-source-head.txt" 2>/dev/null || true
          sudo docker inspect "$container_id" > "$RUNNER_TEMP/stage-j/previous-container-inspect.json"
          sudo docker compose --env-file .env config > "$RUNNER_TEMP/stage-j/previous-compose-config.yml"

          sudo docker compose --env-file .env exec -T api node - <<'NODE' > "$RUNNER_TEMP/stage-j/preflight-status.json"
          async function get(url) {
            const response = await fetch(url);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { rawText: text }; }
            return { url, httpStatus: response.status, httpOk: response.ok, body };
          }
          (async () => {
            const contextualV3 = await get('http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status');
            const liveBuildRecommendations = await get('http://127.0.0.1:3000/deadlock/live/build-recommendations/status');
            process.stdout.write(JSON.stringify({ contextualV3, liveBuildRecommendations }, null, 2) + '\n');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          jq -e '
            .contextualV3.httpOk == true and
            .contextualV3.body.mode == "PRODUCTION" and
            .contextualV3.body.model.state == "READY" and
            .liveBuildRecommendations.httpOk == true and
            (.liveBuildRecommendations.body.trackedMatchCount | type) == "number"
          ' "$RUNNER_TEMP/stage-j/preflight-status.json"

      - name: Transactional deploy with automatic rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          target='/home/ubuntu/apps/deadlock_dynamo_helper'
          evidence_root='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data/recommendation-behavioral-v7-stage-j-runtime-deploy-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}'
          mkdir -p "$RUNNER_TEMP/stage-j"
          mutation_started=false
          rollback_attempted=false
          rollback_succeeded=false

          verify_runtime() {
            local output="$1"
            cd "$target"
            local container_id
            container_id="$(sudo docker compose --env-file .env ps -q api 2>/dev/null || true)"
            test -n "$container_id"
            for attempt in $(seq 1 40); do
              local status
              status="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
              echo "API health status: $status ($attempt/40)"
              if [ "$status" = 'healthy' ]; then
                break
              fi
              if [ "$status" = 'unhealthy' ]; then
                return 1
              fi
              sleep 5
            done
            test "$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")" = 'healthy'

            sudo docker compose --env-file .env exec -T api node - <<'NODE' > "$output"
          async function get(url) {
            const response = await fetch(url);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { rawText: text }; }
            return { url, httpStatus: response.status, httpOk: response.ok, body };
          }
          (async () => {
            const contextualV3 = await get('http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status');
            const liveBuildRecommendations = await get('http://127.0.0.1:3000/deadlock/live/build-recommendations/status');
            process.stdout.write(JSON.stringify({ contextualV3, liveBuildRecommendations }, null, 2) + '\n');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
            jq -e '
              .contextualV3.httpOk == true and
              .contextualV3.body.mode == "PRODUCTION" and
              .contextualV3.body.model.state == "READY" and
              .liveBuildRecommendations.httpOk == true and
              (.liveBuildRecommendations.body.trackedMatchCount | type) == "number"
            ' "$output"
          }

          persist_evidence() {
            local deployment_status="$1"
            local rollback_status="$2"
            local current_container current_image
            cd "$target"
            current_container="$(sudo docker compose --env-file .env ps -q api 2>/dev/null || true)"
            current_image=''
            if [ -n "$current_container" ]; then
              current_image="$(sudo docker inspect --format='{{.Image}}' "$current_container" 2>/dev/null || true)"
            fi
            jq -n \
              --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg requestedHead '${{ github.event.pull_request.head.sha }}' \
              --arg deploymentStatus "$deployment_status" \
              --arg rollbackStatus "$rollback_status" \
              --arg previousContainerId "$(cat "$RUNNER_TEMP/stage-j/previous-container-id.txt")" \
              --arg previousImageId "$(cat "$RUNNER_TEMP/stage-j/previous-image-id.txt")" \
              --arg previousImageRef "$(cat "$RUNNER_TEMP/stage-j/previous-image-ref.txt")" \
              --arg previousSourceHead "$(cat "$RUNNER_TEMP/stage-j/previous-source-head.txt" 2>/dev/null || true)" \
              --arg currentContainerId "$current_container" \
              --arg currentImageId "$current_image" \
              --argjson productionMutationPerformed "$mutation_started" \
              --argjson rollbackAttempted "$rollback_attempted" \
              --argjson rollbackSucceeded "$rollback_succeeded" \
              '{
                schemaVersion: 2,
                operation: "RECOMMENDATION_BEHAVIORAL_V7_STAGE_J_RUNTIME_DEPLOY",
                generatedAt: $generatedAt,
                requestedHead: $requestedHead,
                deploymentStatus: $deploymentStatus,
                rollbackStatus: $rollbackStatus,
                previousContainerId: $previousContainerId,
                previousImageId: $previousImageId,
                previousImageRef: $previousImageRef,
                previousSourceHead: (if $previousSourceHead == "" then null else $previousSourceHead end),
                currentContainerId: (if $currentContainerId == "" then null else $currentContainerId end),
                currentImageId: (if $currentImageId == "" then null else $currentImageId end),
                productionMutationPerformed: $productionMutationPerformed,
                rollbackAttempted: $rollbackAttempted,
                rollbackSucceeded: $rollbackSucceeded,
                fullMigrationRunnerUsed: false,
                trainingPerformed: false,
                valueTrainingPerformed: false,
                futureTestEvaluated: false
              }' > "$RUNNER_TEMP/stage-j/stage-j-runtime-deploy.json"

            sudo mkdir -p "$evidence_root"
            for file in \
              preflight-status.json previous-container-inspect.json previous-compose-config.yml \
              identity-schema.json candidate-status.json rollback-status.json \
              player-identities.manifest.json timeline-cursors.json stage-j-runtime-deploy.json; do
              if test -s "$RUNNER_TEMP/stage-j/$file"; then
                sudo install -m 0644 "$RUNNER_TEMP/stage-j/$file" "$evidence_root/$file"
              fi
            done
          }

          rollback() {
            local original_rc="$1"
            trap - ERR
            set +e
            rollback_attempted=true
            echo "Candidate deployment failed with exit code $original_rc; rolling back." >&2

            rsync -a --delete \
              --exclude 'node_modules' \
              --exclude '.env' \
              --exclude 'storage' \
              --exclude '.git' \
              "$RUNNER_TEMP/stage-j/rollback-source/" "$target/"
            source_rc=$?

            previous_image_id="$(cat "$RUNNER_TEMP/stage-j/previous-image-id.txt")"
            previous_image_ref="$(cat "$RUNNER_TEMP/stage-j/previous-image-ref.txt")"
            if [ -n "$previous_image_id" ] && [ -n "$previous_image_ref" ]; then
              sudo docker image tag "$previous_image_id" "$previous_image_ref"
            fi
            tag_rc=$?

            cd "$target"
            sudo docker compose --env-file .env up -d --no-build --force-recreate api
            restart_rc=$?

            if [ "$source_rc" -eq 0 ] && [ "$tag_rc" -eq 0 ] && [ "$restart_rc" -eq 0 ] && \
               verify_runtime "$RUNNER_TEMP/stage-j/rollback-status.json"; then
              rollback_succeeded=true
              persist_evidence 'FAILED_ROLLED_BACK' 'VERIFIED_READY'
            else
              rollback_succeeded=false
              sudo docker compose --env-file .env logs --tail=300 api > "$RUNNER_TEMP/stage-j/rollback-api.log" 2>&1 || true
              persist_evidence 'FAILED_ROLLBACK_INCOMPLETE' 'VERIFICATION_FAILED'
            fi
            exit "$original_rc"
          }

          trap 'rc=$?; if [ "$mutation_started" = true ]; then rollback "$rc"; fi; exit "$rc"' ERR

          # Source sync is the first production mutation. The running container is still untouched at this point.
          mutation_started=true
          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'storage' \
            --exclude '.git' \
            ./ "$target/"

          cd "$target"
          sudo docker compose --env-file .env build api
          sudo docker compose --env-file .env run --rm --no-deps \
            api node dist/src/recommendation-observability-v7-identity-schema.cli.js \
            > "$RUNNER_TEMP/stage-j/identity-schema.json"
          jq -e '.schemaVersion == 1 and .columnReady == true and .indexReady == true and .otherMigrationsExecuted == false and .trainingPerformed == false and .futureTestEvaluated == false' \
            "$RUNNER_TEMP/stage-j/identity-schema.json"

          sudo docker compose --env-file .env up -d --force-recreate api
          verify_runtime "$RUNNER_TEMP/stage-j/candidate-status.json"

          root='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data/recommendation-observability-v7'
          for attempt in $(seq 1 20); do
            if sudo test -s "$root/player-identities.manifest.json" && sudo test -s "$root/timeline-cursors.json"; then
              break
            fi
            sleep 3
          done
          sudo test -s "$root/player-identities.manifest.json"
          sudo test -s "$root/timeline-cursors.json"
          sudo cp "$root/player-identities.manifest.json" "$RUNNER_TEMP/stage-j/player-identities.manifest.json"
          sudo cp "$root/timeline-cursors.json" "$RUNNER_TEMP/stage-j/timeline-cursors.json"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/stage-j/player-identities.manifest.json" "$RUNNER_TEMP/stage-j/timeline-cursors.json"
          jq -e '.schemaVersion == 1 and .identityVersion == "RECOMMENDATION_OBSERVABILITY_V7_DATASET_PLAYER_IDENTITY_1" and .identityDomain == "STEAM_ACCOUNT_ID_U32" and .historicalIdentityInferencePerformed == false and .heroIdentityInferencePerformed == false and .teamIdentityInferencePerformed == false and .playerPawnIdentityInferencePerformed == false' \
            "$RUNNER_TEMP/stage-j/player-identities.manifest.json"
          jq -e '.schemaVersion == 1 and (.cursors | type == "object")' "$RUNNER_TEMP/stage-j/timeline-cursors.json"

          trap - ERR
          persist_evidence 'DEPLOYED_VERIFIED' 'NOT_NEEDED'

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-behavioral-v7-stage-j-runtime-deploy-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/stage-j
          if-no-files-found: warn
          retention-days: 14

      - name: Show API logs on failure
        if: failure()
        shell: bash
        run: |
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo docker compose --env-file .env ps || true
          sudo docker compose --env-file .env logs --tail=300 api || true

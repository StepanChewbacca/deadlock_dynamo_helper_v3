name: Recommendation Behavioral V7 Stage J Runtime Deploy V1

on:
  pull_request:
    paths:
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/deadlock-live/hero-build-decision-dataset-v3.service.ts'
      - 'apps/api/src/deadlock-live/recommendation-observability-v7-*.ts'
      - 'apps/api/src/deadlock-live/recommendation-historical-pro-replay.ts'
      - 'apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v6.ts'
      - 'apps/api/src/deadlock-live/entities/match-player.entity.ts'
      - 'apps/api/src/recommendation-observability-v7-identity-schema.cli.ts'
      - 'docker-compose.yml'
      - '.github/workflows/recommendation-behavioral-v7-stage-j-runtime-deploy-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v7-stage-j-runtime-deploy-v1
  cancel-in-progress: true

jobs:
  stage-j-safety-interlock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read-only production safety interlock
        shell: bash
        run: |
          set -euo pipefail
          target='/home/ubuntu/apps/deadlock_dynamo_helper'
          test -d "$target"
          test -r "$target/.env"
          cd "$target"

          container_id="$(sudo docker compose --env-file .env ps -q api 2>/dev/null || true)"
          echo "apiContainerId=$container_id"
          if [ -z "$container_id" ]; then
            echo 'Stage J deployment is interlocked: API container is missing.'
            exit 0
          fi

          health="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
          image_id="$(sudo docker inspect --format='{{.Image}}' "$container_id")"
          echo "apiHealth=$health"
          echo "apiImageId=$image_id"

          sudo docker compose --env-file .env exec -T api node - <<'NODE'
          const endpoints = [
            'http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status',
            'http://127.0.0.1:3000/deadlock/live/build-recommendations/status',
          ];

          (async () => {
            for (const url of endpoints) {
              try {
                const response = await fetch(url);
                const text = await response.text();
                console.log(JSON.stringify({ url, httpStatus: response.status, httpOk: response.ok, body: text }));
              } catch (error) {
                console.log(JSON.stringify({ url, transportOk: false, error: error instanceof Error ? error.message : String(error) }));
              }
            }
          })();
          NODE

          echo 'Stage J deployment remains blocked until recommendation readiness is factually classified and rollback-safe deployment is installed.'
          echo 'productionMutationPerformed=false'
          echo 'trainingPerformed=false'
          echo 'futureTestEvaluated=false'

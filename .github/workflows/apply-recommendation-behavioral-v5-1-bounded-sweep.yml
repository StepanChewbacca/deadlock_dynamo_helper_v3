name: Apply Behavioral V5.1 Bounded Sweep Patch

on:
  pull_request:
    paths:
      - 'scripts/apply-recommendation-behavioral-v5-1-bounded-sweep-patch.py'
      - '.github/workflows/apply-recommendation-behavioral-v5-1-bounded-sweep.yml'

permissions:
  contents: write

concurrency:
  group: apply-recommendation-behavioral-v5-1-bounded-sweep-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Allow known duplicate anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-recommendation-behavioral-v5-1-bounded-sweep-patch.py')
          text = path.read_text(encoding='utf-8')
          old = """    if count != 1:\n        raise RuntimeError(f'{path}: expected exactly one replacement, found {count}')\n"""
          new = """    if count not in (1, 2):\n        raise RuntimeError(f'{path}: expected one or two replacement anchors, found {count}')\n"""
          if text.count(old) != 1:
              raise RuntimeError('Unable to patch replacement guard.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply deterministic patch
        run: python3 scripts/apply-recommendation-behavioral-v5-1-bounded-sweep-patch.py

      - name: Validate patch
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'diagnosticMatchModulo' apps/api/src/deadlock-live/recommendation-behavioral-v5-training.service.ts
          grep -q 'futureTestEvaluated: false' apps/api/src/deadlock-live/recommendation-behavioral-v5-training.service.ts
          grep -q 'recommendationBehavioralV5DiagnosticMatchSelected' apps/api/src/deadlock-live/recommendation-behavioral-v5-training.service.ts
          grep -q 'hero-time-bucket-item' apps/api/src/deadlock-live/recommendation-behavioral-v5.ts
          grep -q 'economy-band-action' apps/api/src/deadlock-live/recommendation-behavioral-v5.ts
          grep -q 'FEATURES_4_CAPACITY_INTERACTIONS' apps/api/src/deadlock-live/recommendation-behavioral-v5.ts

      - name: Commit patched sources
        run: |
          set -euo pipefail
          git checkout -- scripts/apply-recommendation-behavioral-v5-1-bounded-sweep-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/deadlock-live/recommendation-behavioral-v5.ts \
            apps/api/src/deadlock-live/recommendation-behavioral-v5-training.service.ts \
            apps/api/test/recommendation-behavioral-v5.spec.ts \
            apps/api/test/recommendation-value-v8-full-evaluation.spec.ts
          git commit -m 'feat: add bounded Behavioral V5.1 sampling'
          git push origin HEAD:${GITHUB_HEAD_REF}

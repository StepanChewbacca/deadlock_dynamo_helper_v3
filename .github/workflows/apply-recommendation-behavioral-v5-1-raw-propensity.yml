name: Apply Behavioral V5.1 Raw Propensity Patch

on:
  push:
    branches:
      - agent/recommendation-behavioral-v5-1-raw-propensity-1
    paths:
      - 'scripts/apply-recommendation-behavioral-v5-1-raw-propensity-patch.py'
      - '.github/workflows/apply-recommendation-behavioral-v5-1-raw-propensity.yml'

permissions:
  contents: write

concurrency:
  group: apply-recommendation-behavioral-v5-1-raw-propensity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/apply-recommendation-behavioral-v5-1-raw-propensity-patch.py

      - name: Validate patch
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- scripts/apply-recommendation-behavioral-v5-1-raw-propensity-patch.py
          grep -q "probabilityContract: 'RAW_SOFTMAX_WITHIN_DECISION'" apps/api/src/deadlock-live/recommendation-behavioral-v5-training.service.ts
          grep -q "propensityFloorApplied: false" apps/api/src/deadlock-live/recommendation-behavioral-v5-training.service.ts
          grep -q "isRawSoftmaxCandidateDistribution" apps/api/src/deadlock-live/recommendation-value-v8-diagnostic-training.service.ts

      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/deadlock-live/recommendation-behavioral-v5-training.service.ts \
            apps/api/src/deadlock-live/recommendation-value-v8-diagnostic-training.service.ts \
            apps/api/test/recommendation-behavioral-v5-training.spec.ts \
            apps/api/test/recommendation-value-v8-full-evaluation.spec.ts
          git commit -m 'fix: preserve raw Behavioral V5.1 propensities'
          git push origin HEAD:${GITHUB_REF_NAME}

name: Reference Data Bootstrap Check

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - apps/api/test/reference-data-import.service.spec.ts
      - apps/api/src/deadlock-live/reference-data-import.service.ts
      - .github/workflows/reference-data-bootstrap-check.yml

permissions:
  contents: read

jobs:
  reference-data-bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test reference data bootstrap
        run: yarn workspace @deadlock-live-probe/api test reference-data-import.service.spec.ts

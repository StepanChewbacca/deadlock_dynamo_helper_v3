name: Recommendation Behavioral V6 Grouped Boosted Listwise Validator

on:
  pull_request:
    paths:
      - 'apps/api/src/deadlock-live/recommendation-behavioral-v6-boosted-listwise.ts'
      - 'apps/api/test/recommendation-behavioral-v6-boosted-listwise.spec.ts'
      - 'scripts/run-recommendation-behavioral-v6-grouped-boosted-listwise-screen.mjs'
      - '.github/workflows/recommendation-behavioral-v6-grouped-boosted-listwise-screen-v1-background.yml'
      - '.github/training-requests/recommendation-behavioral-v6-grouped-boosted-listwise-screen-v1-background.json'
      - '.github/workflows/recommendation-behavioral-v6-grouped-boosted-listwise-validator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate boosted-listwise contracts and safety
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run-recommendation-behavioral-v6-grouped-boosted-listwise-screen.mjs
          grep -q 'RECOMMENDATION_BEHAVIORAL_V6_GROUPED_BOOSTED_LISTWISE_1_RAW_PROPENSITY' apps/api/src/deadlock-live/recommendation-behavioral-v6-boosted-listwise.ts
          grep -q 'GROUPED_LISTWISE_SOFTMAX_CROSS_ENTROPY_1' apps/api/src/deadlock-live/recommendation-behavioral-v6-boosted-listwise.ts
          grep -q 'NEGATIVE_LOG_CANDIDATE_RANK_1' apps/api/src/deadlock-live/recommendation-behavioral-v6-boosted-listwise.ts
          grep -q 'RAW_SOFTMAX_WITHIN_DECISION' apps/api/src/deadlock-live/recommendation-behavioral-v6-boosted-listwise.ts
          grep -q "treeCount: 8" scripts/run-recommendation-behavioral-v6-grouped-boosted-listwise-screen.mjs
          grep -q "tuningUsedForTraining: false" scripts/run-recommendation-behavioral-v6-grouped-boosted-listwise-screen.mjs
          grep -q "crossFittingPerformed: false" scripts/run-recommendation-behavioral-v6-grouped-boosted-listwise-screen.mjs
          grep -q "trainingArtifactEligible: false" scripts/run-recommendation-behavioral-v6-grouped-boosted-listwise-screen.mjs
          grep -q 'trainingTimeLimit == "NONE"' .github/workflows/recommendation-behavioral-v6-grouped-boosted-listwise-screen-v1-background.yml
          grep -q 'systemd-run' .github/workflows/recommendation-behavioral-v6-grouped-boosted-listwise-screen-v1-background.yml
          ! grep -q 'timeout .*run-recommendation-behavioral-v6-grouped-boosted-listwise-screen' .github/workflows/recommendation-behavioral-v6-grouped-boosted-listwise-screen-v1-background.yml

          request='.github/training-requests/recommendation-behavioral-v6-grouped-boosted-listwise-screen-v1-background.json'
          if [ -e "$request" ]; then
            jq -e '
              .schemaVersion == 1 and
              .operation == "RECOMMENDATION_BEHAVIORAL_V6_GROUPED_BOOSTED_LISTWISE_SCREEN" and
              .backgroundTraining == true and
              .trainingTimeLimit == "NONE" and
              .boundedScreenAuthorized == true and
              .strictCrossFitAuthorized == false and
              .fullTrainingAuthorized == false and
              .valueV8TrainingAuthorized == false and
              .productionRankingChanged == false and
              .passiveShadowAuthorized == false and
              .randomizedCanaryAuthorized == false and
              .futureTestAuthorized == false and
              .choiceSetDefinition == "MERGED_TOP_96" and
              .treeCount == 8 and
              .learningRate == 0.1 and
              .leafL2 == 10 and
              .maximumLeafValue == 1.5 and
              .minimumLeafCandidateCount == 500 and
              .outputDirectory == "recommendation-behavioral-v6-grouped-boosted-listwise-screen-v1-background"
            ' "$request"
          fi

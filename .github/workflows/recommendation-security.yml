name: Recommendation Security

on:
  pull_request:
  push:
    branches:
      - agent/add-inventory-simulator
      - agent/recommendation-roadmap-v8-runtime-finalization
      - 'frozen/recommendation-v8-behavioral-*'

permissions:
  contents: read

jobs:
  trust-boundary-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit workflow trust boundaries
        run: node scripts/recommendation-security-audit.mjs
      - name: Audit full Behavioral training pair contract
        run: node scripts/recommendation-behavioral-training-pair-audit.mjs
      - name: Audit protected Dataset V8 registry workflow
        run: node scripts/recommendation-dataset-registry-workflow-audit.mjs
      - name: Audit protected model registry workflow
        run: node scripts/recommendation-model-registry-workflow-audit.mjs
      - name: Audit privileged handoff and training shell syntax
        run: node scripts/recommendation-workflow-shell-audit.mjs

name: Statlocker UI Browser Smoke

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-ui-browser-smoke.yml'
      - 'apps/api/src/statlocker-probe/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statlocker-ui-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Wait for public UI client
        shell: bash
        run: |
          set -euo pipefail
          domain='aboba-telegramovich.duckdns.org'
          base="https://${domain}/deadlock/tools/statlocker"
          curl_args=(-k --resolve "${domain}:443:127.0.0.1" --silent --show-error)

          for attempt in $(seq 1 180); do
            html="$(curl "${curl_args[@]}" "$base" || true)"
            js="$(curl "${curl_args[@]}" "$base/client.js?v=3" || true)"
            if grep -q 'id="clientState"' <<<"$html" \
              && grep -q "elements.run.addEventListener('click'" <<<"$js" \
              && grep -q "fetch(endpoint" <<<"$js"; then
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              echo 'Timed out waiting for public Statlocker UI/client.js.' >&2
              exit 1
            fi
            sleep 1
          done

      - name: Exercise public UI in Chromium
        shell: bash
        run: |
          set -euo pipefail
          image="$(sudo docker inspect deadlock-statlocker-probe --format '{{.Config.Image}}')"
          domain='aboba-telegramovich.duckdns.org'
          script="$RUNNER_TEMP/statlocker-ui-smoke.cjs"

          cat > "$script" <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROMIUM_PATH || '/usr/bin/chromium-browser',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--ignore-certificate-errors'],
            });
            const page = await browser.newPage();
            const pageErrors = [];
            const browserRequests = [];

            page.on('pageerror', error => pageErrors.push(String(error && error.stack || error)));
            page.on('request', request => {
              if (request.url().includes('/deadlock/tools/statlocker/browser-request')) {
                browserRequests.push({method: request.method(), url: request.url(), postData: request.postData()});
              }
            });

            const response = await page.goto(
              'https://aboba-telegramovich.duckdns.org/deadlock/tools/statlocker',
              {waitUntil: 'networkidle0', timeout: 30000},
            );
            await page.waitForFunction(
              () => document.querySelector('#clientState')?.textContent === 'UI READY',
              {timeout: 10000},
            );

            const initial = await page.evaluate(() => ({
              clientState: document.querySelector('#clientState')?.textContent,
              model: document.querySelector('#statusModel')?.textContent,
              runDisabled: document.querySelector('#run')?.disabled,
            }));
            console.log('INITIAL', JSON.stringify(initial));
            console.log('PAGE_HTTP', response && response.status());

            await page.click('[data-model="T4_BUILD_CHAINS"]');
            await page.waitForFunction(
              () => document.querySelector('#statusModel')?.textContent === 'T4_BUILD_CHAINS',
              {timeout: 5000},
            );

            await page.$eval('#run', element => element.scrollIntoView({block: 'center', inline: 'center'}));
            await new Promise(resolve => setTimeout(resolve, 150));

            const hitTest = await page.evaluate(() => {
              const button = document.querySelector('#run');
              const rect = button.getBoundingClientRect();
              const hit = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
              return {
                rect: {left: rect.left, top: rect.top, width: rect.width, height: rect.height},
                hitId: hit?.id || '',
                hitTag: hit?.tagName || '',
                selectedModel: document.querySelector('.card.selected')?.getAttribute('data-model') || '',
              };
            });
            console.log('RUN_HIT_TEST', JSON.stringify(hitTest));
            if (hitTest.hitId !== 'run') throw new Error('Run control is not physically clickable: ' + JSON.stringify(hitTest));

            const requestPromise = page.waitForRequest(
              request => request.url().includes('/deadlock/tools/statlocker/browser-request') && request.method() === 'POST',
              {timeout: 5000},
            );

            await page.click('#run');
            const request = await requestPromise;
            const body = JSON.parse(request.postData() || '{}');
            console.log('RUN_REQUEST', JSON.stringify({method: request.method(), url: request.url(), body}));

            if (body.model !== 'T4_BUILD_CHAINS') throw new Error('Run button sent wrong selected model: ' + JSON.stringify(body));

            await page.waitForFunction(() => {
              const title = document.querySelector('#statusTitle')?.textContent || '';
              return title === 'Live model response captured' || title === 'Probe failed';
            }, {timeout: 90000});

            const final = await page.evaluate(() => ({
              statusTitle: document.querySelector('#statusTitle')?.textContent,
              statusText: document.querySelector('#statusText')?.textContent,
              statusHttp: document.querySelector('#statusHttp')?.textContent,
              outputText: (document.querySelector('#output')?.textContent || '').slice(0, 1200),
              capturedText: (document.querySelector('#captured')?.textContent || '').slice(0, 1200),
              runDisabled: document.querySelector('#run')?.disabled,
            }));

            console.log('REQUESTS', JSON.stringify(browserRequests));
            console.log('FINAL', JSON.stringify(final));
            console.log('PAGE_ERRORS', JSON.stringify(pageErrors));
            await browser.close();

            if (pageErrors.length) process.exit(2);
            if (initial.clientState !== 'UI READY' || initial.runDisabled) process.exit(3);
            if (hitTest.selectedModel !== 'T4_BUILD_CHAINS') process.exit(4);
            if (browserRequests.length !== 1) process.exit(5);
            if (final.statusTitle !== 'Live model response captured') process.exit(6);
            if (!String(final.statusHttp || '').includes('200')) process.exit(7);
            if (!String(final.outputText || '').trim()) process.exit(8);
            if (final.runDisabled) process.exit(9);
          })().catch(error => {
            console.error(error && error.stack || error);
            process.exit(1);
          });
          NODE

          sudo docker run --rm \
            --network host \
            --add-host "${domain}:127.0.0.1" \
            -v "$script:/tmp/statlocker-ui-smoke.cjs:ro" \
            "$image" \
            node /tmp/statlocker-ui-smoke.cjs

name: Statlocker UI Browser Smoke

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-ui-browser-smoke.yml'
      - 'apps/api/src/statlocker-probe/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statlocker-ui-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Wait for the new public UI client
        shell: bash
        run: |
          set -euo pipefail
          domain='aboba-telegramovich.duckdns.org'
          base="https://${domain}/deadlock/tools/statlocker"
          curl_args=(-k --resolve "${domain}:443:127.0.0.1" --silent --show-error)

          for attempt in $(seq 1 180); do
            html="$(curl "${curl_args[@]}" "$base" || true)"
            js="$(curl "${curl_args[@]}" "$base/client.js?v=3" || true)"

            if grep -q 'id="clientState"' <<<"$html" \
              && grep -q 'client.js?v=3' <<<"$html" \
              && grep -q "elements.run.addEventListener('click'" <<<"$js" \
              && grep -q "Request sent to" <<<"$js"; then
              echo 'New external Statlocker UI client is deployed.'
              break
            fi

            if [ "$attempt" -eq 180 ]; then
              echo 'Timed out waiting for the new public Statlocker UI/client.js.' >&2
              echo "HTML bytes: ${#html}" >&2
              echo "JS bytes: ${#js}" >&2
              sudo docker ps --filter name=deadlock-statlocker-probe --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
              exit 1
            fi
            sleep 1
          done

          sudo docker ps --filter name=deadlock-statlocker-probe --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

      - name: Exercise public UI buttons and request in Chromium
        shell: bash
        run: |
          set -euo pipefail

          image="$(sudo docker inspect deadlock-statlocker-probe --format '{{.Config.Image}}')"
          domain='aboba-telegramovich.duckdns.org'
          script="$RUNNER_TEMP/statlocker-ui-smoke.cjs"

          cat > "$script" <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROMIUM_PATH || '/usr/bin/chromium-browser',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--ignore-certificate-errors'],
            });

            const page = await browser.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const browserRequests = [];

            page.on('pageerror', error => pageErrors.push(String(error && error.stack || error)));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('request', request => {
              if (request.url().includes('/deadlock/tools/statlocker/browser-request')) {
                browserRequests.push({method: request.method(), url: request.url(), postData: request.postData()});
              }
            });

            const url = 'https://aboba-telegramovich.duckdns.org/deadlock/tools/statlocker';
            const response = await page.goto(url, {waitUntil: 'networkidle0', timeout: 30000});
            await page.waitForSelector('#run', {timeout: 10000});
            await page.waitForFunction(() => document.querySelector('#clientState')?.textContent === 'UI READY', {timeout: 10000});

            const initial = await page.evaluate(() => ({
              title: document.title,
              runText: document.querySelector('#run')?.textContent,
              runDisabled: document.querySelector('#run')?.disabled,
              clientState: document.querySelector('#clientState')?.textContent,
              statusModel: document.querySelector('#statusModel')?.textContent,
              selectedCards: document.querySelectorAll('.card.selected').length,
            }));
            console.log('INITIAL', JSON.stringify(initial));
            console.log('PAGE_HTTP', response && response.status());

            await page.click('[data-model="T4_BUILD_CHAINS"]');
            await page.waitForFunction(() => document.querySelector('#statusModel')?.textContent === 'T4_BUILD_CHAINS', {timeout: 5000});

            const selection = await page.evaluate(() => ({
              statusModel: document.querySelector('#statusModel')?.textContent,
              selectedModel: document.querySelector('.card.selected')?.getAttribute('data-model'),
            }));
            console.log('SELECTION', JSON.stringify(selection));

            const requestPromise = page.waitForRequest(
              request => request.url().includes('/deadlock/tools/statlocker/browser-request') && request.method() === 'POST',
              {timeout: 5000},
            );

            await page.click('#run');
            const sentRequest = await requestPromise;
            const sentBody = JSON.parse(sentRequest.postData() || '{}');
            console.log('RUN_REQUEST', JSON.stringify({method: sentRequest.method(), url: sentRequest.url(), body: sentBody}));

            if (sentBody.model !== 'T4_BUILD_CHAINS') throw new Error('Run button sent the wrong selected model');
            if (browserRequests.length !== 1) throw new Error('Run button did not send exactly one /browser-request POST');

            await page.waitForFunction(() => {
              const title = document.querySelector('#statusTitle')?.textContent || '';
              return title === 'Live model response captured' || title === 'Probe failed';
            }, {timeout: 90000});

            const final = await page.evaluate(() => ({
              statusTitle: document.querySelector('#statusTitle')?.textContent,
              statusText: document.querySelector('#statusText')?.textContent,
              statusHttp: document.querySelector('#statusHttp')?.textContent,
              statusTime: document.querySelector('#statusTime')?.textContent,
              outputHint: document.querySelector('#outputHint')?.textContent,
              outputText: (document.querySelector('#output')?.textContent || '').slice(0, 1200),
              capturedText: (document.querySelector('#captured')?.textContent || '').slice(0, 1200),
              runDisabled: document.querySelector('#run')?.disabled,
            }));

            console.log('BROWSER_REQUESTS', JSON.stringify(browserRequests));
            console.log('FINAL', JSON.stringify(final));
            console.log('PAGE_ERRORS', JSON.stringify(pageErrors));
            console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors));

            await browser.close();

            if (pageErrors.length) process.exit(2);
            if (consoleErrors.length) process.exit(3);
            if (initial.clientState !== 'UI READY') process.exit(4);
            if (initial.runDisabled) process.exit(5);
            if (selection.statusModel !== 'T4_BUILD_CHAINS' || selection.selectedModel !== 'T4_BUILD_CHAINS') process.exit(6);
            if (browserRequests.length !== 1) process.exit(7);
            if (final.statusTitle !== 'Live model response captured') process.exit(8);
            if (!String(final.statusHttp || '').includes('200')) process.exit(9);
            if (!String(final.outputText || '').trim()) process.exit(10);
            if (final.runDisabled) process.exit(11);
          })().catch(error => {
            console.error(error && error.stack || error);
            process.exit(1);
          });
          NODE

          sudo docker run --rm \
            --network host \
            --add-host "${domain}:127.0.0.1" \
            -v "$script:/tmp/statlocker-ui-smoke.cjs:ro" \
            "$image" \
            node /tmp/statlocker-ui-smoke.cjs

name: Statlocker UI Browser Smoke

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-ui-browser-smoke.yml'
      - 'apps/api/src/statlocker-probe/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statlocker-ui-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Wait for the new public UI client
        shell: bash
        run: |
          set -euo pipefail
          domain='aboba-telegramovich.duckdns.org'
          base="https://${domain}/deadlock/tools/statlocker"
          curl_args=(-k --resolve "${domain}:443:127.0.0.1" --silent --show-error)

          for attempt in $(seq 1 180); do
            html="$(curl "${curl_args[@]}" "$base" || true)"
            js="$(curl "${curl_args[@]}" "$base/client.js?v=3" || true)"
            if grep -q 'id="clientState"' <<<"$html" \
              && grep -q 'client.js?v=3' <<<"$html" \
              && grep -q "elements.run.addEventListener('click'" <<<"$js"; then
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              echo 'Timed out waiting for public Statlocker UI/client.js.' >&2
              exit 1
            fi
            sleep 1
          done

      - name: Exercise public UI buttons and request in Chromium
        shell: bash
        run: |
          set -euo pipefail
          image="$(sudo docker inspect deadlock-statlocker-probe --format '{{.Config.Image}}')"
          domain='aboba-telegramovich.duckdns.org'
          script="$RUNNER_TEMP/statlocker-ui-smoke.cjs"

          cat > "$script" <<'NODE'
          const puppeteer = require('puppeteer-core');
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROMIUM_PATH || '/usr/bin/chromium-browser',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--ignore-certificate-errors'],
            });
            const page = await browser.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const browserRequests = [];
            page.on('pageerror', error => pageErrors.push(String(error && error.stack || error)));
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('request', request => {
              if (request.url().includes('/deadlock/tools/statlocker/browser-request')) {
                browserRequests.push({method: request.method(), url: request.url(), postData: request.postData()});
              }
            });

            const response = await page.goto('https://aboba-telegramovich.duckdns.org/deadlock/tools/statlocker', {waitUntil: 'networkidle0', timeout: 30000});
            await page.waitForFunction(() => document.querySelector('#clientState')?.textContent === 'UI READY', {timeout: 10000});
            await page.evaluate(() => {
              window.__probeClicks = [];
              document.addEventListener('click', event => {
                const target = event.target;
                window.__probeClicks.push({tag: target.tagName, id: target.id || '', action: target.dataset?.action || '', model: target.dataset?.model || ''});
              }, true);
            });

            await page.click('[data-model="T4_BUILD_CHAINS"]');
            await page.waitForFunction(() => document.querySelector('#statusModel')?.textContent === 'T4_BUILD_CHAINS', {timeout: 5000});

            const before = await page.evaluate(() => {
              const button = document.querySelector('#run');
              const rect = button.getBoundingClientRect();
              const hit = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
              return {
                pageHttp: document.readyState,
                buttonDisabled: button.disabled,
                buttonText: button.textContent,
                rect: {left: rect.left, top: rect.top, width: rect.width, height: rect.height},
                hit: {tag: hit?.tagName, id: hit?.id || '', action: hit?.dataset?.action || ''},
                statusModel: document.querySelector('#statusModel')?.textContent,
              };
            });
            console.log('BEFORE_RUN', JSON.stringify(before));
            console.log('PAGE_HTTP', response && response.status());

            await page.click('#run');
            await sleep(300);

            let after = await page.evaluate(() => ({
              clicks: window.__probeClicks,
              runText: document.querySelector('#run')?.textContent,
              runDisabled: document.querySelector('#run')?.disabled,
              statusTitle: document.querySelector('#statusTitle')?.textContent,
              statusText: document.querySelector('#statusText')?.textContent,
              raw: document.querySelector('#raw')?.textContent,
            }));
            console.log('AFTER_PHYSICAL_CLICK', JSON.stringify(after));
            console.log('REQUESTS_AFTER_PHYSICAL_CLICK', JSON.stringify(browserRequests));
            console.log('PAGE_ERRORS_AFTER_PHYSICAL_CLICK', JSON.stringify(pageErrors));
            console.log('CONSOLE_ERRORS_AFTER_PHYSICAL_CLICK', JSON.stringify(consoleErrors));

            if (!browserRequests.length) {
              console.log('Physical click sent no request. Trying DOM click for diagnosis.');
              await page.evaluate(() => document.querySelector('#run').click());
              await sleep(300);
              after = await page.evaluate(() => ({
                clicks: window.__probeClicks,
                runText: document.querySelector('#run')?.textContent,
                runDisabled: document.querySelector('#run')?.disabled,
                statusTitle: document.querySelector('#statusTitle')?.textContent,
                statusText: document.querySelector('#statusText')?.textContent,
                raw: document.querySelector('#raw')?.textContent,
              }));
              console.log('AFTER_DOM_CLICK', JSON.stringify(after));
              console.log('REQUESTS_AFTER_DOM_CLICK', JSON.stringify(browserRequests));
              console.log('PAGE_ERRORS_AFTER_DOM_CLICK', JSON.stringify(pageErrors));
              console.log('CONSOLE_ERRORS_AFTER_DOM_CLICK', JSON.stringify(consoleErrors));
            }

            if (!browserRequests.length) throw new Error('Run button click path produced no /browser-request POST');
            const sentBody = JSON.parse(browserRequests[0].postData || '{}');
            if (sentBody.model !== 'T4_BUILD_CHAINS') throw new Error('Run button sent wrong model: ' + JSON.stringify(sentBody));

            await page.waitForFunction(() => {
              const title = document.querySelector('#statusTitle')?.textContent || '';
              return title === 'Live model response captured' || title === 'Probe failed';
            }, {timeout: 90000});

            const final = await page.evaluate(() => ({
              statusTitle: document.querySelector('#statusTitle')?.textContent,
              statusText: document.querySelector('#statusText')?.textContent,
              statusHttp: document.querySelector('#statusHttp')?.textContent,
              outputText: (document.querySelector('#output')?.textContent || '').slice(0, 1200),
              runDisabled: document.querySelector('#run')?.disabled,
            }));
            console.log('FINAL', JSON.stringify(final));
            console.log('FINAL_REQUESTS', JSON.stringify(browserRequests));
            console.log('FINAL_PAGE_ERRORS', JSON.stringify(pageErrors));
            console.log('FINAL_CONSOLE_ERRORS', JSON.stringify(consoleErrors));
            await browser.close();

            if (pageErrors.length) process.exit(2);
            if (consoleErrors.length) process.exit(3);
            if (browserRequests.length !== 1) process.exit(4);
            if (final.statusTitle !== 'Live model response captured') process.exit(5);
            if (!String(final.statusHttp || '').includes('200')) process.exit(6);
            if (!String(final.outputText || '').trim()) process.exit(7);
            if (final.runDisabled) process.exit(8);
          })().catch(error => {
            console.error(error && error.stack || error);
            process.exit(1);
          });
          NODE

          sudo docker run --rm \
            --network host \
            --add-host "${domain}:127.0.0.1" \
            -v "$script:/tmp/statlocker-ui-smoke.cjs:ro" \
            "$image" \
            node /tmp/statlocker-ui-smoke.cjs

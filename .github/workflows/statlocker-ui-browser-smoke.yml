name: Statlocker UI Browser Smoke

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-ui-browser-smoke.yml'
      - 'apps/api/src/statlocker-probe/statlocker-site-like.ui.ts'
      - 'apps/api/src/statlocker-probe/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statlocker-ui-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Wait for deployed probe container
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if sudo docker ps --format '{{.Names}}' | grep -qx 'deadlock-statlocker-probe'; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo 'deadlock-statlocker-probe is not running' >&2
              exit 1
            fi
            sleep 1
          done
          sudo docker ps --filter name=deadlock-statlocker-probe --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

      - name: Exercise the public UI in Chromium
        shell: bash
        run: |
          set -euo pipefail

          image="$(sudo docker inspect deadlock-statlocker-probe --format '{{.Config.Image}}')"
          domain='aboba-telegramovich.duckdns.org'
          script="$RUNNER_TEMP/statlocker-ui-smoke.cjs"

          cat > "$script" <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROMIUM_PATH || '/usr/bin/chromium-browser',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--ignore-certificate-errors'],
            });
            const page = await browser.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error && error.stack || error)));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });

            const url = 'https://aboba-telegramovich.duckdns.org/deadlock/tools/statlocker';
            const response = await page.goto(url, {waitUntil: 'domcontentloaded', timeout: 30000});
            await page.waitForSelector('#run', {timeout: 10000});

            const initial = await page.evaluate(() => ({
              title: document.title,
              runText: document.querySelector('#run')?.textContent,
              statusTitle: document.querySelector('#statusTitle')?.textContent,
              statusText: document.querySelector('#statusText')?.textContent,
              apiBase: location.pathname,
            }));
            console.log('INITIAL', JSON.stringify(initial));
            console.log('PAGE_HTTP', response && response.status());

            await page.click('#run');
            await page.waitForFunction(() => {
              const title = document.querySelector('#statusTitle')?.textContent || '';
              return title === 'Live model response captured' || title === 'Probe failed';
            }, {timeout: 90000});

            const final = await page.evaluate(() => ({
              statusTitle: document.querySelector('#statusTitle')?.textContent,
              statusText: document.querySelector('#statusText')?.textContent,
              statusHttp: document.querySelector('#statusHttp')?.textContent,
              statusTime: document.querySelector('#statusTime')?.textContent,
              outputHint: document.querySelector('#outputHint')?.textContent,
              outputText: (document.querySelector('#output')?.textContent || '').slice(0, 1200),
              capturedText: (document.querySelector('#captured')?.textContent || '').slice(0, 1200),
            }));

            console.log('FINAL', JSON.stringify(final));
            console.log('PAGE_ERRORS', JSON.stringify(pageErrors));
            console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors));

            await browser.close();

            if (pageErrors.length) process.exit(2);
            if (final.statusTitle !== 'Live model response captured') process.exit(3);
            if (!String(final.statusHttp || '').includes('200')) process.exit(4);
            if (!String(final.outputText || '').trim()) process.exit(5);
          })().catch(error => {
            console.error(error && error.stack || error);
            process.exit(1);
          });
          NODE

          sudo docker run --rm \
            --network host \
            --add-host "${domain}:127.0.0.1" \
            -v "$script:/tmp/statlocker-ui-smoke.cjs:ro" \
            "$image" \
            node /tmp/statlocker-ui-smoke.cjs

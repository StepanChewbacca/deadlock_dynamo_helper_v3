name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      ADAPTIVE_PRODUCTION_IMAGE: deadlock-adaptive-production:${{ github.sha }}
      DB_RUN_MIGRATIONS: 'true'
      CHROMIUM_PATH: /usr/bin/chromium-browser
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://aboba-telegramovich.duckdns.org' }}
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to deployment directory
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'storage' \
            ./ /home/ubuntu/apps/deadlock_dynamo_helper/

      - name: Promote Recommendation Value V6 candidate
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo bash scripts/promote-recommendation-value-v6-live.sh

      - name: Rebuild and restart API
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo docker build --platform linux/arm64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$ADAPTIVE_PRODUCTION_IMAGE" .
          sudo env \
            DEADLOCK_API_IMAGE="$ADAPTIVE_PRODUCTION_IMAGE" \
            DB_RUN_MIGRATIONS="$DB_RUN_MIGRATIONS" \
            CHROMIUM_PATH="$CHROMIUM_PATH" \
            docker compose run --rm --no-deps api node run-migrations.js
          sudo env \
            DEADLOCK_API_IMAGE="$ADAPTIVE_PRODUCTION_IMAGE" \
            DB_RUN_MIGRATIONS="$DB_RUN_MIGRATIONS" \
            CHROMIUM_PATH="$CHROMIUM_PATH" \
            docker compose up -d --no-build --no-deps api

      - name: Wait for healthy API container
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          container_id="$(sudo docker compose ps -q api)"
          if [ -z "$container_id" ]; then
            echo 'API container was not created.' >&2
            exit 1
          fi

          for attempt in $(seq 1 40); do
            status="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            echo "API health status: $status ($attempt/40)"
            if [ "$status" = 'healthy' ]; then
              exit 0
            fi
            if [ "$status" = 'unhealthy' ]; then
              sudo docker compose logs --tail=200 api
              exit 1
            fi
            sleep 5
          done

          sudo docker compose logs --tail=200 api
          echo 'API did not become healthy in time.' >&2
          exit 1

      - name: Verify exclusive Recommendation Value V6 locally
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo docker compose exec -T api node -e "const expectedSha = '799803f4882ca2ece436ab1087c41641713377f8a33f9bab0f0f4636a381938e'; fetch('http://127.0.0.1:3000/deadlock/analysis/recommendation-value-v6-live/status').then(async (response) => { const status = await response.json(); console.log(JSON.stringify(status)); if (!response.ok || status.mode !== 'CANARY' || status.rolloutScope !== 'ALL_USERS' || status.allowlistCount !== 0 || status.model?.state !== 'READY' || status.model?.modelSha256 !== expectedSha) process.exit(1); }).catch((error) => { console.error(error); process.exit(1); });"
          sudo docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/deadlock/live/build-recommendations/status').then(async (response) => { const status = await response.json(); console.log(JSON.stringify(status)); if (!response.ok || typeof status.trackedMatchCount !== 'number') process.exit(1); }).catch((error) => { console.error(error); process.exit(1); });"

      - name: Restore DuckDNS record when needed
        shell: bash
        run: |
          set -euo pipefail
          public_host="${PUBLIC_API_BASE_URL#https://}"
          public_host="${public_host%%/*}"
          public_host="${public_host%%:*}"

          if [[ "$public_host" != *.duckdns.org ]]; then
            echo "Public host $public_host is not managed by DuckDNS."
            exit 0
          fi

          resolve_public_host() {
            getent ahostsv4 "$public_host" | awk 'NR == 1 { print $1 }'
          }

          resolved_ip="$(resolve_public_host || true)"
          if [ -n "$resolved_ip" ]; then
            echo "DuckDNS already resolves $public_host to $resolved_ip."
            exit 0
          fi

          duckdns_token="${DUCKDNS_TOKEN:-}"
          for env_file in \
            /home/ubuntu/apps/deadlock_dynamo_helper/.env \
            /home/ubuntu/apps/aboba-telegramovich/.env \
            /etc/duckdns/duckdns.env; do
            if [ -n "$duckdns_token" ] || [ ! -r "$env_file" ]; then
              continue
            fi
            duckdns_token="$(sed -n 's/^DUCKDNS_TOKEN=//p' "$env_file" | tail -n 1 | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          done

          if [ -z "$duckdns_token" ]; then
            echo 'DuckDNS does not resolve and DUCKDNS_TOKEN is unavailable.' >&2
            echo 'Add the repository secret DUCKDNS_TOKEN or DUCKDNS_TOKEN to the deployment .env.' >&2
            exit 1
          fi

          duckdns_domain="${public_host%.duckdns.org}"
          update_result="$(curl --fail --show-error --silent --get \
            'https://www.duckdns.org/update' \
            --data-urlencode "domains=$duckdns_domain" \
            --data-urlencode "token=$duckdns_token" \
            --data-urlencode 'ip=')"
          if [ "$update_result" != 'OK' ]; then
            echo "DuckDNS update failed: $update_result" >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            resolved_ip="$(resolve_public_host || true)"
            if [ -n "$resolved_ip" ]; then
              echo "DuckDNS resolves $public_host to $resolved_ip."
              exit 0
            fi
            echo "Waiting for DuckDNS propagation ($attempt/30)."
            sleep 5
          done

          echo "DuckDNS update succeeded but $public_host still does not resolve." >&2
          exit 1

      - name: Configure nginx Deadlock route
        shell: bash
        run: |
          set -euo pipefail
          public_host="${PUBLIC_API_BASE_URL#https://}"
          public_host="${public_host%%/*}"
          public_host="${public_host%%:*}"

          sudo rm -f "/etc/nginx/sites-enabled/${public_host}.before-deadlock-route"

          sudo env PUBLIC_API_HOST="$public_host" python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          host = os.environ['PUBLIC_API_HOST']
          config_path = Path('/etc/nginx/sites-enabled') / host
          if not config_path.exists():
              raise SystemExit(f'Nginx site config does not exist: {config_path}')

          source = config_path.read_text()
          marker_start = '    # BEGIN DEADLOCK_DYNAMO_HELPER\n'
          marker_end = '    # END DEADLOCK_DYNAMO_HELPER\n'
          location_block = (
              marker_start
              + '    location ^~ /deadlock/ {\n'
              + '        proxy_pass http://127.0.0.1:3000;\n'
              + '        proxy_http_version 1.1;\n'
              + '        proxy_set_header Host $host;\n'
              + '        proxy_set_header X-Real-IP $remote_addr;\n'
              + '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n'
              + '        proxy_set_header X-Forwarded-Proto $scheme;\n'
              + '        proxy_read_timeout 60s;\n'
              + '    }\n'
              + marker_end
          )

          if marker_start in source and marker_end in source:
              pattern = re.compile(
                  re.escape(marker_start) + r'.*?' + re.escape(marker_end),
                  re.DOTALL,
              )
              updated = pattern.sub(location_block, source, count=1)
          else:
              server_pattern = re.compile(r'\bserver\s*\{')
              updated = None
              for match in server_pattern.finditer(source):
                  open_brace = source.find('{', match.start())
                  depth = 0
                  close_brace = None
                  for index in range(open_brace, len(source)):
                      character = source[index]
                      if character == '{':
                          depth += 1
                      elif character == '}':
                          depth -= 1
                          if depth == 0:
                              close_brace = index
                              break
                  if close_brace is None:
                      continue
                  server_block = source[match.start():close_brace + 1]
                  if (
                      re.search(rf'\bserver_name\s+{re.escape(host)}\s*;', server_block)
                      and (
                          re.search(r'\blisten\s+443\b', server_block)
                          or 'ssl_certificate' in server_block
                      )
                  ):
                      updated = source[:close_brace] + '\n' + location_block + source[close_brace:]
                      break
              if updated is None:
                  raise SystemExit(f'HTTPS nginx server block was not found for {host}.')

          if updated != source:
              backup_dir = Path('/var/backups/nginx')
              backup_dir.mkdir(parents=True, exist_ok=True)
              backup_path = backup_dir / f'{host}.before-deadlock-route'
              if not backup_path.exists():
                  shutil.copy2(config_path, backup_path)
              config_path.write_text(updated)
              print(f'Updated nginx route in {config_path}.')
          else:
              print('Nginx Deadlock route is already up to date.')
          PY

          sudo nginx -t
          sudo systemctl reload nginx

      - name: Verify exclusive Recommendation Value V6 through local HTTPS
        shell: bash
        run: |
          set -euo pipefail
          public_host="${PUBLIC_API_BASE_URL#https://}"
          public_host="${public_host%%/*}"
          public_host="${public_host%%:*}"
          status="$(curl --fail --show-error --silent \
            --retry 10 \
            --retry-delay 1 \
            --retry-all-errors \
            --resolve "$public_host:443:127.0.0.1" \
            "$PUBLIC_API_BASE_URL/deadlock/analysis/recommendation-value-v6-live/status")"
          echo "$status"
          echo "$status" | grep -q '"mode":"CANARY"'
          echo "$status" | grep -q '"rolloutScope":"ALL_USERS"'
          echo "$status" | grep -q '"allowlistCount":0'
          echo "$status" | grep -q '"state":"READY"'
          echo "$status" | grep -q '"modelSha256":"799803f4882ca2ece436ab1087c41641713377f8a33f9bab0f0f4636a381938e"'

      - name: Verify exclusive Recommendation Value V6 public route
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --fail --show-error --silent \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "$PUBLIC_API_BASE_URL/deadlock/analysis/recommendation-value-v6-live/status")"
          echo "$status"
          echo "$status" | grep -q '"mode":"CANARY"'
          echo "$status" | grep -q '"rolloutScope":"ALL_USERS"'
          echo "$status" | grep -q '"allowlistCount":0'
          echo "$status" | grep -q '"state":"READY"'
          echo "$status" | grep -q '"modelSha256":"799803f4882ca2ece436ab1087c41641713377f8a33f9bab0f0f4636a381938e"'

      - name: Disable Recommendation Value V6 after deployment failure
        if: failure()
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo env DEADLOCK_RECOMMENDATION_VALUE_V6_LIVE_MODE=DISABLED \
            DEADLOCK_API_IMAGE="$ADAPTIVE_PRODUCTION_IMAGE" \
            DB_RUN_MIGRATIONS="$DB_RUN_MIGRATIONS" \
            CHROMIUM_PATH="$CHROMIUM_PATH" \
            docker compose up -d --force-recreate --no-deps api

      - name: Show API logs on failure
        if: failure()
        run: |
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo docker compose ps
          sudo docker compose logs --tail=300 api

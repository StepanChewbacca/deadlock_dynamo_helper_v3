name: Statlocker Browser Network Recon

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-browser-recon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-recon:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect Statlocker build and hero evidence payloads
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/statlocker-browser-recon"
          rm -rf "$work"
          mkdir -p "$work"

          cat > "$work/Dockerfile" <<'DOCKERFILE'
          FROM node:20-alpine
          WORKDIR /app
          RUN apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont \
            && npm init -y >/dev/null 2>&1 \
            && npm install puppeteer-core@24.16.0
          COPY recon.mjs ./recon.mjs
          CMD ["node", "recon.mjs"]
          DOCKERFILE

          cat > "$work/recon.mjs" <<'NODE'
          import puppeteer from 'puppeteer-core';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/chromium-browser',
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 1440, height: 1100 });
          await page.setUserAgent(
            'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
            '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
          );

          let selectedPlayerBuild = null;
          let leaderboardSamples = [];
          let allHeroWpa = null;
          const pending = new Set();

          page.on('response', (response) => {
            const task = (async () => {
              const url = response.url();
              if (!url.startsWith('https://statlocker.gg/api/')) return;
              if (response.status() !== 200) return;
              const parsed = new URL(url);
              const contentType = response.headers()['content-type'] || '';
              if (!contentType.includes('application/json')) return;

              try {
                if (parsed.pathname === '/api/leaderboard/get-valve-leaderboard') {
                  const data = await response.json();
                  leaderboardSamples.push({
                    region: parsed.searchParams.get('region'),
                    heroId: parsed.searchParams.get('heroId'),
                    players: (data?.data || []).slice(0, 10).map((p) => ({
                      accountName: p.account_name,
                      accountId: p.steamProfile?.account_id ?? p.account_id ?? p.steam_id3,
                      rank: p.rank,
                      rankedRank: p.ranked_rank,
                      heroPerformanceRank: p.heroPerformanceRank,
                    })),
                  });
                }

                if (parsed.pathname.startsWith('/api/info/player-build-analysis/')) {
                  const data = await response.json();
                  selectedPlayerBuild = {
                    path: parsed.pathname,
                    accountId: data.accountId,
                    heroId: data.heroId,
                    totalMatches: data.totalMatches,
                    winRate: data.winRate,
                    items: (data.items || [])
                      .slice()
                      .sort((a, b) => (a.medianBuyTimeS ?? a.avgBuyTimeS ?? 0) - (b.medianBuyTimeS ?? b.avgBuyTimeS ?? 0))
                      .map((item) => ({
                        itemId: item.itemId,
                        name: item.name,
                        tier: item.tier,
                        slotType: item.slotType,
                        purchaseRate: item.purchaseRate,
                        winRate: item.winRate,
                        avgBuyTimeS: item.avgBuyTimeS,
                        medianBuyTimeS: item.medianBuyTimeS,
                        purchaseCount: item.purchaseCount,
                        frequencyTier: item.frequencyTier,
                        phase: item.phase,
                      })),
                    itemRelationshipsCount: (data.itemRelationships || []).length,
                  };
                }

                if (parsed.pathname === '/api/info/wpa-filtered-items' && parsed.searchParams.get('hero') === 'all') {
                  const data = await response.json();
                  allHeroWpa = data;
                }
              } catch (error) {
                console.log('CAPTURE_ERROR=' + JSON.stringify({ url, message: error instanceof Error ? error.message : String(error) }));
              }
            })();
            pending.add(task);
            task.finally(() => pending.delete(task));
          });

          console.log('OPEN_PRO=https://statlocker.gg/builds/eternus-builds/abrams');
          await page.goto('https://statlocker.gg/builds/eternus-builds/abrams', {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await sleep(14000);

          console.log('OPEN_META=https://statlocker.gg/items/meta-model?hero=all&min=500');
          await page.goto('https://statlocker.gg/items/meta-model?hero=all&min=500', {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await sleep(14000);
          await Promise.allSettled([...pending]);

          if (!selectedPlayerBuild) {
            console.log('PRO_BUILD_RESULT=null');
          } else {
            console.log('PRO_BUILD_RESULT=' + JSON.stringify(selectedPlayerBuild, null, 2));
          }

          console.log('LEADERBOARD_RESULT=' + JSON.stringify(leaderboardSamples, null, 2));

          if (!allHeroWpa) {
            console.log('ALL_HERO_WPA_RESULT=null');
          } else {
            const items = allHeroWpa.items || [];
            const withHeroData = items.filter((item) => item && item.heroData && typeof item.heroData === 'object');
            const knockdown = items.find((item) => String(item.item || '').toLowerCase() === 'knockdown');
            const sample = knockdown || withHeroData[0] || items[0];
            console.log('ALL_HERO_WPA_RESULT=' + JSON.stringify({
              itemCount: items.length,
              availableHeroes: allHeroWpa.availableHeroes,
              heroDataItemCount: withHeroData.length,
              sampleItem: sample ? {
                item: sample.item,
                wpaValue: sample.wpaValue,
                sampleSize: sample.sampleSize,
                meanPurchaseTimeMin: sample.mean_purchase_time_min,
                aheadWpa: sample.aheadWpa,
                behindWpa: sample.behindWpa,
                bestPurchaseTime: sample.best_purchase_time,
                heroDataType: Array.isArray(sample.heroData) ? 'array' : typeof sample.heroData,
                heroData: sample.heroData,
              } : null,
            }, null, 2));
          }

          await browser.close();
          NODE

          sudo docker build -t statlocker-browser-recon "$work"
          sudo docker run --rm --shm-size=1g statlocker-browser-recon | tee "$work/output.log"
          cp "$work/output.log" "$GITHUB_WORKSPACE/statlocker-browser-recon-result.log"

      - name: Persist recon result on the spike branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statlocker-browser-recon-result.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(statlocker): save browser recon result'
          git push origin HEAD:agent/statlocker-model-probe-poc

name: Statlocker Browser Network Recon

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-browser-recon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-recon:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Capture Statlocker Pro Builds and vs-hero model requests in Chromium
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/statlocker-browser-recon"
          rm -rf "$work"
          mkdir -p "$work"

          cat > "$work/Dockerfile" <<'DOCKERFILE'
          FROM node:20-alpine
          WORKDIR /app
          RUN apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont \
            && npm init -y >/dev/null 2>&1 \
            && npm install puppeteer-core@24.16.0
          COPY recon.mjs ./recon.mjs
          CMD ["node", "recon.mjs"]
          DOCKERFILE

          cat > "$work/recon.mjs" <<'NODE'
          import puppeteer from 'puppeteer-core';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          function summarize(value, depth = 0) {
            if (value === null) return null;
            if (Array.isArray(value)) {
              return {
                type: 'array',
                length: value.length,
                sample: value.length && depth < 2 ? summarize(value[0], depth + 1) : undefined,
              };
            }
            if (typeof value === 'object') {
              const keys = Object.keys(value);
              const result = { type: 'object', keys: keys.slice(0, 40) };
              if (depth < 2) {
                const sample = {};
                for (const key of keys.slice(0, 12)) {
                  sample[key] = summarize(value[key], depth + 1);
                }
                result.sample = sample;
              }
              return result;
            }
            if (typeof value === 'string') return value.slice(0, 180);
            return value;
          }

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/chromium-browser',
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });

          const page = await browser.newPage();
          await page.setViewport({ width: 1440, height: 1100 });
          await page.setUserAgent(
            'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
            '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
          );

          let phase = 'BOOT';
          const entries = [];
          const bodyPromises = new Set();

          page.on('response', (response) => {
            const task = (async () => {
              const url = response.url();
              if (!/^https:\/\/(www\.)?statlocker\.gg\/api\//.test(url)) return;

              const request = response.request();
              const entry = {
                phase,
                url,
                path: new URL(url).pathname,
                search: new URL(url).search,
                status: response.status(),
                method: request.method(),
                resourceType: request.resourceType(),
              };

              try {
                const contentType = response.headers()['content-type'] || '';
                if (contentType.includes('application/json')) {
                  const data = await Promise.race([
                    response.json(),
                    sleep(10000).then(() => { throw new Error('body timeout'); }),
                  ]);
                  entry.body = summarize(data);
                }
              } catch (error) {
                entry.bodyError = error instanceof Error ? error.message : String(error);
              }

              entries.push(entry);
              console.log('STATLOCKER_API=' + JSON.stringify(entry));
            })();
            bodyPromises.add(task);
            task.finally(() => bodyPromises.delete(task));
          });

          page.on('pageerror', (error) => console.log('PAGE_ERROR=' + error.message));

          async function visibleTexts() {
            return page.evaluate(() => ({
              buttons: Array.from(document.querySelectorAll('button'))
                .map((el) => (el.textContent || '').trim())
                .filter(Boolean)
                .slice(0, 100),
              selects: Array.from(document.querySelectorAll('select')).map((el) => ({
                name: el.getAttribute('name'),
                id: el.id,
                value: el.value,
                options: Array.from(el.options).map((o) => ({ text: o.text, value: o.value })).slice(0, 30),
              })),
              links: Array.from(document.querySelectorAll('a'))
                .map((el) => ({ text: (el.textContent || '').trim(), href: el.href }))
                .filter((x) => x.text)
                .slice(0, 100),
            }));
          }

          async function clickByText(regex) {
            return page.evaluate((source) => {
              const re = new RegExp(source, 'i');
              const candidates = Array.from(document.querySelectorAll('button, a, [role="button"], [role="tab"]'));
              const element = candidates.find((el) => re.test((el.textContent || '').trim()));
              if (!element) return null;
              const text = (element.textContent || '').trim();
              element.click();
              return { tag: element.tagName, text };
            }, regex.source);
          }

          phase = 'PRO_BUILDS_LOAD';
          const proUrl = 'https://statlocker.gg/builds/eternus-builds/abrams';
          console.log('OPEN=' + proUrl);
          await page.goto(proUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await sleep(10000);
          console.log('PRO_INITIAL_UI=' + JSON.stringify(await visibleTexts()));

          phase = 'PRO_BUILDS_TAB';
          const proClick = await clickByText(/Pro Builds/);
          console.log('PRO_BUILDS_CLICK=' + JSON.stringify(proClick));
          await sleep(10000);
          console.log('PRO_AFTER_TAB_UI=' + JSON.stringify(await visibleTexts()));

          phase = 'PRO_BUILDS_PLAYER';
          const playerResult = await page.evaluate(() => {
            const nativeSelects = Array.from(document.querySelectorAll('select'));
            const playerSelect = nativeSelects.find((el) =>
              /player/i.test(`${el.name} ${el.id} ${el.getAttribute('aria-label') || ''}`),
            );
            if (playerSelect && playerSelect.options.length > 1) {
              const option = Array.from(playerSelect.options).find((o) => o.value && !/choose/i.test(o.text));
              if (option) {
                playerSelect.value = option.value;
                playerSelect.dispatchEvent(new Event('change', { bubbles: true }));
                return { mode: 'native-select', text: option.text, value: option.value };
              }
            }

            const triggers = Array.from(document.querySelectorAll('button, [role="combobox"], [aria-haspopup="listbox"]'));
            const trigger = triggers.find((el) => /choose player|player/i.test((el.textContent || '').trim()));
            if (trigger) {
              trigger.click();
              return { mode: 'custom-trigger', text: (trigger.textContent || '').trim() };
            }
            return null;
          });
          console.log('PRO_PLAYER_TRIGGER=' + JSON.stringify(playerResult));
          await sleep(1500);

          if (playerResult?.mode === 'custom-trigger') {
            const option = await page.evaluate(() => {
              const candidates = Array.from(document.querySelectorAll('[role="option"], li, [data-value]'));
              const el = candidates.find((node) => {
                const text = (node.textContent || '').trim();
                return text && !/choose player/i.test(text) && text.length < 160;
              });
              if (!el) return null;
              const text = (el.textContent || '').trim();
              el.click();
              return text;
            });
            console.log('PRO_PLAYER_OPTION=' + JSON.stringify(option));
          }
          await sleep(12000);

          phase = 'VS_HERO_LOAD';
          const vsUrl = 'https://statlocker.gg/vision/wpa?graph=t4-chains&hero=Abrams&min=500&mode=items-heroes';
          console.log('OPEN=' + vsUrl);
          await page.goto(vsUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await sleep(12000);
          console.log('VS_HERO_UI=' + JSON.stringify(await visibleTexts()));

          phase = 'VS_HERO_CLICK';
          const itemsHeroesClick = await clickByText(/Items\s*to\s*Heroes/);
          console.log('ITEMS_TO_HEROES_CLICK=' + JSON.stringify(itemsHeroesClick));
          await sleep(12000);

          await Promise.allSettled([...bodyPromises]);

          const relevant = entries.filter((entry) =>
            /player|build|wpa|hero|leaderboard|item/i.test(entry.path),
          );

          console.log('FINAL_SUMMARY=' + JSON.stringify({
            totalRequests: entries.length,
            relevantCount: relevant.length,
            relevant,
          }, null, 2));

          await browser.close();
          NODE

          sudo docker build -t statlocker-browser-recon "$work"
          sudo docker run --rm --shm-size=1g statlocker-browser-recon

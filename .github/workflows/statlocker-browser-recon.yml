name: Statlocker Browser Network Recon

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-browser-recon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-recon:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect current Statlocker Item Meta frontend code
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/statlocker-browser-recon"
          rm -rf "$work"
          mkdir -p "$work"

          cat > "$work/Dockerfile" <<'DOCKERFILE'
          FROM node:20-alpine
          WORKDIR /app
          RUN apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont \
            && npm init -y >/dev/null 2>&1 \
            && npm install puppeteer-core@24.16.0
          COPY recon.mjs ./recon.mjs
          CMD ["node", "recon.mjs"]
          DOCKERFILE

          cat > "$work/recon.mjs" <<'NODE'
          import puppeteer from 'puppeteer-core';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/chromium-browser',
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 1440, height: 1100 });
          await page.setUserAgent(
            'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
            '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
          );

          await page.goto('https://statlocker.gg/items/meta-model', {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await sleep(12000);

          const result = await page.evaluate(async () => {
            const scriptUrls = Array.from(new Set([
              ...Array.from(document.scripts).map((s) => s.src).filter(Boolean),
              ...performance.getEntriesByType('resource')
                .map((entry) => entry.name)
                .filter((name) => /\.js(?:\?|$)/.test(name)),
            ])).filter((url) => url.startsWith(location.origin));

            const needles = [
              'vs-hero-wpa-data',
              'wpa-filtered-items',
              'heroData',
              'Items to Heroes',
              'items-heroes',
              'teamComp',
            ];

            const matches = [];
            for (const url of scriptUrls) {
              try {
                const text = await fetch(url).then((r) => r.text());
                const found = [];
                for (const needle of needles) {
                  const index = text.indexOf(needle);
                  if (index === -1) continue;
                  found.push({
                    needle,
                    snippet: text.slice(Math.max(0, index - 500), Math.min(text.length, index + 900)),
                  });
                }
                if (found.length) {
                  matches.push({ url, found });
                }
              } catch (error) {
                matches.push({ url, error: error instanceof Error ? error.message : String(error) });
              }
            }

            return {
              currentUrl: location.href,
              scriptCount: scriptUrls.length,
              matchingScriptCount: matches.filter((m) => m.found?.length).length,
              matches,
            };
          });

          console.log('FRONTEND_CODE_RESULT=' + JSON.stringify(result, null, 2));
          await browser.close();
          NODE

          sudo docker build -t statlocker-browser-recon "$work"
          sudo docker run --rm --shm-size=1g statlocker-browser-recon | tee "$work/output.log"
          cp "$work/output.log" "$GITHUB_WORKSPACE/statlocker-browser-recon-result.log"

      - name: Persist recon result on the spike branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statlocker-browser-recon-result.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(statlocker): save browser recon result'
          git push origin HEAD:agent/statlocker-model-probe-poc

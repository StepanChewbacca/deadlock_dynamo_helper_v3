name: Recommendation Production Readiness Probe V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-production-readiness-probe-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-production-readiness-probe-v1
  cancel-in-progress: false

jobs:
  probe-production-readiness:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head for provenance only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Capture read-only production state
        shell: bash
        run: |
          set -euo pipefail
          target='/home/ubuntu/apps/deadlock_dynamo_helper'
          test -d "$target"
          test -r "$target/.env"

          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/probe-head.txt"

          if [ -d "$target/.git" ]; then
            git -C "$target" rev-parse HEAD > "$RUNNER_TEMP/production-source-head.txt" 2>/dev/null || true
            git -C "$target" status --porcelain=v1 > "$RUNNER_TEMP/production-source-status.txt" 2>/dev/null || true
          else
            : > "$RUNNER_TEMP/production-source-head.txt"
            : > "$RUNNER_TEMP/production-source-status.txt"
          fi

          cd "$target"
          sudo docker compose --env-file .env ps --format json > "$RUNNER_TEMP/compose-ps.json" 2>/dev/null || printf '[]\n' > "$RUNNER_TEMP/compose-ps.json"

          container_id="$(sudo docker compose --env-file .env ps -q api 2>/dev/null || true)"
          printf '%s\n' "$container_id" > "$RUNNER_TEMP/api-container-id.txt"

          if [ -n "$container_id" ]; then
            sudo docker inspect "$container_id" > "$RUNNER_TEMP/api-container-inspect.json"
            sudo docker inspect --format='{{.Image}}' "$container_id" > "$RUNNER_TEMP/api-image-id.txt"
            sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" > "$RUNNER_TEMP/api-health.txt"
          else
            printf '[]\n' > "$RUNNER_TEMP/api-container-inspect.json"
            : > "$RUNNER_TEMP/api-image-id.txt"
            printf 'missing\n' > "$RUNNER_TEMP/api-health.txt"
          fi

          if [ -n "$container_id" ]; then
            sudo docker compose --env-file .env exec -T api node - <<'NODE' > "$RUNNER_TEMP/recommendation-status-endpoints.json"
          const endpoints = {
            contextualV3: 'http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status',
            liveBuildRecommendations: 'http://127.0.0.1:3000/deadlock/live/build-recommendations/status',
          };

          async function probe(name, url) {
            try {
              const response = await fetch(url);
              const text = await response.text();
              let body;
              try {
                body = JSON.parse(text);
              } catch {
                body = { rawText: text };
              }
              return {
                name,
                url,
                transportOk: true,
                httpOk: response.ok,
                httpStatus: response.status,
                body,
              };
            } catch (error) {
              return {
                name,
                url,
                transportOk: false,
                httpOk: false,
                error: error instanceof Error ? error.message : String(error),
              };
            }
          }

          (async () => {
            const output = {};
            for (const [name, url] of Object.entries(endpoints)) {
              output[name] = await probe(name, url);
            }
            process.stdout.write(`${JSON.stringify(output, null, 2)}\n`);
          })().catch((error) => {
            process.stdout.write(`${JSON.stringify({ fatalProbeError: error instanceof Error ? error.message : String(error) }, null, 2)}\n`);
          });
          NODE
          else
            printf '{"fatalProbeError":"api container missing"}\n' > "$RUNNER_TEMP/recommendation-status-endpoints.json"
          fi

          image_id="$(cat "$RUNNER_TEMP/api-image-id.txt")"
          if [ -n "$image_id" ]; then
            sudo docker image inspect "$image_id" > "$RUNNER_TEMP/api-image-inspect.json" 2>/dev/null || printf '[]\n' > "$RUNNER_TEMP/api-image-inspect.json"
          else
            printf '[]\n' > "$RUNNER_TEMP/api-image-inspect.json"
          fi

      - name: Build probe evidence
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(cat "$RUNNER_TEMP/production-source-head.txt")"
          container_id="$(cat "$RUNNER_TEMP/api-container-id.txt")"
          image_id="$(cat "$RUNNER_TEMP/api-image-id.txt")"
          health="$(cat "$RUNNER_TEMP/api-health.txt")"

          jq -n \
            --arg schemaVersion '1' \
            --arg operation 'RECOMMENDATION_PRODUCTION_READINESS_READ_ONLY_PROBE' \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg requestedHead '${{ github.event.pull_request.head.sha }}' \
            --arg productionSourceHead "$source_head" \
            --arg apiContainerId "$container_id" \
            --arg apiImageId "$image_id" \
            --arg apiHealth "$health" \
            --slurpfile endpoints "$RUNNER_TEMP/recommendation-status-endpoints.json" \
            '{
              schemaVersion: ($schemaVersion | tonumber),
              operation: $operation,
              generatedAt: $generatedAt,
              requestedHead: $requestedHead,
              productionSourceHead: (if $productionSourceHead == "" then null else $productionSourceHead end),
              apiContainerId: (if $apiContainerId == "" then null else $apiContainerId end),
              apiImageId: (if $apiImageId == "" then null else $apiImageId end),
              apiHealth: $apiHealth,
              endpoints: $endpoints[0],
              productionMutationPerformed: false,
              trainingPerformed: false,
              valueTrainingPerformed: false,
              futureTestEvaluated: false
            }' > "$RUNNER_TEMP/production-readiness-probe.json"

          cat "$RUNNER_TEMP/production-readiness-probe.json"

      - name: Upload read-only probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-production-readiness-probe-v1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-readiness-probe.json
            ${{ runner.temp }}/recommendation-status-endpoints.json
            ${{ runner.temp }}/compose-ps.json
            ${{ runner.temp }}/api-container-inspect.json
            ${{ runner.temp }}/api-image-inspect.json
            ${{ runner.temp }}/production-source-head.txt
            ${{ runner.temp }}/production-source-status.txt
          retention-days: 14

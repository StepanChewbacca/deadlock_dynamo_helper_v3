name: Recommendation Production Readiness Probe V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-production-readiness-probe-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-production-readiness-probe-v1
  cancel-in-progress: true

jobs:
  paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Recommendation production readiness probe is paused.'

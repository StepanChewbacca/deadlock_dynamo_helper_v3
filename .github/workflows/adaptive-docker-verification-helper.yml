name: Adaptive Docker Verification Helper

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - Dockerfile
      - .github/workflows/adaptive-docker-verification-helper.yml

permissions:
  contents: read

jobs:
  verify-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build adaptive production image
        run: docker build -t deadlock-adaptive-v1 .

      - name: Verify Chromium and runtime workspaces
        run: |
          docker run --rm --entrypoint sh deadlock-adaptive-v1 -c \
            'test -x "$CHROMIUM_PATH" && node -e "require(\"puppeteer-core\"); require(\"@deadlock-live-probe/build-domain\")"'

name: Recommendation V8 Pretraining Apply

on:
  push:
    branches:
      - agent/recommendation-v8-pretraining-implementation
    paths:
      - .github/workflows/recommendation-v8-pretraining-apply.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Validate V8 build and focused tests in Node 20
        shell: bash
        run: |
          set -euo pipefail
          sudo docker run --rm \
            -v "$PWD:/src:ro" \
            node:20-alpine \
            sh -lc "set -e; cp -a /src /tmp/work; cd /tmp/work; corepack enable; corepack prepare yarn@1.22.22 --activate; yarn install --frozen-lockfile --ignore-engines; yarn workspace @deadlock-live-probe/shared build; yarn workspace @deadlock-live-probe/build-domain build; yarn workspace @deadlock-live-probe/api build; yarn workspace @deadlock-live-probe/shared test; yarn workspace @deadlock-live-probe/build-domain test; yarn workspace @deadlock-live-probe/api test"

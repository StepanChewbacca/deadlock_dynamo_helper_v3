name: Recommendation Behavioral V6 Top96 Baselines Validator

on:
  pull_request:
    paths:
      - 'scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs'
      - '.github/workflows/recommendation-behavioral-v6-top96-baselines-validator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate read-only baseline evaluator
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs
          grep -q "choiceSetDefinition = 'MERGED_TOP_96'" scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs
          grep -q "futureTestEvaluated: false" scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs
          grep -q "trainingPerformed: false" scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs
          grep -q "valueTrainingPerformed: false" scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs
          grep -q "HISTORICAL_PRIOR" scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs
          grep -q "GENERATOR_PRIOR" scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs
          grep -q "INVERSE_RANK" scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs

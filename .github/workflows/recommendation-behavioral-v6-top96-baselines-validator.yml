name: Recommendation Behavioral V6 Top96 Baselines Validator

on:
  pull_request:
    paths:
      - 'scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs'
      - '.github/workflows/recommendation-behavioral-v6-top96-baselines-validator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate read-only streaming baseline evaluator
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/evaluate-recommendation-behavioral-v6-top96-baselines.mjs'
          node --check "$script"
          grep -q "executorVersion = 'MERGED_TOP_96_BASELINES_STREAMING_2'" "$script"
          grep -q "choiceSetDefinition = 'MERGED_TOP_96'" "$script"
          grep -q "futureTestEvaluated: false" "$script"
          grep -q "trainingPerformed: false" "$script"
          grep -q "valueTrainingPerformed: false" "$script"
          grep -q "rowsMaterializedInHeap: false" "$script"
          grep -q "singlePassStreamingEvaluation: true" "$script"
          grep -q "HISTORICAL_PRIOR" "$script"
          grep -q "GENERATOR_PRIOR" "$script"
          grep -q "INVERSE_RANK" "$script"
          ! grep -q 'loadPinnedSample' "$script"
          ! grep -q 'rows.push(JSON.parse' "$script"

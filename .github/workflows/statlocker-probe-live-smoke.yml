name: Statlocker Probe Live Smoke

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-probe-live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify live UI and model endpoint tester
        shell: bash
        run: |
          set -euo pipefail
          host='aboba-telegramovich.duckdns.org'
          base="https://${host}/deadlock/tools/statlocker"
          resolve=(--resolve "${host}:443:127.0.0.1" -k)

          sleep 3

          curl "${resolve[@]}" --retry 8 --retry-delay 1 --retry-all-errors \
            --fail --silent --show-error "$base" -o "$RUNNER_TEMP/statlocker-ui.html"
          grep -q 'Statlocker Vision Model Probe' "$RUNNER_TEMP/statlocker-ui.html"

          curl "${resolve[@]}" --retry 8 --retry-delay 1 --retry-all-errors \
            --fail --silent --show-error "$base/presets" -o "$RUNNER_TEMP/statlocker-presets.json"

          curl "${resolve[@]}" --retry 8 --retry-delay 1 --retry-all-errors \
            --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST "$base/request" \
            --data '{"method":"GET","path":"/api/info/t4-chains-data","query":{},"body":{}}' \
            -o "$RUNNER_TEMP/statlocker-t4.json"

          curl "${resolve[@]}" --retry 8 --retry-delay 1 --retry-all-errors \
            --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST "$base/request" \
            --data '{"method":"GET","path":"/api/info/wpa-filtered-items","query":{"hero":"Abrams","tier":"all","queue":"ranked","rank":"all","category":"all","gameState":"all","purchaseTime":"all","teamComp":"all","buildType":"all","patch":"all","minSampleSize":500,"searchTerm":"","sortBy":"wpa","timeSyncEnabled":false,"currentGameTime":0,"timeWindow":5},"body":{}}' \
            -o "$RUNNER_TEMP/statlocker-wpa.json"

          python3 - "$RUNNER_TEMP/statlocker-presets.json" "$RUNNER_TEMP/statlocker-t4.json" "$RUNNER_TEMP/statlocker-wpa.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          presets = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          t4 = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          wpa = json.loads(Path(sys.argv[3]).read_text(encoding='utf-8'))

          if not isinstance(presets, list) or not presets:
              raise SystemExit('Presets endpoint returned no targets')
          if t4.get('status') != 200:
              raise SystemExit(f"Expected anonymous T4 endpoint HTTP 200, got {t4.get('status')}")
          if wpa.get('status') != 401:
              raise SystemExit(f"Expected Item Meta WPA endpoint HTTP 401 without Statlocker session, got {wpa.get('status')}")

          t4_data = t4.get('data') if isinstance(t4.get('data'), dict) else {}
          print(json.dumps({
              'ui': 'ok',
              'presets': len(presets),
              't4StatlockerStatus': t4.get('status'),
              't4TopLevelKeys': list(t4_data.keys())[:20],
              'itemMetaWpaAnonymousStatus': wpa.get('status'),
              'publicUrl': 'https://aboba-telegramovich.duckdns.org/deadlock/tools/statlocker',
          }, indent=2, ensure_ascii=False))
          PY

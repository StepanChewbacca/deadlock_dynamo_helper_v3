name: Recommendation Safe Disk Cleanup V3

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-safe-disk-cleanup-v3.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-safe-disk-cleanup-v3
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Delete stopped and failed training garbage
        shell: bash
        run: |
          set -euo pipefail

          evidence="$RUNNER_TEMP/recommendation-safe-disk-cleanup-$GITHUB_RUN_ID"
          mkdir -p "$evidence"
          summary="$evidence/summary.txt"

          deploy='/home/ubuntu/apps/deadlock_dynamo_helper'
          training='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          pause_marker="$training/PAUSED_BY_USER"

          test -s "$pause_marker"
          cd "$deploy"

          api_container="$(sudo docker compose ps -q api)"
          test -n "$api_container"
          storage="$(sudo docker inspect --format='{{range .Mounts}}{{if eq .Destination "/app/apps/api/storage"}}{{.Source}}{{end}}{{end}}' "$api_container")"
          test -n "$storage"
          test -d "$storage"

          case "$storage" in
            /var/lib/docker/volumes/*/_data) ;;
            *) echo "Refusing unexpected production storage: $storage" >&2; exit 1 ;;
          esac

          running_training_containers="$(sudo docker ps --format '{{.Names}}' | grep -Ei '(training|trainer|ablation)' || true)"
          running_training_services="$(sudo systemctl list-units --type=service --state=running --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          running_training_timers="$(sudo systemctl list-units --type=timer --state=active --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          running_training_processes="$(ps -eo pid=,args= --width 300 | grep -E '/home/ubuntu/apps/deadlock_dynamo_helper-training|run-[^ ]*training|train-[^ ]*recommendation|behavioral[^ ]*ablation' | grep -Ev 'grep -E|actions-runner|Runner\.(Listener|Worker)|recommendation-safe-disk-cleanup' || true)"

          test -z "$running_training_containers"
          test -z "$running_training_services"
          test -z "$running_training_timers"
          test -z "$running_training_processes"

          before_avail="$(df --output=avail -B1 / | tail -1 | tr -d ' ')"
          {
            echo "generatedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "productionApiContainer=$api_container"
            echo "productionStorage=$storage"
            echo "beforeAvailableBytes=$before_avail"
            echo '=== df before ==='
            df -hT /
            echo '=== storage top-level before ==='
            sudo du -xhd1 "$storage" 2>/dev/null | sort -h | tail -n 80 || true
            echo '=== docker before ==='
            sudo docker system df || true
          } | tee "$summary"

          protected=' build-decision-dataset-v3 match-timeline-events-v1 recommendation-decision-telemetry contextual-v3-training contextual-v3-candidate-evaluation-v2 contextual-v3-final-test recommendation-value-v6-training recommendation-value-v6-live-candidates recommendation-value-v6-user-live-telemetry item-catalog-snapshots deadlock-live recommendation-candidate-generator-snapshots recommendation-historical-pro-replay-v1 recommendation-pro-decision-dataset-v6-1 recommendation-behavioral-v5-1 recommendation-value-v8-diagnostic-1 recommendation-v6-short-only-dataset-v6-baseline-1 recommendation-value-v8-full-evaluation-1 recommendation-value-v8-passive-shadow-1 recommendation-behavioral-v7-historical-ledger-v1 recommendation-behavioral-v7-temporal-audit-v2 recommendation-observability-v7 recommendation-behavioral-v5-1-sweep-b-v1 '

          obsolete=(
            recommendation-value-v5-scale-sweep-full-crawler-20260725
            recommendation-value-v5-full-crawler-recovery-v3-20260725
            recommendation-value-v4-training-historical-bootstrap
            recommendation-value-v4-training-historical-bootstrap-tuning
            recommendation-value-v4-full-crawler-20260724
            recommendation-value-v4-training-historical-bootstrap-v2
            contextual-v3-candidate-evaluation-full-crawler-20260724
            match-timeline-events-v1-historical-db-20260726
            recommendation-value-v4-full-crawler-recovery-v3-20260725
            recommendation-behavioral-v4-full-crawler-20260724
            recommendation-behavioral-v4-training-historical-bootstrap
            recommendation-decision-dataset-v5-full-crawler-20260726
            recommendation-decision-dataset-v5-full-crawler-db-timeline-20260726
            recommendation-policy-v4-evaluation-historical-bootstrap
            recommendation-policy-v7-catboost-db-timeline-20260726
            contextual-v3-candidate-evaluation-full-crawler-recovery-v3-20260725
            contextual-v3-training-full-crawler-20260724
            recommendation-policy-v6-prior-sweep-db-timeline-20260726
            recommendation-value-v6-full-crawler-20260726
            recommendation-value-v6-full-crawler-db-timeline-20260726
            build-decision-dataset-v3-full-crawler-20260724
            recommendation-behavioral-v4-full-crawler-recovery-v3-20260725
            recommendation-policy-v6-full-crawler-20260726
            recommendation-policy-v6-full-crawler-db-timeline-20260726
            recommendation-value-v7-catboost-db-timeline-20260726
            recommendation-value-v6-prior-sweep-db-timeline-20260726
            recommendation-decision-dataset-v4-full-crawler-recovery-v3-20260725
          )

          deleted_paths=0
          estimated_bytes=0

          delete_path() {
            local path="$1"
            local reason="$2"
            local base
            base="$(basename "$path")"
            case "$path" in
              "$storage"/*|"$training"/*) ;;
              *) echo "REFUSE outside cleanup roots: $path" | tee -a "$summary"; return 1 ;;
            esac
            if [[ "$path" == "$storage"/* ]] && [[ "$protected" == *" $base "* ]]; then
              echo "REFUSE protected: $path" | tee -a "$summary"
              return 1
            fi
            [ -e "$path" ] || return 0
            local bytes
            bytes="$(sudo du -sb "$path" 2>/dev/null | awk '{print $1}')"
            bytes="${bytes:-0}"
            estimated_bytes=$((estimated_bytes + bytes))
            echo "DELETE [$reason] $path bytes=$bytes" | tee -a "$summary"
            sudo rm -rf --one-file-system "$path"
            test ! -e "$path"
            deleted_paths=$((deleted_paths + 1))
          }

          for name in "${obsolete[@]}"; do
            if [[ "$protected" == *" $name "* ]]; then
              echo "REFUSE obsolete/protected collision: $name" >&2
              exit 1
            fi
            delete_path "$storage/$name" 'audited-obsolete-exact-name'
          done

          if [ -d "$training" ]; then
            while IFS= read -r -d '' entry; do
              [ "$(basename "$entry")" = 'PAUSED_BY_USER' ] && continue
              delete_path "$entry" 'stopped-training-workspace'
            done < <(sudo find "$training" -mindepth 1 -maxdepth 1 -print0)
          fi

          while IFS= read -r -d '' path; do
            base="$(basename "$path")"
            [[ "$protected" == *" $base "* ]] && continue
            delete_path "$path" 'explicit-temp-or-partial'
          done < <(sudo find "$storage" -mindepth 1 -maxdepth 1 -type d \( -name '*.tmp' -o -name 'tmp-*' -o -name '*.partial' -o -name '*-partial' -o -name '*.failed' -o -name '*-failed' \) -print0 2>/dev/null)

          while IFS= read -r -d '' run_dir; do
            root="$(dirname "$(dirname "$run_dir")")"
            root_base="$(basename "$root")"
            [[ "$protected" == *" $root_base "* ]] && continue

            explicit_failure='false'
            while IFS= read -r -d '' json; do
              if sudo jq -e '((.state? // .status? // .conclusion? // "") | ascii_upcase) as $s | ($s == "FAILED" or $s == "FAILURE" or $s == "CANCELLED" or $s == "CANCELED" or $s == "ABORTED" or $s == "ERROR")' "$json" >/dev/null 2>&1; then
                explicit_failure='true'
                break
              fi
            done < <(sudo find "$run_dir" -maxdepth 2 -type f \( -name 'status.json' -o -name 'manifest.json' -o -name 'summary.json' -o -name 'result.json' \) -print0 2>/dev/null)

            if [ "$explicit_failure" = 'true' ]; then
              delete_path "$run_dir" 'explicit-failed-run'
            fi
          done < <(sudo find "$storage" -mindepth 3 -maxdepth 3 -type d -path '*/runs/*' -print0 2>/dev/null)

          mapfile -t stopped_training_containers < <(
            sudo docker ps -a --filter status=exited --filter status=created --format '{{.ID}} {{.Names}}' \
              | awk 'BEGIN{IGNORECASE=1} $0 ~ /(training|trainer|ablation|recommendation.*recovery|recommendation.*sweep)/ {print $1}' || true
          )
          for cid in "${stopped_training_containers[@]}"; do
            [ -n "$cid" ] || continue
            name="$(sudo docker inspect --format='{{.Name}}' "$cid" | sed 's#^/##')"
            echo "DELETE [stopped-training-container] $name $cid" | tee -a "$summary"
            sudo docker rm -f "$cid"
          done

          echo 'PRUNE [dangling-images]' | tee -a "$summary"
          sudo docker image prune -f | tee -a "$summary"
          echo 'PRUNE [build-cache-older-than-24h]' | tee -a "$summary"
          sudo docker builder prune -af --filter 'until=24h' | tee -a "$summary"

          after_avail="$(df --output=avail -B1 / | tail -1 | tr -d ' ')"
          reclaimed=$((after_avail - before_avail))
          {
            echo '=== df after ==='
            df -hT /
            echo '=== storage top-level after ==='
            sudo du -xhd1 "$storage" 2>/dev/null | sort -h | tail -n 80 || true
            echo '=== docker after ==='
            sudo docker system df || true
            echo "deletedPaths=$deleted_paths"
            echo "estimatedBytesRemoved=$estimated_bytes"
            echo "afterAvailableBytes=$after_avail"
            echo "actualAvailableBytesIncrease=$reclaimed"
            echo 'dockerVolumesPruned=false'
            echo 'dockerSystemPruneA=false'
            echo 'productionRuntimeRestarted=false'
          } | tee -a "$summary"

          sudo docker inspect "$api_container" > "$evidence/production-api-after.json"
          test "$(sudo docker inspect --format='{{.State.Running}}' "$api_container")" = 'true'

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-safe-disk-cleanup-v3-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-safe-disk-cleanup-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14

name: Recommendation Safe Disk Cleanup V3

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-safe-disk-cleanup-v3.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-safe-disk-cleanup-v3
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ false }}
    runs-on: self-hosted
    steps:
      - name: Cleanup completed and paused
        run: echo 'Recommendation safe disk cleanup is complete and paused.'

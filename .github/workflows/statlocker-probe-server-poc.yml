name: Statlocker Probe Server POC

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-probe-server-poc.yml'
      - 'apps/api/src/statlocker-probe-main.ts'
      - 'apps/api/src/statlocker-probe/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statlocker-probe-server-poc
  cancel-in-progress: true

jobs:
  deploy-probe:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout exact probe commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build browser-enabled Statlocker probe
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/Dockerfile.statlocker-probe" <<'DOCKERFILE'
          FROM node:20-alpine

          RUN apk add --no-cache \
            chromium \
            nss \
            freetype \
            harfbuzz \
            ca-certificates \
            ttf-freefont

          RUN mkdir -p /opt/statlocker-browser \
            && cd /opt/statlocker-browser \
            && npm init -y >/dev/null 2>&1 \
            && npm install puppeteer-core@24.16.0

          ENV CHROMIUM_PATH=/usr/bin/chromium-browser
          ENV NODE_PATH=/opt/statlocker-browser/node_modules

          WORKDIR /app
          COPY package.json yarn.lock tsconfig.base.json ./
          COPY packages/shared/package.json ./packages/shared/
          COPY packages/deadlock-build-domain/package.json ./packages/deadlock-build-domain/
          COPY apps/api/package.json ./apps/api/
          RUN yarn install --frozen-lockfile --ignore-engines

          COPY packages/shared ./packages/shared
          COPY packages/deadlock-build-domain ./packages/deadlock-build-domain
          COPY apps/api ./apps/api

          RUN yarn workspace @deadlock-live-probe/shared build \
            && yarn workspace @deadlock-live-probe/build-domain build \
            && yarn workspace @deadlock-live-probe/api build

          WORKDIR /app/apps/api
          EXPOSE 3000
          CMD ["node", "dist/src/statlocker-probe-main.js"]
          DOCKERFILE

          image="deadlock-statlocker-probe:${GITHUB_SHA}"
          sudo docker build \
            -f "$RUNNER_TEMP/Dockerfile.statlocker-probe" \
            -t "$image" \
            .

          echo "STATLOCKER_PROBE_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Start isolated probe
        shell: bash
        run: |
          set -euo pipefail

          host_port="$(python3 - <<'PY'
          import socket
          sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          sock.bind(('127.0.0.1', 0))
          print(sock.getsockname()[1])
          sock.close()
          PY
          )"

          [[ "$host_port" =~ ^[0-9]+$ ]]
          echo "STATLOCKER_PROBE_PORT=$host_port" >> "$GITHUB_ENV"

          sudo docker rm -f deadlock-statlocker-probe >/dev/null 2>&1 || true
          sudo docker run -d \
            --name deadlock-statlocker-probe \
            --restart unless-stopped \
            --shm-size=1g \
            -p "127.0.0.1:${host_port}:3000" \
            "$STATLOCKER_PROBE_IMAGE" >/dev/null

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${host_port}/deadlock/tools/statlocker/presets" \
              -o "$RUNNER_TEMP/presets.json"; then
              break
            fi

            if [ "$attempt" -eq 40 ]; then
              sudo docker logs --tail 250 deadlock-statlocker-probe || true
              exit 1
            fi

            sleep 1
          done

          echo "Browser probe healthy on 127.0.0.1:${host_port}"

      - name: Point Nginx route at new probe
        shell: bash
        run: |
          set -Eeuo pipefail

          domain='aboba-telegramovich.duckdns.org'
          nginx_file='/etc/nginx/sites-available/aboba-telegramovich.duckdns.org'
          backup="$RUNNER_TEMP/nginx-statlocker.backup"

          sudo cp "$nginx_file" "$backup"

          rollback() {
            echo 'Rolling back Statlocker Nginx route' >&2
            sudo cp "$backup" "$nginx_file" || true
            sudo nginx -t || true
            sudo systemctl reload nginx || true
          }

          trap 'status=$?; if [ "$status" -ne 0 ]; then rollback; fi; exit "$status"' EXIT

          sudo cat "$nginx_file" > "$RUNNER_TEMP/nginx-statlocker.input"
          export NGINX_INPUT="$RUNNER_TEMP/nginx-statlocker.input"
          export NGINX_OUTPUT="$RUNNER_TEMP/nginx-statlocker.output"
          export STATLOCKER_PROBE_PORT

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path(os.environ['NGINX_INPUT']).read_text(encoding='utf-8')
          port = os.environ['STATLOCKER_PROBE_PORT']

          marker_re = re.compile(
              r'(# BEGIN STATLOCKER_PROBE_POC\n.*?proxy_pass\s+http://127\.0\.0\.1:)\d+(;.*?# END STATLOCKER_PROBE_POC)',
              re.S,
          )

          updated, count = marker_re.subn(rf'\g<1>{port}\g<2>', source)

          if count == 0:
              anchor = '    location ^~ /deadlock/ {'
              if anchor not in source:
                  raise SystemExit('Could not find existing Statlocker marker or /deadlock/ anchor')

              snippet = f'''    # BEGIN STATLOCKER_PROBE_POC
              location ^~ /deadlock/tools/statlocker {{
                  proxy_pass http://127.0.0.1:{port};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 90s;
                  proxy_send_timeout 90s;
              }}
              # END STATLOCKER_PROBE_POC

          '''
              updated = source.replace(anchor, snippet + anchor, 1)

          # Browser model calls can take several seconds, so ensure the existing marker has enough timeout.
          updated = re.sub(
              r'(location \^~ /deadlock/tools/statlocker \{.*?proxy_read_timeout\s+)\d+s;',
              r'\g<1>90s;',
              updated,
              flags=re.S,
          )
          updated = re.sub(
              r'(location \^~ /deadlock/tools/statlocker \{.*?proxy_send_timeout\s+)\d+s;',
              r'\g<1>90s;',
              updated,
              flags=re.S,
          )

          Path(os.environ['NGINX_OUTPUT']).write_text(updated, encoding='utf-8')
          PY

          sudo cp "$RUNNER_TEMP/nginx-statlocker.output" "$nginx_file"
          sudo nginx -t
          sudo systemctl reload nginx

          for attempt in $(seq 1 20); do
            status="$(curl -k --silent --output "$RUNNER_TEMP/statlocker-ui.html" --write-out '%{http_code}' \
              --resolve "${domain}:443:127.0.0.1" \
              "https://${domain}/deadlock/tools/statlocker" || true)"

            if [ "$status" = '200' ] \
              && grep -q 'Statlocker Model Explorer' "$RUNNER_TEMP/statlocker-ui.html"; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "UI verification failed with HTTP ${status}" >&2
              exit 1
            fi

            sleep 1
          done

          trap - EXIT
          echo "STATLOCKER_PROBE_URL=https://${domain}/deadlock/tools/statlocker" >> "$GITHUB_ENV"

      - name: Prove WPA works through the real Statlocker website flow
        shell: bash
        run: |
          set -euo pipefail

          domain='aboba-telegramovich.duckdns.org'
          base='https://aboba-telegramovich.duckdns.org/deadlock/tools/statlocker'
          curl_args=(-k --resolve "${domain}:443:127.0.0.1")

          curl "${curl_args[@]}" \
            --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST "$base/browser-request" \
            --data '{"model":"ITEM_META_WPA","hero":"Abrams","minSampleSize":500}' \
            -o "$RUNNER_TEMP/browser-wpa.json"

          python3 - "$RUNNER_TEMP/browser-wpa.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          primary = result.get('primary') if isinstance(result.get('primary'), dict) else {}
          data = primary.get('data') if isinstance(primary.get('data'), dict) else {}

          if result.get('browserMode') is not True:
              raise SystemExit('Expected browserMode=true')
          if result.get('apiKeyProvidedByUs') is not False:
              raise SystemExit('The POC must not provide an API key')
          if primary.get('status') != 200:
              raise SystemExit(f"Expected browser-driven WPA HTTP 200, got {primary.get('status')}")
          if primary.get('path') != '/api/info/wpa-filtered-items':
              raise SystemExit(f"Unexpected primary path: {primary.get('path')}")

          required = {'items', 'tiers', 'availableHeroes', 'availableItems', 'availablePatches', 'availableRanks'}
          missing = sorted(required - set(data.keys()))
          if missing:
              raise SystemExit(f"WPA response missing expected keys: {missing}")

          print(json.dumps({
              'browserMode': result.get('browserMode'),
              'apiKeyProvidedByUs': result.get('apiKeyProvidedByUs'),
              'statlockerStatus': primary.get('status'),
              'path': primary.get('path'),
              'responseKeys': list(data.keys())[:20],
              'itemCount': len(data.get('items') or []),
              'elapsedMs': result.get('elapsedMs'),
          }, indent=2, ensure_ascii=False))
          PY

      - name: Prove Eternus derived build analysis works through the site
        shell: bash
        run: |
          set -euo pipefail

          domain='aboba-telegramovich.duckdns.org'
          base='https://aboba-telegramovich.duckdns.org/deadlock/tools/statlocker'
          curl_args=(-k --resolve "${domain}:443:127.0.0.1")

          curl "${curl_args[@]}" \
            --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST "$base/browser-request" \
            --data '{"model":"ETERNUS_BUILD_ANALYSIS","hero":"Abrams","minSampleSize":50}' \
            -o "$RUNNER_TEMP/browser-eternus.json"

          python3 - "$RUNNER_TEMP/browser-eternus.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          primary = result.get('primary') if isinstance(result.get('primary'), dict) else {}
          data = primary.get('data') if isinstance(primary.get('data'), dict) else {}

          if result.get('apiKeyProvidedByUs') is not False:
              raise SystemExit('The POC must not provide an API key')
          if primary.get('status') != 200:
              raise SystemExit(f"Expected Eternus browser response HTTP 200, got {primary.get('status')}")
          if not str(primary.get('path') or '').startswith('/api/info/player-build-analysis/'):
              raise SystemExit(f"Unexpected Eternus primary path: {primary.get('path')}")
          if 'items' not in data or 'itemRelationships' not in data:
              raise SystemExit('Eternus build analysis missing items/itemRelationships')

          print(json.dumps({
              'statlockerStatus': primary.get('status'),
              'path': primary.get('path'),
              'totalMatches': data.get('totalMatches'),
              'itemCount': len(data.get('items') or []),
              'relationshipCount': len(data.get('itemRelationships') or []),
              'capturedCount': len(result.get('captured') or []),
          }, indent=2, ensure_ascii=False))
          PY

          echo "Open in browser: $STATLOCKER_PROBE_URL"

      - name: Show probe container state
        if: always()
        shell: bash
        run: |
          sudo docker ps \
            --filter name=deadlock-statlocker-probe \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true

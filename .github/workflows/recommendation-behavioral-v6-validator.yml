name: Recommendation Behavioral V6 Validator

on:
  pull_request:
    paths:
      - 'apps/api/src/deadlock-live/recommendation-behavioral-v6.ts'
      - 'apps/api/test/recommendation-behavioral-v6.spec.ts'
      - 'apps/api/src/deadlock-live/recommendation-behavioral-v6-choice-set.ts'
      - 'apps/api/test/recommendation-behavioral-v6-choice-set.spec.ts'
      - 'scripts/audit-recommendation-behavioral-v6-choice-set.mjs'
      - 'scripts/evaluate-recommendation-behavioral-v6-choice-set-candidates.mjs'
      - 'scripts/apply-recommendation-behavioral-v6-hot-path-optimization.mjs'
      - 'scripts/run-recommendation-behavioral-v6-equal-capacity-ablation.mjs'
      - '.github/workflows/recommendation-behavioral-v6-choice-set-audit-v1.yml'
      - '.github/workflows/recommendation-behavioral-v6-choice-set-audit-v2-background.yml'
      - '.github/workflows/recommendation-behavioral-v6-choice-set-audit-v2-background-status.yml'
      - '.github/workflows/recommendation-behavioral-v6-feasibility-source-audit-v1.yml'
      - '.github/workflows/recommendation-behavioral-v6-choice-set-candidate-evaluation-v1.yml'
      - '.github/workflows/recommendation-behavioral-v6-equal-capacity-ablation-v1-background.yml'
      - '.github/workflows/recommendation-behavioral-v6-validator.yml'
      - 'docs/recommendation-behavioral-v6-feasible-choice-set-roadmap.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate V6 executors and authorization safety
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit-recommendation-behavioral-v6-choice-set.mjs
          node --check scripts/evaluate-recommendation-behavioral-v6-choice-set-candidates.mjs
          node --check scripts/apply-recommendation-behavioral-v6-hot-path-optimization.mjs
          node --check scripts/run-recommendation-behavioral-v6-equal-capacity-ablation.mjs

          choice_v1_request='.github/research-requests/recommendation-behavioral-v6-choice-set-audit-v1.json'
          if [ -e "$choice_v1_request" ]; then
            jq -e '.trainingAuthorized == false and .valueTrainingAuthorized == false and .productionChangesAuthorized == false' "$choice_v1_request"
          fi

          choice_v2_request='.github/research-requests/recommendation-behavioral-v6-choice-set-audit-v2-background.json'
          if [ -e "$choice_v2_request" ]; then
            jq -e '
              .schemaVersion == 2 and
              .backgroundResearch == true and
              .auditTimeLimit == "NONE" and
              .trainingAuthorized == false and
              .valueTrainingAuthorized == false and
              .productionChangesAuthorized == false and
              .futureTestAuthorized == false and
              .outputDirectory == "recommendation-behavioral-v6-choice-set-audit-v2-background"
            ' "$choice_v2_request"
          fi

          feasibility_request='.github/research-requests/recommendation-behavioral-v6-feasibility-source-audit-v1.json'
          if [ -e "$feasibility_request" ]; then
            jq -e '.trainingAuthorized == false and .valueTrainingAuthorized == false and .productionChangesAuthorized == false' "$feasibility_request"
          fi

          choice_eval_request='.github/research-requests/recommendation-behavioral-v6-choice-set-candidate-evaluation-v1.json'
          if [ -e "$choice_eval_request" ]; then
            jq -e '.trainingAuthorized == false and .valueTrainingAuthorized == false and .productionChangesAuthorized == false and .futureTestAuthorized == false' "$choice_eval_request"
          fi

          ablation_request='.github/training-requests/recommendation-behavioral-v6-equal-capacity-ablation-v1-background.json'
          if [ -e "$ablation_request" ]; then
            jq -e '
              .schemaVersion == 1 and
              .operation == "RECOMMENDATION_BEHAVIORAL_V6_EQUAL_CAPACITY_ABLATION" and
              .backgroundTraining == true and
              .trainingTimeLimit == "NONE" and
              .boundedAblationAuthorized == true and
              .fullTrainingAuthorized == false and
              .valueV8TrainingAuthorized == false and
              .productionRankingChanged == false and
              .passiveShadowAuthorized == false and
              .randomizedCanaryAuthorized == false and
              .futureTestAuthorized == false and
              .choiceSetDefinition == "MERGED_TOP_96" and
              .linearHashDimension == 65536 and
              .foldCount == 5 and
              .epochs == 5 and
              .learningRate == 0.1 and
              .l2 == 0.0001 and
              .outputDirectory == "recommendation-behavioral-v6-equal-capacity-ablation-v1-background"
            ' "$ablation_request"
          fi

          ! grep -R --line-number --fixed-strings 'trainingAuthorized == true' \
            .github/workflows/recommendation-behavioral-v6-choice-set-audit-v1.yml \
            .github/workflows/recommendation-behavioral-v6-choice-set-audit-v2-background.yml \
            .github/workflows/recommendation-behavioral-v6-feasibility-source-audit-v1.yml \
            .github/workflows/recommendation-behavioral-v6-choice-set-candidate-evaluation-v1.yml
          ! grep -R --line-number --fixed-strings 'valueTrainingAuthorized == true' \
            .github/workflows/recommendation-behavioral-v6-choice-set-audit-v1.yml \
            .github/workflows/recommendation-behavioral-v6-choice-set-audit-v2-background.yml \
            .github/workflows/recommendation-behavioral-v6-feasibility-source-audit-v1.yml \
            .github/workflows/recommendation-behavioral-v6-choice-set-candidate-evaluation-v1.yml

          grep -q 'auditTimeLimit == "NONE"' .github/workflows/recommendation-behavioral-v6-choice-set-audit-v2-background.yml
          grep -q 'backgroundResearch == true' .github/workflows/recommendation-behavioral-v6-choice-set-audit-v2-background.yml
          grep -q 'netWorthMaySubstituteForSpendableCurrency' .github/workflows/recommendation-behavioral-v6-feasibility-source-audit-v1.yml
          grep -q 'MERGED_TOP_' scripts/evaluate-recommendation-behavioral-v6-choice-set-candidates.mjs
          grep -q 'AGGREGATE_DATA_GRADIENT_THEN_SINGLE_L2_UPDATE_PER_PARAMETER' apps/api/src/deadlock-live/recommendation-behavioral-v6.ts
          grep -q "'LINEAR_ONLY'" apps/api/src/deadlock-live/recommendation-behavioral-v6.ts
          grep -q "'LINEAR_PLUS_TOWER'" apps/api/src/deadlock-live/recommendation-behavioral-v6.ts
          grep -q "choiceSetDefinition = 'MERGED_TOP_96'" scripts/run-recommendation-behavioral-v6-equal-capacity-ablation.mjs
          grep -q 'linearHashDimension: 65_536' scripts/run-recommendation-behavioral-v6-equal-capacity-ablation.mjs
          grep -q 'trainingTimeLimit == "NONE"' .github/workflows/recommendation-behavioral-v6-equal-capacity-ablation-v1-background.yml
          grep -q 'systemd-run' .github/workflows/recommendation-behavioral-v6-equal-capacity-ablation-v1-background.yml
          ! grep -q 'timeout .*run-recommendation-behavioral-v6-equal-capacity-ablation' .github/workflows/recommendation-behavioral-v6-equal-capacity-ablation-v1-background.yml

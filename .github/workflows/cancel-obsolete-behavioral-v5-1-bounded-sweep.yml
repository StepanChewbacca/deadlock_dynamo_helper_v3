name: Cancel Obsolete Behavioral V5.1 Bounded Sweep

on:
  pull_request:
    paths:
      - '.github/training-requests/cancel-obsolete-behavioral-v5-1-bounded-sweep.json'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v5-1-bounded-sweep-v1
  cancel-in-progress: true

jobs:
  cancel-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm obsolete bounded sweep cancellation
        run: |
          echo 'Cancelling obsolete Behavioral V5.1 bounded sweep concurrency.'
          echo 'No self-hosted runner, training, storage mutation, cleanup, or model execution is performed.'

name: Recommendation Behavioral V6 Latent State Mixture Screen V1 Status

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-behavioral-v6-latent-mixture-screen-v1-status.json'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v6-latent-mixture-screen-v1-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read latent-mixture status and diagnostic gate
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-behavioral-v6-latent-mixture-screen-v1-status.json'
          jq -e '.schemaVersion == 1 and .operation == "RECOMMENDATION_BEHAVIORAL_V6_LATENT_STATE_MIXTURE_SCREEN_STATUS" and .trainingAuthorized == false and .productionChangesAuthorized == false' "$request"
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          diagnostic="$storage/recommendation-behavioral-v6-latent-state-regime-diagnostic-v1/report.json"
          output="$storage/recommendation-behavioral-v6-latent-mixture-screen-v1-background"
          echo 'Latent-state diagnostic:'
          if sudo test -s "$diagnostic"; then
            sudo jq '{selectedRegimeId,selectedRegime,diagnosticChecks,latentStateSignalSupported,boundedLatentMixtureScreenRecommended,nextStep}' "$diagnostic"
          else
            echo 'diagnostic report not present'
          fi
          echo 'Background status:'
          sudo cat "$output/background-status.json" 2>/dev/null || true
          echo 'Systemd/container:'
          sudo systemctl list-units --type=service --all --no-legend | grep 'deadlock-behavioral-v6-latent-mixture-' || true
          sudo docker ps -a --format '{{.Names}} {{.Status}}' | grep 'deadlock-behavioral-v6-latent-mixture-' || true
          echo 'Container resources:'
          container="$(sudo docker ps --format '{{.Names}}' | grep '^deadlock-behavioral-v6-latent-mixture-' | head -n 1 || true)"
          if [ -n "$container" ]; then
            sudo docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}} MEM_PCT={{.MemPerc}} PIDS={{.PIDs}}' "$container" || true
          fi
          echo 'Progress log tail:'
          sudo tail -n 200 "$output/container.log" 2>/dev/null || true
          echo 'Screen summary:'
          if sudo test -s "$output/screen-summary.json"; then
            sudo jq '{schemaVersion,operation,executorVersion,source,choiceSet,contracts,modelConfig,trainingConfig,training,diagnosticAuthorization,tuning,sequenceReference,cohortComparison,continuationChecks,screenPassed,strictCrossFitRecommended,currentFamily,nextStep,diagnosticOnly,trainingArtifactEligible}' "$output/screen-summary.json"
          fi
          echo 'Container inspect state:'
          if sudo test -s "$output/container-inspect.json"; then
            sudo jq '.[0].State | {Status,Running,OOMKilled,ExitCode,StartedAt,FinishedAt,Error}' "$output/container-inspect.json"
          fi

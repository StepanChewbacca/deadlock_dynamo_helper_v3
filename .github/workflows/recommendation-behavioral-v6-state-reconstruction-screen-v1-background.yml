name: Recommendation Behavioral V6 State Reconstruction Screen V1 Background

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-behavioral-v6-state-reconstruction-screen-v1-background.json'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v6-state-reconstruction-screen-v1-background
  cancel-in-progress: false

jobs:
  launch-background-screen:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout requested implementation
        uses: actions/checkout@v4

      - name: Setup Node.js for preflight
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate authorization, fallback evidence, lineage, and capacity
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-behavioral-v6-state-reconstruction-screen-v1-background.json'
          jq -e '
            .schemaVersion == 1 and
            .operation == "RECOMMENDATION_BEHAVIORAL_V6_SEQUENCE_STATE_RECONSTRUCTION_SCREEN" and
            .backgroundTraining == true and
            .trainingTimeLimit == "NONE" and
            .boundedScreenAuthorized == true and
            .strictCrossFitAuthorized == false and
            .fullTrainingAuthorized == false and
            .valueV8TrainingAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowAuthorized == false and
            .randomizedCanaryAuthorized == false and
            .futureTestAuthorized == false and
            .choiceSetDefinition == "MERGED_TOP_96" and
            .historyLength == 16 and
            .hiddenDimension == 12 and
            .epochs == 3 and
            .behaviorLearningRate == 0.025 and
            .reconstructionLearningRate == 0.01 and
            .outputDirectory == "recommendation-behavioral-v6-state-reconstruction-screen-v1-background"
          ' "$request"
          node --check scripts/run-recommendation-behavioral-v6-state-reconstruction-screen.mjs

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          sample_name='recommendation-behavioral-v5-1-sweep-b-v1'
          v3_name='recommendation-behavioral-v6-equal-capacity-ablation-v3-streaming-background'
          sequence_name='recommendation-behavioral-v6-sequence-neural-screen-v1-background'
          latent_name='recommendation-behavioral-v6-latent-state-regime-diagnostic-v1'
          output_name='recommendation-behavioral-v6-state-reconstruction-screen-v1-background'
          sample="$storage/$sample_name/diagnostic-sample.ndjson.gz"
          choice="$storage/$v3_name/choice-set-candidate-evaluation.json"
          sequence="$storage/$sequence_name"
          latent="$storage/$latent_name/report.json"
          output="$storage/$output_name"

          test "$(sudo sha256sum "$sample" | awk '{print $1}')" = '8d87519d797b54fc3f726837e80bb79968b44dc59960dadcb934261f329ce1ac'
          test "$(sudo sha256sum "$choice" | awk '{print $1}')" = 'b2953bc63baff315cc66d4bdfb0ca8655e5fef0a99fc6916c782821f8c31e664'
          sudo jq -e '
            .operation == "RECOMMENDATION_BEHAVIORAL_V6_LATENT_STATE_REGIME_DIAGNOSTIC" and
            .source.futureTestRowCount == 0 and
            .protocol.assignmentUsesObservedAction == false and
            .protocol.assignmentUsesOutcome == false and
            .protocol.assignmentUsesFutureState == false and
            .latentStateSignalSupported == false and
            .boundedLatentMixtureScreenRecommended == false and
            .nextStep == "DOCUMENT_OBSERVABILITY_SUPPORT_CEILING" and
            .trainingPerformed == false and
            .valueTrainingPerformed == false
          ' "$latent"
          sudo jq -e '
            .state == "SUCCEEDED" and
            .exitCode == 0 and
            .oomKilled != "true" and
            .executorVersion == "MERGED_TOP_96_SEQUENCE_NEURAL_SCREEN_1"
          ' "$sequence/background-status.json"
          sudo jq -e '
            .operation == "RECOMMENDATION_BEHAVIORAL_V6_SEQUENCE_NEURAL_SCREEN" and
            .source.futureTestRowCount == 0 and
            .choiceSet.definition == "MERGED_TOP_96" and
            .training.tuningUsedForTraining == false and
            .training.tuningUsedForEarlyStopping == false and
            .screenPassed == false and
            .strictCrossFitRecommended == false and
            .continuationChecks.orderedHistorySignalObserved == true and
            .nextFamilyRecommended == "LATENT_STATE_MIXTURE_OR_STATE_RECONSTRUCTION" and
            .trainingArtifactEligible == false
          ' "$sequence/screen-summary.json"

          if sudo test -e "$output"; then
            echo "Refusing destructive reuse of existing state-reconstruction output: $output" >&2
            exit 1
          fi
          if sudo systemctl list-units --type=service --state=running --no-legend | grep -q 'deadlock-behavioral-v6-state-reconstruction-'; then
            echo 'Refusing duplicate state-reconstruction service.' >&2
            exit 1
          fi
          if sudo docker ps --format '{{.Names}}' | grep -q '^deadlock-behavioral-v6-state-reconstruction-'; then
            echo 'Refusing duplicate state-reconstruction container.' >&2
            exit 1
          fi

          free_kb="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          mem_available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          test "$free_kb" -ge $((12 * 1024 * 1024))
          test "$mem_available_kb" -ge $((4 * 1024 * 1024))
          df -h /
          free -h

          sudo mkdir "$output"
          sudo chmod 0777 "$output"
          echo "storage=$storage" >> "$GITHUB_OUTPUT"
          echo "sample_name=$sample_name" >> "$GITHUB_OUTPUT"
          echo "v3_name=$v3_name" >> "$GITHUB_OUTPUT"
          echo "sequence_name=$sequence_name" >> "$GITHUB_OUTPUT"
          echo "latent_name=$latent_name" >> "$GITHUB_OUTPUT"
          echo "output_name=$output_name" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Build isolated state-reconstruction image
        shell: bash
        run: |
          set -euo pipefail
          image="deadlock-behavioral-v6-state-reconstruction:$GITHUB_RUN_ID"
          sudo docker build \
            --label deadlock.recommendation.operation=behavioral-v6-state-reconstruction-screen-v1 \
            --label deadlock.recommendation.git-sha="$GITHUB_SHA" \
            -t "$image" \
            .

      - name: Launch state-reconstruction screen as detached systemd service
        shell: bash
        run: |
          set -euo pipefail
          storage='${{ steps.preflight.outputs.storage }}'
          sample_name='${{ steps.preflight.outputs.sample_name }}'
          v3_name='${{ steps.preflight.outputs.v3_name }}'
          sequence_name='${{ steps.preflight.outputs.sequence_name }}'
          latent_name='${{ steps.preflight.outputs.latent_name }}'
          output_name='${{ steps.preflight.outputs.output_name }}'
          output='${{ steps.preflight.outputs.output }}'
          image="deadlock-behavioral-v6-state-reconstruction:$GITHUB_RUN_ID"
          container="deadlock-behavioral-v6-state-reconstruction-$GITHUB_RUN_ID"
          unit="deadlock-behavioral-v6-state-reconstruction-$GITHUB_RUN_ID"
          launcher="/var/tmp/$unit.sh"

          cat > "$RUNNER_TEMP/state-reconstruction-launcher.sh" <<EOF
          #!/usr/bin/env bash
          set -uo pipefail
          output='$output'
          container='$container'
          image='$image'
          launcher='$launcher'
          started_at="\$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "\$output/background-status.json" <<JSON
          {
            "schemaVersion": 1,
            "state": "RUNNING",
            "startedAt": "\$started_at",
            "unit": "$unit",
            "container": "\$container",
            "image": "\$image",
            "executorVersion": "MERGED_TOP_96_SEQUENCE_STATE_RECONSTRUCTION_SCREEN_1",
            "trainingTimeLimit": "NONE",
            "backgroundTraining": true
          }
          JSON
          sudo docker run --name "\$container" \
            --network none \
            --read-only \
            --memory 6g \
            --memory-swap 10g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -e NODE_OPTIONS=--max-old-space-size=4096 \
            -e BEHAVIORAL_V6_SAMPLE_PATH='/app/apps/api/storage/$sample_name/diagnostic-sample.ndjson.gz' \
            -e BEHAVIORAL_V6_CHOICE_SET_REPORT_PATH='/app/apps/api/storage/$v3_name/choice-set-candidate-evaluation.json' \
            -e BEHAVIORAL_V6_SEQUENCE_SUMMARY_PATH='/app/apps/api/storage/$sequence_name/screen-summary.json' \
            -e BEHAVIORAL_V6_LATENT_STATE_DIAGNOSTIC_PATH='/app/apps/api/storage/$latent_name/report.json' \
            -e BEHAVIORAL_V6_STATE_RECONSTRUCTION_OUTPUT_DIR='/app/apps/api/storage/$output_name' \
            -e EXPECTED_DIAGNOSTIC_SAMPLE_SHA256='8d87519d797b54fc3f726837e80bb79968b44dc59960dadcb934261f329ce1ac' \
            -e EXPECTED_CHOICE_SET_REPORT_SHA256='b2953bc63baff315cc66d4bdfb0ca8655e5fef0a99fc6916c782821f8c31e664' \
            -v '$storage/$sample_name:/app/apps/api/storage/$sample_name:ro' \
            -v '$storage/$v3_name:/app/apps/api/storage/$v3_name:ro' \
            -v '$storage/$sequence_name:/app/apps/api/storage/$sequence_name:ro' \
            -v '$storage/$latent_name:/app/apps/api/storage/$latent_name:ro' \
            -v '$storage/$output_name:/app/apps/api/storage/$output_name:rw' \
            "\$image" node /app/scripts/run-recommendation-behavioral-v6-state-reconstruction-screen.mjs \
            > "\$output/container.log" 2>&1
          exit_code=\$?
          sudo docker inspect "\$container" > "\$output/container-inspect.json" 2>/dev/null || true
          oom_killed="\$(sudo docker inspect -f '{{.State.OOMKilled}}' "\$container" 2>/dev/null || echo unknown)"
          finished_at="\$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          state='FAILED'
          if [ "\$exit_code" -eq 0 ] && [ -s "\$output/screen-summary.json" ]; then state='SUCCEEDED'; fi
          cat > "\$output/background-status.json" <<JSON
          {
            "schemaVersion": 1,
            "state": "\$state",
            "startedAt": "\$started_at",
            "finishedAt": "\$finished_at",
            "unit": "$unit",
            "container": "\$container",
            "image": "\$image",
            "executorVersion": "MERGED_TOP_96_SEQUENCE_STATE_RECONSTRUCTION_SCREEN_1",
            "exitCode": \$exit_code,
            "oomKilled": "\$oom_killed",
            "trainingTimeLimit": "NONE",
            "backgroundTraining": true
          }
          JSON
          sudo docker rm "\$container" >/dev/null 2>&1 || true
          sudo docker image rm "\$image" >/dev/null 2>&1 || true
          sudo rm -f "\$launcher"
          exit "\$exit_code"
          EOF
          sudo install -m 0755 "$RUNNER_TEMP/state-reconstruction-launcher.sh" "$launcher"
          rm -f "$RUNNER_TEMP/state-reconstruction-launcher.sh"

          cat > "$RUNNER_TEMP/background-launch.json" <<JSON
          {
            "schemaVersion": 1,
            "launcherRunId": "$GITHUB_RUN_ID",
            "unit": "$unit",
            "outputDirectory": "$output_name",
            "image": "$image",
            "executorVersion": "MERGED_TOP_96_SEQUENCE_STATE_RECONSTRUCTION_SCREEN_1",
            "backgroundTraining": true,
            "trainingTimeLimit": "NONE"
          }
          JSON
          sudo install -m 0644 "$RUNNER_TEMP/background-launch.json" "$output/background-launch.json"
          rm -f "$RUNNER_TEMP/background-launch.json"
          sudo systemd-run --collect \
            --unit="$unit" \
            --description="Deadlock Behavioral V6 sequence state reconstruction screen $GITHUB_RUN_ID" \
            --property=Restart=no \
            "$launcher"

      - name: Confirm detached background screen
        shell: bash
        run: |
          set -euo pipefail
          output='${{ steps.preflight.outputs.output }}'
          unit="deadlock-behavioral-v6-state-reconstruction-$GITHUB_RUN_ID"
          container="deadlock-behavioral-v6-state-reconstruction-$GITHUB_RUN_ID"
          for attempt in $(seq 1 30); do
            if sudo test -s "$output/background-status.json" && \
               sudo jq -e '.state == "RUNNING" and .trainingTimeLimit == "NONE" and .backgroundTraining == true and .executorVersion == "MERGED_TOP_96_SEQUENCE_STATE_RECONSTRUCTION_SCREEN_1"' "$output/background-status.json" >/dev/null && \
               sudo systemctl is-active --quiet "$unit" && \
               sudo docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null | grep -qx true; then
              sudo cat "$output/background-status.json"
              exit 0
            fi
            sleep 2
          done
          sudo cat "$output/background-status.json" 2>/dev/null || true
          sudo systemctl status "$unit" --no-pager || true
          sudo docker logs "$container" 2>&1 | tail -n 120 || true
          exit 1

name: Statlocker Runner Sanity

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-runner-sanity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify shell and production prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "runner=${RUNNER_NAME:-unknown} arch=${RUNNER_ARCH:-unknown} os=${RUNNER_OS:-unknown}"
          uname -a
          id
          df -h /
          free -h || true
          sudo docker version --format '{{.Server.Version}}'
          sudo docker compose version
          sudo docker ps --format '{{.Names}}' | head -n 20

name: Recommendation Behavioral V6 Grouped Boosted Listwise Screen V2 Background

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-behavioral-v6-grouped-boosted-listwise-screen-v2-background.json'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v6-grouped-boosted-listwise-screen-v2-background
  cancel-in-progress: false

jobs:
  launch-background-screen:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout requested implementation
        uses: actions/checkout@v4

      - name: Setup Node.js for preflight
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate authorization, lineage, capacity, and duplicate protection
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-behavioral-v6-grouped-boosted-listwise-screen-v2-background.json'
          jq -e '
            .schemaVersion == 2 and
            .operation == "RECOMMENDATION_BEHAVIORAL_V6_GROUPED_BOOSTED_LISTWISE_SCREEN" and
            .backgroundTraining == true and
            .trainingTimeLimit == "NONE" and
            .boundedScreenAuthorized == true and
            .strictCrossFitAuthorized == false and
            .fullTrainingAuthorized == false and
            .valueV8TrainingAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowAuthorized == false and
            .randomizedCanaryAuthorized == false and
            .futureTestAuthorized == false and
            .choiceSetDefinition == "MERGED_TOP_96" and
            .treeCount == 8 and
            .learningRate == 0.1 and
            .leafL2 == 10 and
            .maximumLeafValue == 1.5 and
            .minimumLeafCandidateCount == 500 and
            .outputDirectory == "recommendation-behavioral-v6-grouped-boosted-listwise-screen-v2-background"
          ' "$request"
          node --check scripts/run-recommendation-behavioral-v6-grouped-boosted-listwise-screen.mjs

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          sample_name='recommendation-behavioral-v5-1-sweep-b-v1'
          v3_name='recommendation-behavioral-v6-equal-capacity-ablation-v3-streaming-background'
          gate_name='recommendation-behavioral-v6-ablation-baseline-gate-v1'
          output_name='recommendation-behavioral-v6-grouped-boosted-listwise-screen-v2-background'
          sample="$storage/$sample_name/diagnostic-sample.ndjson.gz"
          choice="$storage/$v3_name/choice-set-candidate-evaluation.json"
          gate="$storage/$gate_name/report.json"
          v3="$storage/$v3_name/ablation-summary.json"
          output="$storage/$output_name"

          test "$(sudo sha256sum "$sample" | awk '{print $1}')" = '8d87519d797b54fc3f726837e80bb79968b44dc59960dadcb934261f329ce1ac'
          sudo test -s "$choice"
          test "$(sudo sha256sum "$choice" | awk '{print $1}')" = 'b2953bc63baff315cc66d4bdfb0ca8655e5fef0a99fc6916c782821f8c31e664'
          sudo jq -e '
            .schemaVersion == 1 and
            .operation == "RECOMMENDATION_BEHAVIORAL_V6_CHOICE_SET_CANDIDATE_EVALUATION" and
            .trainingPerformed == false and
            .valueTrainingPerformed == false and
            .futureTestEvaluated == false and
            .recommendation.candidateDefinitionId == "MERGED_TOP_96"
          ' "$choice"
          sudo jq -e '
            .operation == "RECOMMENDATION_BEHAVIORAL_V6_ABLATION_BASELINE_GATE" and
            .currentFamilyContinuationRecommended == false and
            .nextFamilyRecommended == "GROUPED_BOOSTED_LISTWISE" and
            .futureTestEvaluated == false and
            .fullTrainingAuthorized == false and
            .valueV8TrainingAuthorized == false
          ' "$gate"
          sudo jq -e '
            .schemaVersion == 2 and
            .operation == "RECOMMENDATION_BEHAVIORAL_V6_EQUAL_CAPACITY_ABLATION" and
            .source.futureTestRowCount == 0 and
            .choiceSet.definition == "MERGED_TOP_96" and
            .anyReleaseEligible == false and
            .nextFamilyRecommended == "GROUPED_BOOSTED_LISTWISE"
          ' "$v3"

          if sudo test -e "$output"; then
            echo "Refusing destructive reuse of existing boosted screen V2 output: $output" >&2
            exit 1
          fi
          if sudo systemctl list-units --type=service --state=running --no-legend | grep -q 'deadlock-behavioral-v6-boosted-screen-'; then
            echo 'Refusing duplicate boosted-listwise screen service.' >&2
            exit 1
          fi
          if sudo docker ps --format '{{.Names}}' | grep -q '^deadlock-behavioral-v6-boosted-screen-'; then
            echo 'Refusing duplicate boosted-listwise screen container.' >&2
            exit 1
          fi

          free_kb="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          mem_available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          test "$free_kb" -ge $((12 * 1024 * 1024))
          test "$mem_available_kb" -ge $((4 * 1024 * 1024))
          df -h /
          free -h

          sudo mkdir "$output"
          sudo chmod 0777 "$output"
          echo "storage=$storage" >> "$GITHUB_OUTPUT"
          echo "sample_name=$sample_name" >> "$GITHUB_OUTPUT"
          echo "v3_name=$v3_name" >> "$GITHUB_OUTPUT"
          echo "gate_name=$gate_name" >> "$GITHUB_OUTPUT"
          echo "output_name=$output_name" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Build isolated boosted-listwise image
        shell: bash
        run: |
          set -euo pipefail
          image="deadlock-behavioral-v6-boosted-screen-v2:$GITHUB_RUN_ID"
          sudo docker build \
            --label deadlock.recommendation.operation=behavioral-v6-grouped-boosted-listwise-screen-v2 \
            --label deadlock.recommendation.git-sha="$GITHUB_SHA" \
            -t "$image" \
            .

      - name: Launch boosted-listwise screen as detached systemd service
        shell: bash
        run: |
          set -euo pipefail
          storage='${{ steps.preflight.outputs.storage }}'
          sample_name='${{ steps.preflight.outputs.sample_name }}'
          v3_name='${{ steps.preflight.outputs.v3_name }}'
          gate_name='${{ steps.preflight.outputs.gate_name }}'
          output_name='${{ steps.preflight.outputs.output_name }}'
          output='${{ steps.preflight.outputs.output }}'
          image="deadlock-behavioral-v6-boosted-screen-v2:$GITHUB_RUN_ID"
          container="deadlock-behavioral-v6-boosted-screen-v2-$GITHUB_RUN_ID"
          unit="deadlock-behavioral-v6-boosted-screen-v2-$GITHUB_RUN_ID"
          launcher="/var/tmp/$unit.sh"

          cat > "$RUNNER_TEMP/boosted-screen-v2-launcher.sh" <<EOF
          #!/usr/bin/env bash
          set -uo pipefail
          output='$output'
          container='$container'
          image='$image'
          launcher='$launcher'
          started_at="\$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "\$output/background-status.json" <<JSON
          {
            "schemaVersion": 2,
            "state": "RUNNING",
            "startedAt": "\$started_at",
            "unit": "$unit",
            "container": "\$container",
            "image": "\$image",
            "executorVersion": "MERGED_TOP_96_GROUPED_BOOSTED_LISTWISE_SCREEN_1",
            "trainingTimeLimit": "NONE",
            "backgroundTraining": true
          }
          JSON
          sudo docker run --name "\$container" \
            --network none \
            --read-only \
            --memory 6g \
            --memory-swap 10g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -e NODE_OPTIONS=--max-old-space-size=4096 \
            -e BEHAVIORAL_V6_SAMPLE_PATH='/app/apps/api/storage/$sample_name/diagnostic-sample.ndjson.gz' \
            -e BEHAVIORAL_V6_CHOICE_SET_REPORT_PATH='/app/apps/api/storage/$v3_name/choice-set-candidate-evaluation.json' \
            -e BEHAVIORAL_V6_BASELINE_GATE_PATH='/app/apps/api/storage/$gate_name/report.json' \
            -e BEHAVIORAL_V6_V3_SUMMARY_PATH='/app/apps/api/storage/$v3_name/ablation-summary.json' \
            -e BEHAVIORAL_V6_BOOSTED_SCREEN_OUTPUT_DIR='/app/apps/api/storage/$output_name' \
            -e EXPECTED_DIAGNOSTIC_SAMPLE_SHA256='8d87519d797b54fc3f726837e80bb79968b44dc59960dadcb934261f329ce1ac' \
            -e EXPECTED_CHOICE_SET_REPORT_SHA256='b2953bc63baff315cc66d4bdfb0ca8655e5fef0a99fc6916c782821f8c31e664' \
            -v '$storage/$sample_name:/app/apps/api/storage/$sample_name:ro' \
            -v '$storage/$v3_name:/app/apps/api/storage/$v3_name:ro' \
            -v '$storage/$gate_name:/app/apps/api/storage/$gate_name:ro' \
            -v '$storage/$output_name:/app/apps/api/storage/$output_name:rw' \
            "\$image" node /app/scripts/run-recommendation-behavioral-v6-grouped-boosted-listwise-screen.mjs \
            > "\$output/container.log" 2>&1
          exit_code=\$?
          sudo docker inspect "\$container" > "\$output/container-inspect.json" 2>/dev/null || true
          oom_killed="\$(sudo docker inspect -f '{{.State.OOMKilled}}' "\$container" 2>/dev/null || echo unknown)"
          finished_at="\$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          state='FAILED'
          if [ "\$exit_code" -eq 0 ] && [ -s "\$output/screen-summary.json" ]; then state='SUCCEEDED'; fi
          cat > "\$output/background-status.json" <<JSON
          {
            "schemaVersion": 2,
            "state": "\$state",
            "startedAt": "\$started_at",
            "finishedAt": "\$finished_at",
            "unit": "$unit",
            "container": "\$container",
            "image": "\$image",
            "executorVersion": "MERGED_TOP_96_GROUPED_BOOSTED_LISTWISE_SCREEN_1",
            "exitCode": \$exit_code,
            "oomKilled": "\$oom_killed",
            "trainingTimeLimit": "NONE",
            "backgroundTraining": true
          }
          JSON
          sudo docker rm "\$container" >/dev/null 2>&1 || true
          sudo docker image rm "\$image" >/dev/null 2>&1 || true
          sudo rm -f "\$launcher"
          exit "\$exit_code"
          EOF
          sudo install -m 0755 "$RUNNER_TEMP/boosted-screen-v2-launcher.sh" "$launcher"
          rm -f "$RUNNER_TEMP/boosted-screen-v2-launcher.sh"

          cat > "$RUNNER_TEMP/background-launch.json" <<JSON
          {
            "schemaVersion": 2,
            "launcherRunId": "$GITHUB_RUN_ID",
            "unit": "$unit",
            "outputDirectory": "$output_name",
            "image": "$image",
            "executorVersion": "MERGED_TOP_96_GROUPED_BOOSTED_LISTWISE_SCREEN_1",
            "backgroundTraining": true,
            "trainingTimeLimit": "NONE"
          }
          JSON
          sudo install -m 0644 "$RUNNER_TEMP/background-launch.json" "$output/background-launch.json"
          rm -f "$RUNNER_TEMP/background-launch.json"
          sudo systemd-run --collect \
            --unit="$unit" \
            --description="Deadlock Behavioral V6 grouped boosted listwise screen V2 $GITHUB_RUN_ID" \
            --property=Restart=no \
            "$launcher"

      - name: Confirm detached background screen
        shell: bash
        run: |
          set -euo pipefail
          output='${{ steps.preflight.outputs.output }}'
          unit="deadlock-behavioral-v6-boosted-screen-v2-$GITHUB_RUN_ID"
          container="deadlock-behavioral-v6-boosted-screen-v2-$GITHUB_RUN_ID"
          for attempt in $(seq 1 30); do
            if sudo test -s "$output/background-status.json" && \
               sudo jq -e '.state == "RUNNING" and .trainingTimeLimit == "NONE" and .backgroundTraining == true' "$output/background-status.json" >/dev/null && \
               sudo systemctl is-active --quiet "$unit" && \
               sudo docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null | grep -qx true; then
              sudo cat "$output/background-status.json"
              exit 0
            fi
            sleep 2
          done
          sudo cat "$output/background-status.json" 2>/dev/null || true
          sudo systemctl status "$unit" --no-pager || true
          sudo docker logs "$container" 2>&1 | tail -n 100 || true
          exit 1

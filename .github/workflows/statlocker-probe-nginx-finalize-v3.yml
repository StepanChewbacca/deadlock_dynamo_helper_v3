name: Statlocker Probe Nginx Finalize V3

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-probe-nginx-finalize-v3.yml'

permissions:
  contents: read

jobs:
  configure-nginx:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Install and verify probe route
        shell: bash
        run: |
          set -Eeuo pipefail

          container='deadlock-statlocker-probe'
          domain='aboba-telegramovich.duckdns.org'
          nginx_file='/etc/nginx/sites-available/aboba-telegramovich.duckdns.org'
          base_url="https://${domain}/deadlock/tools/statlocker"

          [ "$(sudo docker inspect -f '{{.State.Running}}' "$container")" = 'true' ]
          binding="$(sudo docker port "$container" 3000/tcp | head -n 1)"
          host_port="${binding##*:}"
          [[ "$host_port" =~ ^[0-9]+$ ]]

          curl --fail --silent --show-error \
            "http://127.0.0.1:${host_port}/deadlock/tools/statlocker/presets" \
            -o "$RUNNER_TEMP/direct-presets.json"

          backup="$RUNNER_TEMP/nginx-site.backup"
          sudo cp "$nginx_file" "$backup"

          rollback() {
            echo 'Rolling back Nginx route' >&2
            sudo cp "$backup" "$nginx_file" || true
            sudo nginx -t || true
            sudo systemctl reload nginx || true
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then rollback; fi; exit "$status"' EXIT

          sudo cat "$nginx_file" \
            | sed '/# BEGIN STATLOCKER_PROBE_POC/,/# END STATLOCKER_PROBE_POC/d' \
            > "$RUNNER_TEMP/nginx-site.clean"

          cat > "$RUNNER_TEMP/statlocker-location.conf" <<EOF
              # BEGIN STATLOCKER_PROBE_POC
              location ^~ /deadlock/tools/statlocker {
                  proxy_pass http://127.0.0.1:${host_port};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 30s;
                  proxy_send_timeout 30s;
              }
              # END STATLOCKER_PROBE_POC
          EOF

          awk -v snippet="$RUNNER_TEMP/statlocker-location.conf" '
            !inserted && $0 ~ /^[[:space:]]*location \^~ \/deadlock\/ \{/ {
              while ((getline line < snippet) > 0) print line
              close(snippet)
              inserted=1
            }
            { print }
            END { if (!inserted) exit 42 }
          ' "$RUNNER_TEMP/nginx-site.clean" > "$RUNNER_TEMP/nginx-site.new"

          sudo cp "$RUNNER_TEMP/nginx-site.new" "$nginx_file"
          echo '=== Installed Statlocker location ==='
          sudo grep -nA16 -B2 'BEGIN STATLOCKER_PROBE_POC' "$nginx_file"
          sudo nginx -t
          sudo systemctl reload nginx

          ok=0
          for attempt in $(seq 1 15); do
            status="$(curl -k --silent --output "$RUNNER_TEMP/ui.html" --write-out '%{http_code}' \
              --resolve "${domain}:443:127.0.0.1" \
              "$base_url" || true)"
            echo "TLS route attempt ${attempt}: HTTP ${status}"
            if [ "$status" = '200' ] && grep -q 'Statlocker' "$RUNNER_TEMP/ui.html"; then
              ok=1
              break
            fi
            sleep 1
          done
          [ "$ok" -eq 1 ]

          curl -k --fail --silent --show-error \
            --resolve "${domain}:443:127.0.0.1" \
            "$base_url/presets" \
            -o "$RUNNER_TEMP/presets.json"

          curl -k --fail --silent --show-error \
            --resolve "${domain}:443:127.0.0.1" \
            "$base_url/discover" \
            -o "$RUNNER_TEMP/discovery.json"

          node - "$RUNNER_TEMP/discovery.json" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const endpoints = Array.isArray(data.endpoints) ? data.endpoints : [];
          const useful = endpoints.filter((entry) => entry && entry.likelyUseful && !entry.rawDeadlockDuplicate);
          console.log('STATLOCKER_DISCOVERY_SUMMARY=' + JSON.stringify({
            pagesChecked: Array.isArray(data.pagesChecked) ? data.pagesChecked.length : 0,
            scriptsChecked: Array.isArray(data.scriptsChecked) ? data.scriptsChecked.length : 0,
            endpointsFound: endpoints.length,
            usefulEndpointsFound: useful.length,
            errors: Array.isArray(data.errors) ? data.errors.length : 0,
            usefulEndpoints: useful.slice(0, 40).map((entry) => ({
              path: entry.path,
              signals: entry.signals,
              sourceAsset: entry.sourceAsset,
            })),
          }));
          NODE

          trap - EXIT
          echo "STATLOCKER_PROBE_URL=$base_url"
          echo "STATLOCKER_PROBE_PORT=$host_port"

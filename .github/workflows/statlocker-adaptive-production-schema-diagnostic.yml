name: Statlocker Adaptive Production Schema Diagnostic

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-adaptive-production-schema-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-schema:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Inspect production database schema without mutations
        shell: bash
        run: |
          set -euo pipefail

          api_container="$(sudo docker ps \
            --filter 'label=com.docker.compose.service=api' \
            --format '{{.Names}}' \
            | grep -E '^deadlock-api-[0-9]+$' \
            | head -n 1 || true)"
          if [ -z "$api_container" ]; then
            api_container="$(sudo docker ps \
              --filter 'label=com.docker.compose.service=api' \
              --format '{{.Names}}' \
              | head -n 1 || true)"
          fi
          if [ -z "$api_container" ]; then
            echo 'Could not locate the production API container' >&2
            exit 1
          fi

          env_dump="$(sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$api_container")"
          db_host="$(printf '%s\n' "$env_dump" | sed -n 's/^DB_HOST=//p' | head -n 1)"
          db_port="$(printf '%s\n' "$env_dump" | sed -n 's/^DB_PORT=//p' | head -n 1)"
          db_user="$(printf '%s\n' "$env_dump" | sed -n 's/^DB_USER=//p' | head -n 1)"
          db_password="$(printf '%s\n' "$env_dump" | sed -n 's/^DB_PASSWORD=//p' | head -n 1)"
          db_name="$(printf '%s\n' "$env_dump" | sed -n 's/^DB_NAME=//p' | head -n 1)"

          : "${db_host:?DB_HOST is missing}"
          : "${db_user:?DB_USER is missing}"
          : "${db_name:?DB_NAME is missing}"
          db_port="${db_port:-5432}"

          if ! sudo docker inspect "$db_host" >/dev/null 2>&1; then
            echo "DB_HOST does not name a local Docker container: $db_host" >&2
            exit 1
          fi

          psql_cmd=(sudo docker exec -e "PGPASSWORD=$db_password" "$db_host" psql \
            -h 127.0.0.1 -p "$db_port" -U "$db_user" -d "$db_name" \
            -v ON_ERROR_STOP=1 -At -F '|')

          echo '=== connection identity ==='
          "${psql_cmd[@]}" -c "SELECT current_user, current_database();"

          echo '=== public tables ==='
          "${psql_cmd[@]}" -c \
            "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;"

          echo '=== recommendation/adaptive/catalog columns ==='
          "${psql_cmd[@]}" -c \
            "SELECT table_name, column_name, data_type, is_nullable, COALESCE(column_default, '') FROM information_schema.columns WHERE table_schema = 'public' AND (table_name LIKE 'recommendation_%' OR table_name LIKE 'statlocker_%' OR table_name LIKE 'adaptive_%' OR table_name IN ('item_catalog_versions','item_catalog_items','item_catalog_recipes','migrations')) ORDER BY table_name, ordinal_position;"

          echo '=== legacy catalog row counts ==='
          "${psql_cmd[@]}" -c \
            "SELECT 'item_catalog_versions', COUNT(*) FROM item_catalog_versions UNION ALL SELECT 'item_catalog_items', COUNT(*) FROM item_catalog_items UNION ALL SELECT 'item_catalog_recipes', COUNT(*) FROM item_catalog_recipes;"

          echo '=== executed migrations ==='
          has_migrations="$("${psql_cmd[@]}" -c "SELECT to_regclass('public.migrations') IS NOT NULL;")"
          if [ "$has_migrations" = 't' ]; then
            "${psql_cmd[@]}" -c "SELECT id, timestamp, name FROM migrations ORDER BY id;"
          else
            echo 'migrations table is absent'
          fi

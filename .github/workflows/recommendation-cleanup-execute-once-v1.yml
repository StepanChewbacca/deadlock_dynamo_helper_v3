name: Recommendation Cleanup Execute Once V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-cleanup-execute-once-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-cleanup-execute-once-v1
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read-only classify legacy bounded V8 artifact
        shell: bash
        run: |
          set -euo pipefail

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          training='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          api_container='deadlock_dynamo_helper-api-1'
          v8="$storage/recommendation-v8-bounded-5000-v1"
          report="$RUNNER_TEMP/recommendation-cleanup-execute-once-$GITHUB_RUN_ID.txt"
          exec > >(tee "$report") 2>&1

          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo test -d "$storage"
          test -f "$training/PAUSED_BY_USER"

          mounted_storage="$(sudo docker inspect "$api_container" --format '{{range .Mounts}}{{if eq .Destination "/app/apps/api/storage"}}{{.Source}}{{end}}{{end}}' 2>/dev/null || true)"
          echo "apiStorageMount=${mounted_storage:-missing}"
          test "$mounted_storage" = "$storage"

          active_containers="$(sudo docker ps --format '{{.Names}}' | grep -Ei '(training|trainer|ablation)' || true)"
          active_services="$(sudo systemctl list-units --type=service --state=running --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          active_timers="$(sudo systemctl list-units --type=timer --state=active --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          active_processes="$(ps -eo pid=,args= --width 400 | grep -E '[d]eadlock_dynamo_helper-training|[r]un-[^ ]*training|[t]rain-[^ ]*recommendation|[b]ehavioral[^ ]*ablation' | grep -Ev 'Runner\\.(Listener|Worker)|actions-runner|recommendation-cleanup-execute' || true)"
          printf 'activeTrainingContainers=%s\nactiveTrainingServices=%s\nactiveTrainingTimers=%s\nactiveTrainingProcesses=%s\n' "${active_containers:-none}" "${active_services:-none}" "${active_timers:-none}" "${active_processes:-none}"
          test -z "$active_containers"
          test -z "$active_services"
          test -z "$active_timers"
          test -z "$active_processes"

          sudo test -d "$v8"
          echo "v8BoundedBytes=$(sudo du -sb "$v8" | awk '{print $1}')"
          echo '--- files ---'
          sudo find "$v8" -maxdepth 3 -type f -printf '%s %p\n' | sort -nr

          for file in \
            "$v8/summary.json" \
            "$v8/replay-v3/manifest.json" \
            "$v8/replay-v3/audit.json" \
            "$v8/policy-v3/manifest.json" \
            "$v8/policy-v3/audit.json"; do
            echo "--- RAW $file ---"
            sudo test -s "$file"
            sudo cat "$file"
            echo
          done

          echo '--- dataset hashes ---'
          sudo sha256sum "$v8/replay-v3/dataset.ndjson" "$v8/policy-v3/dataset.ndjson"
          echo '--- metadata hashes ---'
          sudo sha256sum \
            "$v8/summary.json" \
            "$v8/replay-v3/manifest.json" \
            "$v8/replay-v3/audit.json" \
            "$v8/policy-v3/manifest.json" \
            "$v8/policy-v3/audit.json"

          echo '--- disk ---'
          df -hT /
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-cleanup-execute-once-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-cleanup-execute-once-${{ github.run_id }}.txt
          if-no-files-found: warn
          retention-days: 14

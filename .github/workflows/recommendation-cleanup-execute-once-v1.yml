name: Recommendation Cleanup Execute Once V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-cleanup-execute-once-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-cleanup-execute-once-v1
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Inventory remaining recommendation garbage candidates
        shell: bash
        run: |
          set -euo pipefail
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          training='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          report="$RUNNER_TEMP/recommendation-cleanup-execute-once-$GITHUB_RUN_ID.txt"
          exec > >(tee "$report") 2>&1

          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo '--- filesystem ---'
          df -hT /
          echo "availableBytes=$(df --output=avail -B1 / | tail -1 | tr -d ' ')"

          active_containers="$(sudo docker ps --format '{{.Names}}' | grep -Ei '(training|trainer|ablation)' || true)"
          active_services="$(sudo systemctl list-units --type=service --state=running --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          active_timers="$(sudo systemctl list-units --type=timer --state=active --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          active_processes="$(ps -eo pid=,args= --width 400 | grep -E '[d]eadlock_dynamo_helper-training|[r]un-[^ ]*training|[t]rain-[^ ]*recommendation|[b]ehavioral[^ ]*ablation' | grep -Ev 'Runner\\.(Listener|Worker)|actions-runner|recommendation-cleanup-execute' || true)"
          printf 'activeTrainingContainers=%s\nactiveTrainingServices=%s\nactiveTrainingTimers=%s\nactiveTrainingProcesses=%s\n' "${active_containers:-none}" "${active_services:-none}" "${active_timers:-none}" "${active_processes:-none}"
          test -z "$active_containers"
          test -z "$active_services"
          test -z "$active_timers"
          test -z "$active_processes"

          echo '--- docker usage ---'
          sudo docker system df || true
          echo '--- training workspace ---'
          sudo du -xhd1 "$training" 2>/dev/null | sort -h || true
          echo '--- storage top level ---'
          sudo du -xhd1 "$storage" 2>/dev/null | sort -h | tail -n 120 || true

          echo '--- top-level metadata inventory ---'
          while IFS= read -r -d '' dir; do
            name="$(basename "$dir")"
            bytes="$(sudo du -sb "$dir" 2>/dev/null | awk '{print $1}')"; bytes="${bytes:-0}"
            mtime="$(sudo stat -c '%y' "$dir" 2>/dev/null | cut -d. -f1 || true)"
            manifest="$dir/manifest.json"
            status_file="$dir/status.json"
            state=''
            phase=''
            conclusion=''
            eligible=''
            release=''
            audit=''
            full=''
            if sudo test -f "$manifest"; then
              state="$(sudo jq -r '.state // .status // empty' "$manifest" 2>/dev/null || true)"
              phase="$(sudo jq -r '.phase // empty' "$manifest" 2>/dev/null || true)"
              conclusion="$(sudo jq -r '.conclusion // empty' "$manifest" 2>/dev/null || true)"
              eligible="$(sudo jq -r '.trainingArtifactEligible // .diagnosticArtifactEligible // empty' "$manifest" 2>/dev/null || true)"
              release="$(sudo jq -r '.releaseGatePassed // .diagnosticGatePassed // empty' "$manifest" 2>/dev/null || true)"
              audit="$(sudo jq -r '.auditPassed // (.audit.passed // empty)' "$manifest" 2>/dev/null || true)"
              full="$(sudo jq -r '.build.fullCorpus // empty' "$manifest" 2>/dev/null || true)"
            elif sudo test -f "$status_file"; then
              state="$(sudo jq -r '.state // .status // empty' "$status_file" 2>/dev/null || true)"
              phase="$(sudo jq -r '.phase // empty' "$status_file" 2>/dev/null || true)"
              conclusion="$(sudo jq -r '.conclusion // empty' "$status_file" 2>/dev/null || true)"
            fi
            printf 'DIR name=%q bytes=%s mtime=%q state=%q phase=%q conclusion=%q eligible=%q release=%q audit=%q fullCorpus=%q\n' "$name" "$bytes" "$mtime" "$state" "$phase" "$conclusion" "$eligible" "$release" "$audit" "$full"
          done < <(sudo find "$storage" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)

          echo '--- explicit failure markers, max depth 4 ---'
          sudo find "$storage" -mindepth 1 -maxdepth 4 \( -type d \( -iname '*.failed' -o -iname '*-failed' -o -iname '*.partial' -o -iname '*-partial' -o -iname 'tmp-*' \) -o -type f \( -name status.json -o -name manifest.json -o -name result.json -o -name summary.json \) \) -print 2>/dev/null | head -n 4000 || true
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-cleanup-execute-once-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-cleanup-execute-once-${{ github.run_id }}.txt
          if-no-files-found: warn
          retention-days: 14

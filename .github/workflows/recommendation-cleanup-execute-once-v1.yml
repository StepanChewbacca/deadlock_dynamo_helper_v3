name: Recommendation Cleanup Execute Once V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-cleanup-execute-once-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-cleanup-execute-once-v1
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Archive failed V5 baseline evidence and delete heavy artifact
        shell: bash
        run: |
          set -euo pipefail

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          training='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          api_container='deadlock_dynamo_helper-api-1'
          source="$storage/recommendation-behavioral-v5-terminal-5000-v2"
          freeze="$storage/recommendation-behavioral-v5-baseline-freeze-v1"
          v8="$storage/recommendation-v8-bounded-5000-v1"
          report="$RUNNER_TEMP/recommendation-cleanup-execute-once-$GITHUB_RUN_ID.txt"
          exec > >(tee "$report") 2>&1

          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo test -d "$storage"
          test -f "$training/PAUSED_BY_USER"

          mounted_storage="$(sudo docker inspect "$api_container" --format '{{range .Mounts}}{{if eq .Destination "/app/apps/api/storage"}}{{.Source}}{{end}}{{end}}' 2>/dev/null || true)"
          echo "apiStorageMount=${mounted_storage:-missing}"
          test "$mounted_storage" = "$storage"

          active_containers="$(sudo docker ps --format '{{.Names}}' | grep -Ei '(training|trainer|ablation)' || true)"
          active_services="$(sudo systemctl list-units --type=service --state=running --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          active_timers="$(sudo systemctl list-units --type=timer --state=active --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          active_processes="$(ps -eo pid=,args= --width 400 | grep -E '[d]eadlock_dynamo_helper-training|[r]un-[^ ]*training|[t]rain-[^ ]*recommendation|[b]ehavioral[^ ]*ablation' | grep -Ev 'Runner\\.(Listener|Worker)|actions-runner|recommendation-cleanup-execute' || true)"
          printf 'activeTrainingContainers=%s\nactiveTrainingServices=%s\nactiveTrainingTimers=%s\nactiveTrainingProcesses=%s\n' "${active_containers:-none}" "${active_services:-none}" "${active_timers:-none}" "${active_processes:-none}"
          test -z "$active_containers"
          test -z "$active_services"
          test -z "$active_timers"
          test -z "$active_processes"

          before_bytes="$(df --output=avail -B1 / | tail -1 | tr -d ' ')"
          echo "availableBeforeBytes=$before_bytes"
          df -hT /

          echo '--- verify exact failed V5 baseline ---'
          sudo test -s "$source/manifest.json"
          sudo test -s "$source/evaluation.json"
          sudo test -s "$source/audit.json"
          sudo test -s "$source/model.json"
          sudo test -s "$source/propensities.ndjson"

          manifest_sha="$(sudo sha256sum "$source/manifest.json" | awk '{print $1}')"
          evaluation_sha="$(sudo sha256sum "$source/evaluation.json" | awk '{print $1}')"
          audit_sha="$(sudo sha256sum "$source/audit.json" | awk '{print $1}')"
          model_sha="$(sudo sha256sum "$source/model.json" | awk '{print $1}')"
          propensities_sha="$(sudo sha256sum "$source/propensities.ndjson" | awk '{print $1}')"
          printf 'manifestSha256=%s\nevaluationSha256=%s\nauditSha256=%s\nmodelSha256=%s\npropensitiesSha256=%s\n' "$manifest_sha" "$evaluation_sha" "$audit_sha" "$model_sha" "$propensities_sha"

          test "$manifest_sha" = '418c8cdf073705cab96b818f4f644e2f1f3dee5183ed761f4953ee6a22699fe8'
          test "$evaluation_sha" = '9e973dad0c7a0e6681b704c2a115574740362d3d71d7f534a623b5e1bc3c4fe2'
          test "$audit_sha" = '50d1a15027b56e48bc9a9dd07e517982216fe17a8182952089c9b094feb3c496'
          test "$model_sha" = 'c1dff90981e4af6bf486bd9d4df44a7f5b3a14520fdccabd4cf86eac3d5265a9'
          test "$propensities_sha" = '31e6c7369ac68c5a161d50f5ca6b9052683b876b4f37fdddac78ddabebdcab12'

          test "$(sudo jq -r '.auditPassed' "$source/manifest.json")" = 'true'
          test "$(sudo jq -r '.releaseGatePassed' "$source/manifest.json")" = 'false'
          test "$(sudo jq -r '.trainingArtifactEligible' "$source/manifest.json")" = 'false'
          test "$(sudo jq -r '.build.fullCorpus' "$source/manifest.json")" = 'true'

          echo '--- frozen gate summary ---'
          sudo jq '{auditPassed,releaseGatePassed,trainingArtifactEligible,modelVersion,featureVersion,build,releaseGate:(.releaseGate // empty)}' "$source/manifest.json" || true
          sudo jq '{releaseGate:(.releaseGate // empty),metrics:{selection:(.metrics.selection // empty),probabilityFloorSensitivity:(.metrics.probabilityFloorSensitivity // empty)}}' "$source/evaluation.json" || true

          source_bytes="$(sudo du -sb "$source" | awk '{print $1}')"
          echo "sourceBytes=$source_bytes"

          echo '--- create compact durable freeze ---'
          sudo rm -rf --one-file-system -- "$freeze.tmp"
          sudo mkdir -p "$freeze.tmp"
          sudo cp "$source/manifest.json" "$freeze.tmp/manifest.json"
          sudo cp "$source/evaluation.json" "$freeze.tmp/evaluation.json"
          sudo cp "$source/audit.json" "$freeze.tmp/audit.json"
          sudo cp "$source/model.json" "$freeze.tmp/model.json"
          {
            echo "source=recommendation-behavioral-v5-terminal-5000-v2"
            echo "sourceBytes=$source_bytes"
            echo "manifestSha256=$manifest_sha"
            echo "evaluationSha256=$evaluation_sha"
            echo "auditSha256=$audit_sha"
            echo "modelSha256=$model_sha"
            echo "propensitiesSha256=$propensities_sha"
            echo 'propensitiesPreserved=false'
            echo 'reason=releaseGatePassed_false_and_trainingArtifactEligible_false'
            echo "frozenAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | sudo tee "$freeze.tmp/FREEZE.txt" >/dev/null
          sudo rm -rf --one-file-system -- "$freeze"
          sudo mv "$freeze.tmp" "$freeze"
          freeze_bytes="$(sudo du -sb "$freeze" | awk '{print $1}')"
          echo "freezeBytes=$freeze_bytes"

          echo '--- delete heavy failed V5 artifact ---'
          sudo rm -rf --one-file-system -- "$source"
          ! sudo test -e "$source"
          sudo test -s "$freeze/manifest.json"
          sudo test -s "$freeze/model.json"

          echo '--- inspect old bounded V8 without deleting ---'
          if sudo test -d "$v8"; then
            v8_bytes="$(sudo du -sb "$v8" | awk '{print $1}')"
            echo "v8BoundedBytes=$v8_bytes"
            sudo find "$v8" -maxdepth 2 -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 40 || true
            for file in "$v8/summary.json" "$v8/replay-v3/manifest.json" "$v8/policy-v3/manifest.json"; do
              if sudo test -s "$file"; then
                echo "--- JSON $file ---"
                sudo jq '{state,status,phase,passed,auditPassed,trainingArtifactEligible,diagnosticArtifactEligible,diagnosticGatePassed,releaseGatePassed,fullTrainingRecommended,reasons,build,source,behavioral}' "$file" 2>/dev/null || sudo head -c 12000 "$file" || true
              fi
            done
          else
            echo 'v8Bounded=absent'
          fi

          sudo docker image prune -f || true
          sudo docker builder prune -f --filter 'until=24h' || true

          after_bytes="$(df --output=avail -B1 / | tail -1 | tr -d ' ')"
          increase=$((after_bytes - before_bytes))
          echo "availableAfterBytes=$after_bytes"
          echo "availableIncreaseBytes=$increase"
          df -hT /
          sudo docker system df || true
          echo '--- remaining largest storage namespaces ---'
          sudo du -xhd1 "$storage" 2>/dev/null | sort -h | tail -n 25 || true
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-cleanup-execute-once-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-cleanup-execute-once-${{ github.run_id }}.txt
          if-no-files-found: warn
          retention-days: 14

name: Recommendation Cleanup Execute Once V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-cleanup-execute-once-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-cleanup-execute-once-v1
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ false }}
    runs-on: self-hosted
    steps:
      - name: Cleanup completed and paused
        run: echo 'Recommendation disk cleanup is complete and paused.'

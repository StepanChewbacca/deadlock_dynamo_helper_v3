name: Adaptive Overwolf Cutover Helper

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - .github/workflows/adaptive-overwolf-cutover-helper.yml

permissions:
  contents: write

jobs:
  patch-overwolf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/statlocker-model-probe-poc
          fetch-depth: 0

      - name: Apply asserted adaptive cutover patch
        run: python3 .github/scripts/adaptive-overwolf-cutover.py

      - name: Commit adaptive cutover
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/overwolf-client/src/index.ts apps/overwolf-client/src/ui.ts
          git diff --cached --check
          git commit -m "feat: switch Overwolf runtime to adaptive recommendations"
          git pull --rebase origin agent/statlocker-model-probe-poc
          git push origin HEAD:agent/statlocker-model-probe-poc

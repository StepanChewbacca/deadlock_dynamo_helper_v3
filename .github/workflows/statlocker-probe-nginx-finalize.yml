name: Statlocker Probe Nginx Finalize

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-probe-nginx-finalize.yml'

permissions:
  contents: read

concurrency:
  group: statlocker-probe-nginx-finalize
  cancel-in-progress: false

jobs:
  configure-nginx:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Configure and verify Statlocker probe route
        shell: bash
        run: |
          set -Eeuo pipefail

          container='deadlock-statlocker-probe'
          domain='aboba-telegramovich.duckdns.org'
          nginx_file='/etc/nginx/sites-available/aboba-telegramovich.duckdns.org'

          running="$(sudo docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)"
          if [ "$running" != 'true' ]; then
            echo "Probe container is not running" >&2
            exit 1
          fi

          binding="$(sudo docker port "$container" 3000/tcp | head -n 1)"
          host_port="${binding##*:}"
          if ! [[ "$host_port" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve probe host port from: $binding" >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            "http://127.0.0.1:${host_port}/deadlock/tools/statlocker/presets" \
            -o "$RUNNER_TEMP/presets-direct.json"

          test -f "$nginx_file"
          backup="$RUNNER_TEMP/nginx-site.backup"
          sudo cp "$nginx_file" "$backup"

          rollback() {
            echo 'Rolling back Nginx route' >&2
            sudo cp "$backup" "$nginx_file" || true
            sudo nginx -t || true
            sudo systemctl reload nginx || true
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then rollback; fi; exit "$status"' EXIT

          sudo cat "$nginx_file" > "$RUNNER_TEMP/nginx-site.input"
          export NGINX_INPUT="$RUNNER_TEMP/nginx-site.input"
          export NGINX_OUTPUT="$RUNNER_TEMP/nginx-site.output"
          export STATLOCKER_PROBE_PORT="$host_port"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source_path = Path(os.environ['NGINX_INPUT'])
          output_path = Path(os.environ['NGINX_OUTPUT'])
          probe_port = os.environ['STATLOCKER_PROBE_PORT']
          text = source_path.read_text(encoding='utf-8')

          text = re.sub(
              r'\n?\s*# BEGIN STATLOCKER_PROBE_POC\n.*?# END STATLOCKER_PROBE_POC\n?',
              '\n',
              text,
              flags=re.S,
          )

          proxy_re = re.compile(r'proxy_pass\s+http://(?:127\.0\.0\.1|localhost):3000\b')
          server_re = re.compile(r'\bserver\s*\{')

          def matching_brace(data: str, open_index: int) -> int:
              depth = 0
              quote = None
              escaped = False
              comment = False
              for index in range(open_index, len(data)):
                  char = data[index]
                  if comment:
                      if char == '\n':
                          comment = False
                      continue
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char == '#':
                      comment = True
                      continue
                  if char in ('"', "'"):
                      quote = char
                      continue
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return index
              raise RuntimeError('Unbalanced Nginx server block')

          spans = []
          for match in server_re.finditer(text):
              open_index = text.find('{', match.start())
              close_index = matching_brace(text, open_index)
              block = text[match.start():close_index + 1]
              if proxy_re.search(block):
                  spans.append(close_index)

          if not spans:
              raise SystemExit('No server block with production :3000 proxy found')

          snippet = f'''\n    # BEGIN STATLOCKER_PROBE_POC\n    location ^~ /deadlock/tools/statlocker {{\n        proxy_pass http://127.0.0.1:{probe_port};\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 30s;\n        proxy_send_timeout 30s;\n    }}\n    # END STATLOCKER_PROBE_POC\n'''

          for close_index in reversed(spans):
              text = text[:close_index] + snippet + text[close_index:]

          output_path.write_text(text, encoding='utf-8')
          PY

          sudo cp "$RUNNER_TEMP/nginx-site.output" "$nginx_file"
          sudo nginx -t
          sudo systemctl reload nginx

          base_url="https://${domain}/deadlock/tools/statlocker"
          curl -k --fail --silent --show-error \
            --resolve "${domain}:443:127.0.0.1" \
            "$base_url" \
            -o "$RUNNER_TEMP/probe-ui.html"
          grep -q 'Statlocker' "$RUNNER_TEMP/probe-ui.html"

          curl -k --fail --silent --show-error \
            --resolve "${domain}:443:127.0.0.1" \
            "$base_url/presets" \
            -o "$RUNNER_TEMP/presets-nginx.json"

          curl -k --fail --silent --show-error \
            --resolve "${domain}:443:127.0.0.1" \
            "$base_url/discover" \
            -o "$RUNNER_TEMP/discovery.json"

          node - "$RUNNER_TEMP/discovery.json" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const endpoints = Array.isArray(data.endpoints) ? data.endpoints : [];
          const useful = endpoints.filter((entry) => entry?.likelyUseful && !entry?.rawDeadlockDuplicate);
          console.log(JSON.stringify({
            pagesChecked: Array.isArray(data.pagesChecked) ? data.pagesChecked.length : 0,
            scriptsChecked: Array.isArray(data.scriptsChecked) ? data.scriptsChecked.length : 0,
            endpointsFound: endpoints.length,
            usefulEndpointsFound: useful.length,
            errors: Array.isArray(data.errors) ? data.errors.length : 0,
            usefulEndpoints: useful.slice(0, 40).map((entry) => ({
              path: entry.path,
              signals: entry.signals,
              sourceAsset: entry.sourceAsset,
            })),
          }, null, 2));
          NODE

          trap - EXIT
          echo "STATLOCKER_PROBE_URL=$base_url"
          echo "STATLOCKER_PROBE_PORT=$host_port"

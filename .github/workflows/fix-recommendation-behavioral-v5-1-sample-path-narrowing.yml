name: Fix Behavioral V5.1 Sample Path Narrowing

on:
  pull_request:
    paths:
      - 'scripts/fix-recommendation-behavioral-v5-1-sample-path-narrowing.py'
      - '.github/workflows/fix-recommendation-behavioral-v5-1-sample-path-narrowing.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python3 scripts/fix-recommendation-behavioral-v5-1-sample-path-narrowing.py
      - run: |
          set -euo pipefail
          git diff --check
          grep -q 'sampleWriter && diagnosticSamplePath' apps/api/src/deadlock-live/recommendation-behavioral-v5-training.service.ts
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/deadlock-live/recommendation-behavioral-v5-training.service.ts
          git commit -m 'fix: narrow Behavioral diagnostic sample path'
          git push origin HEAD:${GITHUB_HEAD_REF}

name: Recommendation Behavioral V5.2 Refinement V2 Budgeted

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-behavioral-v5-2-refinement-v2.json'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v5-2-refinement-v2
  cancel-in-progress: true

jobs:
  refinement-v2:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout requested implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate authorization, lineage, and budget
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-behavioral-v5-2-refinement-v2.json'
          test -s "$request"
          jq -e '
            .schemaVersion == 2 and
            .operation == "RECOMMENDATION_BEHAVIORAL_V5_2_BOUNDED_REFINEMENT" and
            .executorVersion == "CANDIDATE_COVERAGE_FIXED_2" and
            .boundedRefinementAuthorized == true and
            .maximumTrainingMinutes == 20 and
            .fullTrainingAuthorized == false and
            .valueV8TrainingAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowAuthorized == false and
            .randomizedCanaryAuthorized == false and
            .datasetDirectory == "recommendation-pro-decision-dataset-v6-terminal-5000-v2" and
            .sampleDirectory == "recommendation-behavioral-v5-1-sweep-b-v1" and
            .outputDirectory == "recommendation-behavioral-v5-2-refinement-v2" and
            (.variants | length) == 3 and
            .common.foldCount == 5 and
            .common.l2 == 0.0001 and
            .common.supportProbability == 0.01 and
            .common.majorGroupMinDecisions == 100
          ' "$request"
          node --check scripts/run-recommendation-behavioral-v5-2-refinement.mjs
          node --check scripts/normalize-recommendation-behavioral-v5-2-refinement-v2.mjs

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          dataset_name="$(jq -r '.datasetDirectory' "$request")"
          sample_name="$(jq -r '.sampleDirectory' "$request")"
          source_sweep_name="$(jq -r '.sourceSweepDirectory' "$request")"
          output_name="$(jq -r '.outputDirectory' "$request")"
          dataset="$storage/$dataset_name"
          sample="$storage/$sample_name/diagnostic-sample.ndjson.gz"
          source_summary="$storage/$source_sweep_name/sweep-summary.json"
          output="$storage/$output_name"
          dataset_sha="$(jq -r '.expectedDatasetSha256' "$request")"
          sample_sha="$(jq -r '.expectedDiagnosticSampleSha256' "$request")"
          source_summary_sha="$(jq -r '.expectedSourceSweepSummarySha256' "$request")"
          [[ "$dataset_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$sample_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$source_summary_sha" =~ ^[a-f0-9]{64}$ ]]

          sudo test -s "$dataset/manifest.json"
          sudo test -s "$dataset/audit.json"
          sudo test -s "$sample"
          sudo test -s "$source_summary"
          test "$(sudo sha256sum "$dataset/$(sudo jq -r '.artifact.fileName' "$dataset/manifest.json")" | awk '{print $1}')" = "$dataset_sha"
          test "$(sudo sha256sum "$sample" | awk '{print $1}')" = "$sample_sha"
          test "$(sudo sha256sum "$source_summary" | awk '{print $1}')" = "$source_summary_sha"
          sudo jq -e '
            .schemaVersion == 2 and
            .executorVersion == "ELIGIBILITY_FILTERED_2" and
            .architectureContinuationRecommended == true and
            .source.futureTestRowCount == 0 and
            .boundedRefinementAuthorized == false and
            .fullTrainingAuthorized == false and
            .valueV8TrainingAuthorized == false
          ' "$source_summary"
          sudo jq -e '.auditPassed == true and .trainingArtifactEligible == true' "$dataset/manifest.json"
          sudo jq -e '.passed == true and .trainingArtifactEligible == true' "$dataset/audit.json"

          if sudo test -e "$output"; then
            echo "Refusing destructive reuse of existing output: $output" >&2
            exit 1
          fi
          sudo mkdir "$output"
          evidence_dir="$RUNNER_TEMP/recommendation-behavioral-v5-2-refinement-v2-$GITHUB_RUN_ID"
          mkdir -p "$evidence_dir"
          {
            echo "storage=$storage"
            echo "dataset_name=$dataset_name"
            echo "sample_name=$sample_name"
            echo "source_sweep_name=$source_sweep_name"
            echo "output_name=$output_name"
            echo "dataset_sha=$dataset_sha"
            echo "sample_sha=$sample_sha"
            echo "source_summary_sha=$source_summary_sha"
            echo "evidence_dir=$evidence_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Build isolated Behavioral V5.2 image
        shell: bash
        run: |
          set -euo pipefail
          sudo docker build \
            --label deadlock.recommendation.operation=behavioral-v5-2-refinement-v2 \
            --label deadlock.recommendation.git-sha="$GITHUB_SHA" \
            -t "deadlock-behavioral-v5-2-refinement-v2:$GITHUB_RUN_ID" .

      - name: Run corrected refinement with hard 20-minute budget
        id: training
        shell: bash
        run: |
          set -uo pipefail
          storage='${{ steps.preflight.outputs.storage }}'
          dataset_name='${{ steps.preflight.outputs.dataset_name }}'
          sample_name='${{ steps.preflight.outputs.sample_name }}'
          source_sweep_name='${{ steps.preflight.outputs.source_sweep_name }}'
          output_name='${{ steps.preflight.outputs.output_name }}'
          evidence_dir='${{ steps.preflight.outputs.evidence_dir }}'
          image="deadlock-behavioral-v5-2-refinement-v2:$GITHUB_RUN_ID"
          container_name="deadlock-behavioral-v5-2-refinement-v2-$GITHUB_RUN_ID"

          set +e
          timeout --signal=TERM --kill-after=60s 20m sudo docker run --rm \
            --name "$container_name" \
            --stop-timeout 15 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -e NODE_OPTIONS=--max-old-space-size=6144 \
            -e BEHAVIORAL_V5_2_REFINEMENT_REQUEST_PATH='/app/.github/training-requests/recommendation-behavioral-v5-2-refinement-v2.json' \
            -e DEADLOCK_RECOMMENDATION_BEHAVIORAL_V5_2_SOURCE_DIR="/app/apps/api/storage/$dataset_name" \
            -e BEHAVIORAL_V5_2_SAMPLE_PATH="/app/apps/api/storage/$sample_name/diagnostic-sample.ndjson.gz" \
            -e BEHAVIORAL_V5_2_SOURCE_SWEEP_SUMMARY_PATH="/app/apps/api/storage/$source_sweep_name/sweep-summary.json" \
            -e BEHAVIORAL_V5_2_REFINEMENT_OUTPUT_DIR="/app/apps/api/storage/$output_name" \
            -e EXPECTED_DATASET_SHA256='${{ steps.preflight.outputs.dataset_sha }}' \
            -e EXPECTED_DIAGNOSTIC_SAMPLE_SHA256='${{ steps.preflight.outputs.sample_sha }}' \
            -e EXPECTED_SOURCE_SWEEP_SUMMARY_SHA256='${{ steps.preflight.outputs.source_summary_sha }}' \
            -v "$storage/$dataset_name:/app/apps/api/storage/$dataset_name:ro" \
            -v "$storage/$sample_name:/app/apps/api/storage/$sample_name:ro" \
            -v "$storage/$source_sweep_name:/app/apps/api/storage/$source_sweep_name:ro" \
            -v "$storage/$output_name:/app/apps/api/storage/$output_name:rw" \
            "$image" sh -lc \
            'node /app/scripts/run-recommendation-behavioral-v5-2-refinement.mjs && node /app/scripts/normalize-recommendation-behavioral-v5-2-refinement-v2.mjs' \
            2>&1 | tee "$evidence_dir/container.log"
          training_exit="${PIPESTATUS[0]}"
          set -e
          if [ "$training_exit" = '124' ] || [ "$training_exit" = '137' ]; then
            sudo docker stop --time 15 "$container_name" >/dev/null 2>&1 || true
            sudo docker rm -f "$container_name" >/dev/null 2>&1 || true
          fi
          echo "exit_code=$training_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify corrected refinement evidence
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.training.outputs.exit_code }}' = '0'
          output='${{ steps.preflight.outputs.storage }}/${{ steps.preflight.outputs.output_name }}'
          evidence_dir='${{ steps.preflight.outputs.evidence_dir }}'
          sudo test -s "$output/refinement-summary.json"
          sudo jq -e '
            .schemaVersion == 1 and
            .executorVersion == "CANDIDATE_COVERAGE_FIXED_2" and
            .source.futureTestRowCount == 0 and
            .refinementContract.candidateCoverageSource == "PINNED_SAMPLE_SOURCE_SWEEP" and
            (.results | length) == 3 and
            ([.results[] | .trainingArtifactEligible == false] | all) and
            .fullTrainingAuthorized == false and
            .valueV8TrainingAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowAuthorized == false and
            .randomizedCanaryAuthorized == false
          ' "$output/refinement-summary.json"
          sudo cp "$output/refinement-summary.json" "$evidence_dir/"
          sudo cp "$output/refinement-report.txt" "$evidence_dir/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$evidence_dir"

      - name: Upload corrected refinement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-behavioral-v5-2-refinement-v2-${{ github.run_id }}
          path: ${{ steps.preflight.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup transient container and image
        if: always()
        shell: bash
        run: |
          sudo docker rm -f "deadlock-behavioral-v5-2-refinement-v2-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          sudo docker image rm "deadlock-behavioral-v5-2-refinement-v2:$GITHUB_RUN_ID" >/dev/null 2>&1 || true

name: Statlocker Model Endpoint Hunt

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-model-endpoint-hunt.yml'

permissions:
  contents: read

jobs:
  inspect-public-assets:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Inspect model page lazy chunks for API calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import re
          import urllib.request

          BASE = 'https://statlocker.gg'
          MAIN = BASE + '/static/js/main.e4ee8cb5.js'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': '*/*',
          }

          def fetch(url, max_bytes=20_000_000):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as res:
                  data = res.read(max_bytes)
                  return data.decode(res.headers.get_content_charset() or 'utf-8', errors='replace')

          source = html.unescape(fetch(MAIN).replace('\\/', '/').replace('\\u0026', '&'))

          chunk_hashes = {}
          runtime = re.search(r'''n\.u=e=>"static/js/"\+e\+"\."\+\{([^}]+)\}\[e\]\+"\.chunk\.js"''', source)
          if not runtime:
              raise SystemExit('Could not parse webpack JS chunk map')
          for chunk_id, digest in re.findall(r'''(\d+):"([0-9a-f]+)"''', runtime.group(1)):
              chunk_hashes[int(chunk_id)] = digest
          print('JS_CHUNK_MAP_SIZE=', len(chunk_hashes))

          targets = {
              'ITEM_META_MODEL': 'Xn=',
              'WIN_CHANCE_MODEL': 'Jn=',
              'BUILDS_ROUTE': 'wn=',
          }

          selected_ids = set()
          for label, token in targets.items():
              idx = source.find(token)
              print(f'=== {label} ASSIGNMENT ===')
              if idx < 0:
                  print('NOT_FOUND', token)
                  continue
              segment = source[idx:idx + 5000]
              stop = segment.find('))),')
              if stop > 0:
                  segment = segment[:stop + 4]
              print(segment[:5000])
              ids = [int(value) for value in re.findall(r'''n\.e\((\d+)\)''', segment)]
              module_ids = re.findall(r'''n\.bind\(n,(\d+)\)''', segment)
              print('CHUNK_IDS=', ids)
              print('MODULE_IDS=', module_ids)
              selected_ids.update(ids)

          print('=== FETCH SELECTED CHUNKS ===')
          sources = {}
          for chunk_id in sorted(selected_ids):
              digest = chunk_hashes.get(chunk_id)
              if not digest:
                  print('MISSING_HASH', chunk_id)
                  continue
              url = f'{BASE}/static/js/{chunk_id}.{digest}.chunk.js'
              try:
                  text = html.unescape(fetch(url).replace('\\/', '/').replace('\\u0026', '&'))
                  sources[url] = text
                  print('FETCHED', url, 'bytes=', len(text))
              except Exception as exc:
                  print('ERROR', url, exc)

          endpoint_re = re.compile(r'''/api/[A-Za-z0-9_./?=&:$%+\-{}\[\]]{1,500}''')
          keywords = ['wpa','win chance','win-chance','win probability','win_probability','win-probability','prediction','predict','model','purchase','timing','comeback','win-more','chain','synergy','eternus','recommend','meta','graph']
          endpoints = {}

          print('=== API AND NETWORK CONTEXTS ===')
          for url, text in sources.items():
              lower = text.lower()
              for match in endpoint_re.finditer(text):
                  path = match.group(0).rstrip('),;\"\'`')
                  context = re.sub(r'\s+', ' ', text[max(0, match.start()-700):min(len(text), match.end()+1200)])
                  signals = sorted({k for k in keywords if k in context.lower() or k in path.lower()})
                  endpoints.setdefault(path, {'sources': set(), 'signals': set(), 'contexts': []})
                  endpoints[path]['sources'].add(url)
                  endpoints[path]['signals'].update(signals)
                  if len(endpoints[path]['contexts']) < 2:
                      endpoints[path]['contexts'].append(context[:1900])

              for keyword in keywords:
                  pos = 0
                  shown = 0
                  while shown < 12:
                      idx = lower.find(keyword, pos)
                      if idx < 0:
                          break
                      context = re.sub(r'\s+', ' ', text[max(0, idx-900):min(len(text), idx+1900)])
                      if any(token in context for token in ['/api/', 'fetch(', 'axios', '.get(', '.post(', 'graphql', 'trpc']):
                          print('NETWORK_CONTEXT', keyword, url)
                          print(context[:2800])
                          shown += 1
                      pos = idx + len(keyword)

          print('=== ENDPOINTS ===')
          ranked = sorted(endpoints.items(), key=lambda item: (-len(item[1]['signals']), item[0]))
          for path, info in ranked:
              print('ENDPOINT', path)
              print('  SIGNALS', ','.join(sorted(info['signals'])) or '-')
              print('  SOURCES', ','.join(sorted(info['sources'])))
              for context in info['contexts']:
                  print('  CONTEXT', context)

          print('SUMMARY selectedChunks=', len(selected_ids), 'fetchedChunks=', len(sources), 'endpoints=', len(endpoints))
          PY

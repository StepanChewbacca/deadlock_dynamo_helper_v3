name: Statlocker Model Endpoint Hunt

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-model-endpoint-hunt.yml'

permissions:
  contents: read

jobs:
  inspect-public-assets:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Find exact model endpoint candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import re
          import urllib.request

          BASE = 'https://statlocker.gg'
          MAIN = BASE + '/static/js/main.e4ee8cb5.js'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': '*/*',
          }

          def fetch(url, max_bytes=20_000_000):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as res:
                  return res.read(max_bytes).decode(
                      res.headers.get_content_charset() or 'utf-8', errors='replace'
                  )

          def normalize(text):
              return html.unescape(text.replace('\\/', '/').replace('\\u0026', '&'))

          source = normalize(fetch(MAIN))
          runtime = re.search(
              r'''n\.u=e=>"static/js/"\+e\+"\."\+\{([^}]+)\}\[e\]\+"\.chunk\.js"''',
              source,
          )
          if not runtime:
              raise SystemExit('ERROR webpack chunk map not found')

          hashes = {
              int(chunk_id): digest
              for chunk_id, digest in re.findall(r'''(\d+):"([0-9a-f]+)"''', runtime.group(1))
          }

          target_tokens = {
              'ITEM_META_MODEL': 'Xn=',
              'WIN_CHANCE_MODEL': 'Jn=',
          }

          target_chunks = {}
          all_chunks = set()
          for target, token in target_tokens.items():
              idx = source.find(token)
              if idx < 0:
                  print(f'TARGET {target} NOT_FOUND')
                  continue
              segment = source[idx:idx + 1800]
              ids = []
              for value in re.findall(r'''n\.e\((\d+)\)''', segment):
                  chunk_id = int(value)
                  if chunk_id not in ids:
                      ids.append(chunk_id)
              target_chunks[target] = ids
              all_chunks.update(ids)
              print(f'TARGET {target} CHUNKS={",".join(map(str, ids)) or "NONE"}')

          endpoint_re = re.compile(r'''/api/[A-Za-z0-9_./?=&:$%+\-{}\[\]]{1,420}''')
          signal_words = [
              'wpa', 'win chance', 'win-chance', 'win probability', 'win_probability',
              'prediction', 'predict', 'model', 'purchase', 'timing', 'comeback',
              'win-more', 'chain', 'synergy', 'meta', 'graph', 'recommend',
          ]

          for chunk_id in sorted(all_chunks):
              digest = hashes.get(chunk_id)
              if not digest:
                  print(f'CHUNK {chunk_id} HASH_MISSING')
                  continue
              url = f'{BASE}/static/js/{chunk_id}.{digest}.chunk.js'
              try:
                  text = normalize(fetch(url))
              except Exception as exc:
                  print(f'CHUNK {chunk_id} FETCH_ERROR={type(exc).__name__}')
                  continue

              owners = [target for target, ids in target_chunks.items() if chunk_id in ids]
              print(f'CHUNK {chunk_id} OWNERS={",".join(owners)} BYTES={len(text)} URL={url}')

              seen = set()
              for match in endpoint_re.finditer(text):
                  path = match.group(0).rstrip('),;\"\'`')
                  if path in seen:
                      continue
                  seen.add(path)
                  start = max(0, match.start() - 220)
                  end = min(len(text), match.end() + 320)
                  context = re.sub(r'\s+', ' ', text[start:end])
                  signals = sorted({word for word in signal_words if word in context.lower() or word in path.lower()})
                  method = 'POST' if re.search(r'''(?:method\s*:\s*["']POST["']|\.post\s*\()''', context, re.I) else ('GET' if re.search(r'''(?:method\s*:\s*["']GET["']|\.get\s*\()''', context, re.I) else '?')
                  print(f'ENDPOINT chunk={chunk_id} method={method} path={path} signals={"|".join(signals) or "-"}')
                  print('CTX ' + context[:520])

              # Network contexts can reveal dynamically concatenated API paths not caught above.
              compact = text.lower()
              emitted = 0
              for needle in ['fetch(', 'axios', '.post(', '.get(']:
                  pos = 0
                  while emitted < 20:
                      idx = compact.find(needle, pos)
                      if idx < 0:
                          break
                      context = re.sub(r'\s+', ' ', text[max(0, idx-220):min(len(text), idx+520)])
                      if any(word in context.lower() for word in signal_words):
                          print(f'NETWORK chunk={chunk_id} needle={needle} ctx={context[:650]}')
                          emitted += 1
                      pos = idx + len(needle)

          print(f'SUMMARY targets={len(target_chunks)} selected_chunks={len(all_chunks)}')
          PY

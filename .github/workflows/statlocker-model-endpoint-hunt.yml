name: Statlocker Model Endpoint Hunt

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-model-endpoint-hunt.yml'

permissions:
  contents: read

jobs:
  inspect-public-assets:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Inspect Statlocker bundle lazy chunks and model strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import re
          import urllib.request
          from urllib.parse import urljoin

          BASE = 'https://statlocker.gg'
          MAIN = BASE + '/static/js/main.e4ee8cb5.js'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': '*/*',
          }

          def fetch(url, max_bytes=20_000_000):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as res:
                  data = res.read(max_bytes)
                  return data.decode(res.headers.get_content_charset() or 'utf-8', errors='replace')

          source = fetch(MAIN)
          normalized = html.unescape(source.replace('\\/', '/').replace('\\u0026', '&'))
          lower = normalized.lower()
          print('MAIN_BYTES=', len(normalized))

          print('=== STATIC JS CONTEXTS ===')
          for token in ['static/js/', '.chunk.js', 'meta-model', '/vision/wpa', 'win-chance', 'wpa-analysis', 'eternus-builds', 'build-lab']:
              print('--- TOKEN', token, '---')
              pos = 0
              count = 0
              while count < 12:
                  idx = lower.find(token.lower(), pos)
                  if idx < 0:
                      break
                  snippet = re.sub(r'\s+', ' ', normalized[max(0, idx-900):min(len(normalized), idx+1800)])
                  print(snippet)
                  print()
                  count += 1
                  pos = idx + len(token)

          print('=== QUOTED MODEL/WPA STRINGS ===')
          string_re = re.compile(r'''["']([^"'\\]{1,240})["']''')
          strings = set()
          for match in string_re.finditer(normalized):
              value = match.group(1)
              lv = value.lower()
              if any(k in lv for k in ['wpa', 'win-chance', 'win chance', 'meta-model', 'eternus', 'build-lab', 'prediction', 'winprob', 'model']):
                  strings.add(value)
          for value in sorted(strings, key=lambda v: (len(v), v))[:500]:
              print('STRING', value)

          print('=== HASH MAP CANDIDATES ===')
          # CRA/webpack runtime commonly contains numeric chunk-id -> content-hash maps.
          for match in re.finditer(r'''\{(?:\d+:?["'][0-9a-f]{6,32}["'],?){3,}\}''', normalized):
              print(match.group(0)[:12000])

          print('=== CHUNK URL CANDIDATES ===')
          urls = set()
          for match in re.finditer(r'''(?:static/js/)?([0-9]{1,6})\.([0-9a-f]{6,32})\.chunk\.js''', normalized):
              urls.add(urljoin(BASE + '/', 'static/js/' + match.group(1) + '.' + match.group(2) + '.chunk.js'))
          print('LITERAL_CHUNKS=', len(urls))
          for url in sorted(urls):
              print('CHUNK', url)

          print('=== POSSIBLE CHUNK HASH PAIRS ===')
          pairs = set()
          for match in re.finditer(r'''(?:^|[,\{])(\d{1,6}):["']([0-9a-f]{6,32})["']''', normalized):
              pairs.add((match.group(1), match.group(2)))
          print('PAIR_COUNT=', len(pairs))
          for chunk_id, digest in sorted(pairs, key=lambda p: int(p[0]))[:1000]:
              print('PAIR', chunk_id, digest)
          PY

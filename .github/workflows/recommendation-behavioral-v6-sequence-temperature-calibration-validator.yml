name: Recommendation Behavioral V6 Sequence Temperature Calibration Validator

on:
  pull_request:
    paths:
      - 'scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs'
      - '.github/workflows/recommendation-behavioral-v6-sequence-temperature-calibration-v1.yml'
      - '.github/workflows/recommendation-behavioral-v6-sequence-temperature-calibration-v2.yml'
      - '.github/workflows/recommendation-behavioral-v6-sequence-temperature-calibration-v3.yml'
      - '.github/research-requests/recommendation-behavioral-v6-sequence-temperature-calibration-v1.json'
      - '.github/research-requests/recommendation-behavioral-v6-sequence-temperature-calibration-v2.json'
      - '.github/research-requests/recommendation-behavioral-v6-sequence-temperature-calibration-v3.json'
      - '.github/workflows/recommendation-behavioral-v6-sequence-temperature-calibration-validator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate calibration contracts and read-only safety
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          grep -q 'TUNING_MATCH_SPLIT_TEMPERATURE_CALIBRATION_1' scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          grep -q 'FNV1A_32_MOD_2' scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          grep -q 'candidateProbabilityFloorApplied: false' scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          grep -q 'temperatureAppliedInsideRawSoftmax: true' scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          grep -q 'modelWeightsChanged: false' scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          grep -q 'trainingPerformed: false' scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          grep -q 'valueTrainingPerformed: false' scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          grep -q 'futureTestEvaluated: false' scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          ! grep -q 'trainRecommendationBehavioralV6SequenceDecision' scripts/evaluate-recommendation-behavioral-v6-sequence-temperature-calibration.mjs
          grep -q 'if sudo docker run' .github/workflows/recommendation-behavioral-v6-sequence-temperature-calibration-v3.yml
          grep -q 'diagnostic.log' .github/workflows/recommendation-behavioral-v6-sequence-temperature-calibration-v3.yml

          for version in 1 2 3; do
            request=".github/research-requests/recommendation-behavioral-v6-sequence-temperature-calibration-v${version}.json"
            if [ -e "$request" ]; then
              jq -e --argjson schema "$version" --arg output "recommendation-behavioral-v6-sequence-temperature-calibration-v${version}" '
                .schemaVersion == $schema and
                .operation == "RECOMMENDATION_BEHAVIORAL_V6_SEQUENCE_TEMPERATURE_CALIBRATION" and
                .executorVersion == "TUNING_MATCH_SPLIT_TEMPERATURE_CALIBRATION_1" and
                .trainingAuthorized == false and
                .valueTrainingAuthorized == false and
                .productionChangesAuthorized == false and
                .futureTestAuthorized == false and
                .choiceSetDefinition == "MERGED_TOP_96" and
                .sequenceOutputDirectory == "recommendation-behavioral-v6-sequence-neural-screen-v1-background" and
                .boostedOutputDirectory == "recommendation-behavioral-v6-grouped-boosted-listwise-screen-v2-background" and
                .v3OutputDirectory == "recommendation-behavioral-v6-equal-capacity-ablation-v3-streaming-background" and
                .outputDirectory == $output
              ' "$request"
            fi
          done

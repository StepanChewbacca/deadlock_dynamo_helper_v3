name: Statlocker Probe Nginx Diagnostic

on:
  push:
    branches:
      - agent/statlocker-model-probe-poc
    paths:
      - '.github/workflows/statlocker-probe-nginx-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'StepanChewbacca/deadlock_dynamo_helper_v2' && github.actor == 'StepanChewbacca'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect Nginx routing and probe reachability
        shell: bash
        run: |
          set -euo pipefail
          domain='aboba-telegramovich.duckdns.org'
          nginx_file='/etc/nginx/sites-available/aboba-telegramovich.duckdns.org'

          echo '=== Nginx relevant directives ==='
          sudo grep -nE '^[[:space:]]*(server[[:space:]]*\{|listen|server_name|location|proxy_pass|return|ssl_certificate)' "$nginx_file" || true

          echo '=== Listener summary ==='
          sudo ss -ltnp | grep -E ':(80|443|3000|3001|40053)[[:space:]]' || true

          echo '=== Probe container ==='
          sudo docker ps --filter name=deadlock-statlocker-probe --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          binding="$(sudo docker port deadlock-statlocker-probe 3000/tcp | head -n 1)"
          host_port="${binding##*:}"

          echo '=== Direct probe ==='
          curl -sS -D - "http://127.0.0.1:${host_port}/deadlock/tools/statlocker" -o /dev/null | head -n 20

          echo '=== HTTP local Nginx ==='
          curl -sS -D - -H "Host: $domain" "http://127.0.0.1/deadlock/tools/statlocker" -o /dev/null | head -n 20 || true

          echo '=== HTTPS local Nginx ==='
          curl -k -sS -D - --resolve "${domain}:443:127.0.0.1" "https://${domain}/deadlock/tools/statlocker" -o /dev/null | head -n 20 || true

          echo '=== Existing production route sample ==='
          curl -k -sS -D - --resolve "${domain}:443:127.0.0.1" "https://${domain}/deadlock/" -o /dev/null | head -n 20 || true

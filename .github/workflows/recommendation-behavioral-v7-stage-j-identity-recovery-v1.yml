name: Recommendation Behavioral V7 Stage J Identity Recovery V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-behavioral-v7-stage-j-identity-recovery-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v7-stage-j-identity-recovery-v1
  cancel-in-progress: true

jobs:
  historical-recovery-closed:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Enforce closed historical bridge contract
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          Historical Stage J identity recovery is closed by the authoritative V7 roadmap.
          Canonical source rows for the frozen bridge were removed by retention, so the workflow must not rebuild images,
          mutate the identity schema, perform historical identity inference, or apply bounded recovery to that frozen scope.
          Future proof must use direct accountId persistence before retention.
          EOF
          echo 'status=UNRECOVERABLE_BY_DESIGN'
          echo 'productionMutationPerformed=false'
          echo 'historicalIdentityInferencePerformed=false'
          echo 'trainingPerformed=false'
          echo 'valueTrainingPerformed=false'
          echo 'futureTestEvaluated=false'

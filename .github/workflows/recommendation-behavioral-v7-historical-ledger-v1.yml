name: Recommendation Behavioral V7 Pinned Data Gates V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-behavioral-v7-historical-ledger-v1.yml'
      - 'scripts/export-recommendation-pro-decision-dataset-v7.mjs'
      - 'scripts/audit-recommendation-behavioral-v7-choice-set.mjs'
      - 'scripts/diagnose-recommendation-behavioral-v7-information-gain-v3.mjs'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v7-pinned-data-gates-v1
  cancel-in-progress: false

jobs:
  gates:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin immutable Stage C inputs
        shell: bash
        run: |
          set -euo pipefail
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          ledger="$storage/recommendation-behavioral-v7-historical-ledger-v1/ledger.ndjson"
          temporal="$storage/recommendation-behavioral-v7-temporal-audit-v2/report.json"
          sample="$storage/recommendation-behavioral-v5-1-sweep-b-v1/diagnostic-sample.ndjson.gz"
          telemetry="$storage/recommendation-observability-v7/events.ndjson"
          identity="$storage/recommendation-observability-v7/player-identities.ndjson"
          sudo test -s "$ledger"
          sudo test -s "$temporal"
          sudo test -s "$sample"
          sudo cp "$ledger" "$RUNNER_TEMP/v7-ledger.ndjson"
          sudo cp "$temporal" "$RUNNER_TEMP/v7-temporal.json"
          sudo cp "$sample" "$RUNNER_TEMP/v7-source.ndjson.gz"
          if sudo test -s "$telemetry"; then sudo cp "$telemetry" "$RUNNER_TEMP/v7-telemetry.ndjson"; else sudo touch "$RUNNER_TEMP/v7-telemetry.ndjson"; fi
          if sudo test -s "$identity"; then sudo cp "$identity" "$RUNNER_TEMP/v7-external-player-identities.ndjson"; else sudo touch "$RUNNER_TEMP/v7-external-player-identities.ndjson"; fi
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP"/v7-*
          echo '8d87519d797b54fc3f726837e80bb79968b44dc59960dadcb934261f329ce1ac  '"$RUNNER_TEMP/v7-source.ndjson.gz" | sha256sum -c -
          jq -e '.schemaVersion == 2 and .summary.stageBGatePassed == true and .contracts.futureTestEvaluated == false' "$RUNNER_TEMP/v7-temporal.json"

      - name: Resolve direct player identity
        shell: bash
        env:
          BEHAVIORAL_V7_SOURCE_DATASET_V6_PATH: ${{ runner.temp }}/v7-source.ndjson.gz
          BEHAVIORAL_V7_EXTERNAL_PLAYER_IDENTITY_PATH: ${{ runner.temp }}/v7-external-player-identities.ndjson
          BEHAVIORAL_V7_RESOLVED_PLAYER_IDENTITY_PATH: ${{ runner.temp }}/v7-player-identities.ndjson
          BEHAVIORAL_V7_RESOLVED_PLAYER_IDENTITY_AUDIT_PATH: ${{ runner.temp }}/identity-resolution.json
        run: |
          set -euo pipefail
          node scripts/resolve-recommendation-behavioral-v7-player-identity.mjs
          jq -e '.schemaVersion == 1 and .passed == true and .trainingPerformed == false and .futureTestEvaluated == false and .identityConflictCount == 0 and .contracts.identityConflictAccepted == false and .contracts.databaseSurrogateMayRepresentSteamId == false and .contracts.heroIdentityInferencePerformed == false' "$BEHAVIORAL_V7_RESOLVED_PLAYER_IDENTITY_AUDIT_PATH"

      - name: Export immutable non-FUTURE Dataset V7
        shell: bash
        env:
          BEHAVIORAL_V7_SOURCE_DATASET_V6_PATH: ${{ runner.temp }}/v7-source.ndjson.gz
          BEHAVIORAL_V7_TEMPORAL_AUDIT_PATH: ${{ runner.temp }}/v7-temporal.json
          BEHAVIORAL_V7_HISTORICAL_LEDGER_PATH: ${{ runner.temp }}/v7-ledger.ndjson
          BEHAVIORAL_V7_TELEMETRY_PATH: ${{ runner.temp }}/v7-telemetry.ndjson
          BEHAVIORAL_V7_PLAYER_IDENTITY_PATH: ${{ runner.temp }}/v7-player-identities.ndjson
          BEHAVIORAL_V7_OUTPUT_DATASET_PATH: ${{ runner.temp }}/dataset-v7.ndjson
          BEHAVIORAL_V7_OUTPUT_AUDIT_PATH: ${{ runner.temp }}/dataset-v7-audit.json
        run: |
          set -euo pipefail
          node scripts/export-recommendation-pro-decision-dataset-v7.mjs
          jq -e '.schemaVersion == 2 and .stageCExportPassed == true and .futureTestDecisionCount == 0 and .futureTestEvaluated == false and .newObservedDecisionCount > 0 and .observedActionInjectedCount == 0 and .identityContracts.historicalIdentityInferencePerformed == false and .identityContracts.heroIdentityInferencePerformed == false' "$BEHAVIORAL_V7_OUTPUT_AUDIT_PATH"
          gzip -9 "$BEHAVIORAL_V7_OUTPUT_DATASET_PATH"
          sha256sum "$RUNNER_TEMP/dataset-v7.ndjson.gz" > "$RUNNER_TEMP/dataset-v7.sha256"

      - name: Run Stage D exact feasible choice-set gate
        shell: bash
        env:
          BEHAVIORAL_V7_DATASET_PATH: ${{ runner.temp }}/dataset-v7.ndjson.gz
          BEHAVIORAL_V7_CHOICE_SET_REPORT_PATH: ${{ runner.temp }}/stage-d.json
        run: |
          set -euo pipefail
          node scripts/audit-recommendation-behavioral-v7-choice-set.mjs
          jq -e '.schemaVersion == 3 and .stageDGatePassed == true and .futureTestEvaluated == false and .gates.overallCandidateCoveragePass == true and .gates.allMajorGroupCoveragePass == true and .gates.overallDecisionCoveragePass == true and .gates.allMajorGroupDecisionCoveragePass == true and .gates.exactRankingSemanticsPass == true and .gates.futureTestExcluded == true' "$BEHAVIORAL_V7_CHOICE_SET_REPORT_PATH"

      - name: Run Stage E information-gain stop gate
        shell: bash
        env:
          BEHAVIORAL_V7_COMPACT_ROWS_PATH: ${{ runner.temp }}/dataset-v7.ndjson.gz
          BEHAVIORAL_V7_STAGE_D_PATH: ${{ runner.temp }}/stage-d.json
          BEHAVIORAL_V7_INFORMATION_GAIN_REPORT_PATH: ${{ runner.temp }}/stage-e.json
        run: |
          set -euo pipefail
          node scripts/diagnose-recommendation-behavioral-v7-information-gain-v3.mjs
          jq -e '.schemaVersion == 4 and .stageEGatePassed == true and .behavioralModelTrainingPerformed == false and .futureTestEvaluated == false and .tuningUsedForParameterUpdates == false and .gates.informationGainThresholdPass == true' "$BEHAVIORAL_V7_INFORMATION_GAIN_REPORT_PATH"

      - name: Persist pinned gate evidence
        shell: bash
        run: |
          set -euo pipefail
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          canonical="$storage/recommendation-behavioral-v7-pinned-data-gates-v1"
          output="$canonical/runs/${{ github.run_id }}-${{ github.run_attempt }}"
          sudo mkdir -p "$output" "$canonical"
          for spec in \
            'identity-resolution.json:identity-resolution.json' \
            'dataset-v7.ndjson.gz:dataset.ndjson.gz' \
            'dataset-v7.sha256:dataset.sha256' \
            'dataset-v7-audit.json:dataset-audit.json' \
            'stage-d.json:stage-d.json' \
            'stage-e.json:stage-e.json'; do
            src="${spec%%:*}"; dst="${spec##*:}"
            sudo install -m 0644 "$RUNNER_TEMP/$src" "$output/$dst"
            sudo install -m 0644 "$RUNNER_TEMP/$src" "$canonical/$dst"
          done
          sha="$(sha256sum "$RUNNER_TEMP/dataset-v7.ndjson.gz" | awk '{print $1}')"
          jq -n --arg runId '${{ github.run_id }}' --arg runAttempt '${{ github.run_attempt }}' --arg datasetSha256 "$sha" --arg sourceSha256 '8d87519d797b54fc3f726837e80bb79968b44dc59960dadcb934261f329ce1ac' --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{schemaVersion:1,operation:"RECOMMENDATION_BEHAVIORAL_V7_PINNED_DATA_GATES",generatedAt:$generatedAt,runId:$runId,runAttempt:$runAttempt,datasetSha256:$datasetSha256,sourceDatasetV6Sha256:$sourceSha256,stageCPassed:true,stageDPassed:true,stageEPassed:true,trainingPerformed:false,futureTestEvaluated:false}' > "$RUNNER_TEMP/gates-manifest.json"
          sudo install -m 0644 "$RUNNER_TEMP/gates-manifest.json" "$output/manifest.json"
          sudo install -m 0644 "$RUNNER_TEMP/gates-manifest.json" "$canonical/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: recommendation-behavioral-v7-pinned-data-gates-v1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/identity-resolution.json
            ${{ runner.temp }}/dataset-v7-audit.json
            ${{ runner.temp }}/dataset-v7.sha256
            ${{ runner.temp }}/stage-d.json
            ${{ runner.temp }}/stage-e.json
            ${{ runner.temp }}/gates-manifest.json
          retention-days: 14

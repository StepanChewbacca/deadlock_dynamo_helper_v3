name: Recommendation Behavioral V5.2 Root Cause V1

on:
  pull_request:
    paths:
      - '.github/research-requests/recommendation-behavioral-v5-2-root-cause-v1.json'

permissions:
  contents: read

jobs:
  analyze-root-cause:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate read-only research request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/research-requests/recommendation-behavioral-v5-2-root-cause-v1.json'
          jq -e '
            .schemaVersion == 1 and
            .operation == "RECOMMENDATION_BEHAVIORAL_V5_2_ROOT_CAUSE_DIAGNOSTIC" and
            .trainingAuthorized == false and
            .valueTrainingAuthorized == false and
            .productionChangesAuthorized == false
          ' "$request"
          node --check scripts/analyze-recommendation-behavioral-v5-2-root-cause-v3.mjs

      - name: Stage immutable evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          root='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          stage='/tmp/recommendation-behavioral-v5-2-root-cause-input'
          sudo rm -rf "$stage"
          sudo mkdir -p "$stage/v52/a" "$stage/v52/b" "$stage/v52/c"
          sudo cp "$root/recommendation-behavioral-v5-1-sweep-b-v1/diagnostic-sample.ndjson.gz" "$stage/sample.ndjson.gz"
          for variant in a b c; do
            sudo cp "$root/recommendation-behavioral-v5-2-bounded-v8-background/$variant/evaluation.json" "$stage/v52/$variant/evaluation.json"
          done
          sudo chown -R "$(id -u):$(id -g)" "$stage"
          sha256sum "$stage/sample.ndjson.gz"
          find "$stage" -type f -maxdepth 3 -printf '%p %s bytes\n' | sort

      - name: Analyze immutable pinned sample and completed evaluations
        shell: bash
        env:
          BEHAVIORAL_SAMPLE_PATH: /tmp/recommendation-behavioral-v5-2-root-cause-input/sample.ndjson.gz
          BEHAVIORAL_V52_OUTPUT_DIR: /tmp/recommendation-behavioral-v5-2-root-cause-input/v52
          ROOT_CAUSE_REPORT_PATH: /tmp/recommendation-behavioral-v5-2-root-cause.json
        run: |
          set -euo pipefail
          node scripts/analyze-recommendation-behavioral-v5-2-root-cause-v3.mjs

      - name: Upload root cause evidence
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-behavioral-v5-2-root-cause-v1
          path: /tmp/recommendation-behavioral-v5-2-root-cause.json
          retention-days: 7

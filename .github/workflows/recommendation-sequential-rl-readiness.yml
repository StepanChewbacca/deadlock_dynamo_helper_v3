name: Recommendation Sequential RL Readiness

on:
  workflow_dispatch:
    inputs:
      transitions_path:
        description: Pre-staged immutable sequential transition JSONL on the protected runner
        required: true
        type: string
      transition_artifact_ref:
        description: Immutable reference for the exact transition artifact
        required: true
        type: string
      policy_model_id:
        description: Frozen Policy V1 model id
        required: true
        type: string
      policy_model_version:
        description: Frozen Policy V1 model version
        required: true
        type: string
      policy_manifest_sha256:
        description: Frozen Policy V1 manifest SHA256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recommendation-sequential-rl-readiness
  cancel-in-progress: false

jobs:
  evaluate-research-gate:
    environment: recommendation-sequential-rl
    runs-on: [self-hosted, linux, x64, recommendation-sequential-rl]
    timeout-minutes: 60
    env:
      TRANSITIONS_PATH_INPUT: ${{ inputs.transitions_path }}
      TRANSITION_ARTIFACT_REF: ${{ inputs.transition_artifact_ref }}
      POLICY_MODEL_ID: ${{ inputs.policy_model_id }}
      POLICY_MODEL_VERSION: ${{ inputs.policy_model_version }}
      POLICY_MANIFEST_SHA256: ${{ inputs.policy_manifest_sha256 }}
      ROADMAP_API_BASE_URL: ${{ vars.RECOMMENDATION_ROADMAP_API_BASE_URL }}
      ROADMAP_TOKEN: ${{ secrets.RECOMMENDATION_ROADMAP_EVIDENCE_TOKEN }}
    steps:
      - name: Checkout frozen sequential research evaluator
        uses: actions/checkout@v4

      - name: Validate research-only immutable input
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RECOMMENDATION_SEQUENTIAL_RL_STAGING_ROOT:-}" || { echo "RECOMMENDATION_SEQUENTIAL_RL_STAGING_ROOT is required" >&2; exit 1; }
          test -n "$ROADMAP_API_BASE_URL" || { echo "RECOMMENDATION_ROADMAP_API_BASE_URL is required" >&2; exit 1; }
          test -n "$ROADMAP_TOKEN" || { echo "RECOMMENDATION_ROADMAP_EVIDENCE_TOKEN is required" >&2; exit 1; }
          [[ "$POLICY_MODEL_ID" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "policy_model_id is invalid" >&2; exit 1; }
          [[ "$POLICY_MODEL_VERSION" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "policy_model_version is invalid" >&2; exit 1; }
          [[ "$POLICY_MANIFEST_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "policy_manifest_sha256 is invalid" >&2; exit 1; }
          case "$TRANSITION_ARTIFACT_REF" in immutable://*|s3://*|gs://*|https://*) ;; *) echo "transition_artifact_ref must be immutable or remote" >&2; exit 1;; esac
          STAGING_ROOT="$(realpath -e "$RECOMMENDATION_SEQUENTIAL_RL_STAGING_ROOT")"
          TRANSITIONS="$(realpath -e "$TRANSITIONS_PATH_INPUT")"
          case "$TRANSITIONS" in "$STAGING_ROOT"/*) ;; *) echo "transitions_path must be inside sequential RL staging root" >&2; exit 1;; esac
          test -f "$TRANSITIONS" || { echo "Sequential transition artifact is not a file" >&2; exit 1; }
          test -s "$TRANSITIONS" || { echo "Sequential transition artifact is empty" >&2; exit 1; }
          echo "TRANSITIONS_PATH=$TRANSITIONS" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install repository dependencies
        run: yarn install --frozen-lockfile

      - name: Build canonical shared contracts
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Evaluate sequential transition integrity
        shell: bash
        run: |
          set -euo pipefail
          ATTESTATION="$RUNNER_TEMP/recommendation-sequential-rl-attestation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          node scripts/evaluate-recommendation-sequential-rl-v1.mjs \
            --transitions "$TRANSITIONS_PATH" \
            --output "$ATTESTATION" \
            --policy-model-id "$POLICY_MODEL_ID" \
            --policy-model-version "$POLICY_MODEL_VERSION" \
            --policy-manifest-sha256 "$POLICY_MANIFEST_SHA256" \
            --transition-artifact-ref "$TRANSITION_ARTIFACT_REF"
          echo "ATTESTATION_PATH=$ATTESTATION" >> "$GITHUB_ENV"

      - name: Materialize research-only sequential RL gate
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/recommendation-sequential-rl-response-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            -H "x-recommendation-roadmap-token: $ROADMAP_TOKEN" \
            --data-binary "@$ATTESTATION_PATH" \
            "$ROADMAP_API_BASE_URL/deadlock-live/recommendation-roadmap/v1/materialize/sequential-rl-research" \
            > "$RESPONSE_FILE"
          python3 - "$RESPONSE_FILE" <<'PY'
          import json, sys
          response = json.load(open(sys.argv[1], encoding="utf-8"))
          report = response.get("report") or {}
          if report.get("status") not in ["PASS", "FAIL", "INSUFFICIENT_EVIDENCE"]:
              raise SystemExit("Sequential RL materializer returned an invalid status")
          print(json.dumps({
              "status": report.get("status"),
              "researchOnly": True,
              "futureTestUsedForModelSelection": False,
              "transitionArtifactSha256": report.get("transitionArtifactSha256"),
              "snapshotSubjectSha256": response.get("snapshotSubjectSha256"),
          }, sort_keys=True))
          PY

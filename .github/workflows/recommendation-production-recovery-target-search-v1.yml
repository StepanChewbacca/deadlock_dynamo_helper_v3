name: Recommendation Production Recovery Target Search V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-production-recovery-target-search-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-production-recovery-target-search-v1
  cancel-in-progress: true

jobs:
  search:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Trace historical Contextual V3 recovery outputs and persist local evidence
        shell: bash
        run: |
          set -euo pipefail
          historical_root='/home/ubuntu/deadlock-training-results/full-crawler-recovery-v3-20260725'
          unit='deadlock-full-crawler-recovery-v3-20260725.service'
          evidence_root='/home/ubuntu/apps/deadlock_dynamo_helper-training/production-recovery-evidence/target-search'
          evidence="$evidence_root/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          latest="$evidence_root/latest"
          expected_model_sha='92524cdeb1ff197d564c67f8cc4893f76e2a62c13d89175255e95ce3469d1ced'
          legacy_model_sha='88e3400e7bc88f0af7a6752fc4b7ea9b83af9a8a6424dff707b151e6459f10d3'
          sudo mkdir -p "$evidence"
          sudo chown -R "$(id -u):$(id -g)" "$evidence_root"
          sudo test -d "$historical_root"

          for name in \
            00-summary.json \
            02-contextual-training-manifest.json \
            02-contextual-training-evaluation.json \
            02-contextual-training-audit.json \
            storage-volume.json \
            deploy.json \
            state.json; do
            if sudo test -f "$historical_root/$name"; then
              sudo cat "$historical_root/$name" > "$evidence/$name"
              echo "--- $name ---"
              cat "$evidence/$name"
            fi
          done

          sudo systemctl show "$unit" \
            -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus \
            -p MainPID -p NRestarts -p FragmentPath -p ExecStart > "$evidence/systemd-show.txt" 2>&1 || true
          sudo systemctl status --no-pager "$unit" > "$evidence/systemd-status.txt" 2>&1 || true
          echo '--- systemd show ---'
          cat "$evidence/systemd-show.txt"
          echo '--- systemd status ---'
          tail -n 120 "$evidence/systemd-status.txt"

          if sudo test -f "$historical_root/service.log"; then
            sudo grep -Ein \
              'contextual-v3|92524c|88e340|model|artifact|manifest|storage|volume|copy|deploy|restore|training' \
              "$historical_root/service.log" | tail -n 500 > "$evidence/service-recovery-lines.txt" || true
            echo '--- service recovery lines ---'
            cat "$evidence/service-recovery-lines.txt"
          fi

          paths="$evidence/referenced-paths.txt"
          : > "$paths"
          grep -Eho '/[^"[:space:]]+' "$evidence"/*.json 2>/dev/null \
            | sed 's/[},]$//' \
            | sort -u > "$paths" || true
          echo '--- referenced paths ---'
          cat "$paths"

          : > "$evidence/referenced-path-inventory.tsv"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if sudo test -f "$path"; then
              printf 'FILE\t%s\t%s\t%s\n' \
                "$(sudo sha256sum "$path" | awk '{print $1}')" \
                "$(sudo stat -c '%s' "$path")" "$path" >> "$evidence/referenced-path-inventory.tsv"
            elif sudo test -d "$path"; then
              printf 'DIR\t-\t-\t%s\n' "$path" >> "$evidence/referenced-path-inventory.tsv"
            fi
          done < "$paths"
          echo '--- referenced path inventory ---'
          cat "$evidence/referenced-path-inventory.tsv"

          search_roots=(
            /home/ubuntu
            /root
            /tmp
            /var/backups
            /var/lib/docker/volumes
            /var/lib/docker/containers
            /var/lib/docker/overlay2
          )
          existing_search_roots=()
          for root in "${search_roots[@]}"; do
            if sudo test -d "$root"; then
              existing_search_roots+=("$root")
            fi
          done
          printf '%s\n' "${existing_search_roots[@]}" > "$evidence/search-roots.txt"

          echo '--- targeted model file search ---'
          : > "$evidence/targeted-model-paths.txt"
          set +e
          timeout 360s sudo find "${existing_search_roots[@]}" \
            -type f \
            \( -iname '*contextual*v3*' -o -iname 'model.json' -o -iname 'model.bin' -o -iname 'model*.json' \) \
            -print 2>/dev/null \
            | sort -u \
            | head -n 10000 \
            | tee "$evidence/targeted-model-paths.txt"
          find_status=${PIPESTATUS[0]}
          set -e
          if [ "$find_status" -ne 0 ] && [ "$find_status" -ne 124 ]; then
            echo "targeted find exited with status $find_status" >&2
            exit "$find_status"
          fi

          : > "$evidence/targeted-model-sha.tsv"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            bytes="$(sudo stat -c '%s' "$file" 2>/dev/null || echo 0)"
            if [ "$bytes" -le 1073741824 ]; then
              sha="$(sudo sha256sum "$file" 2>/dev/null | awk '{print $1}' || true)"
              printf '%s\t%s\t%s\n' "$sha" "$bytes" "$file" >> "$evidence/targeted-model-sha.tsv"
            fi
          done < "$evidence/targeted-model-paths.txt"

          grep -E "$legacy_model_sha|$expected_model_sha" \
            "$evidence/targeted-model-sha.tsv" > "$evidence/matching-known-artifacts.tsv" || true
          matching_sha_count="$(wc -l < "$evidence/matching-known-artifacts.tsv" | tr -d ' ')"
          echo '--- exact known artifact matches ---'
          cat "$evidence/matching-known-artifacts.tsv"

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg historicalRoot "$historical_root" \
            --arg evidencePath "$evidence" \
            --arg expectedModelSha256 "$expected_model_sha" \
            --arg legacyModelSha256 "$legacy_model_sha" \
            --argjson matchingShaCount "$matching_sha_count" \
            --argjson searchTimedOut "$([ "$find_status" -eq 124 ] && echo true || echo false)" \
            '{schemaVersion:5,generatedAt:$generatedAt,historicalRoot:$historicalRoot,evidencePath:$evidence,expectedModelSha256:$expectedModelSha256,legacyModelSha256:$legacyModelSha256,matchingKnownArtifactShaCount:$matchingShaCount,searchTimedOut:$searchTimedOut,productionMutationPerformed:false,trainingPerformed:false,futureTestEvaluated:false}' \
            | tee "$evidence/trace-summary.json"

          ln -sfn "runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$latest"
          sha256sum "$evidence/trace-summary.json" > "$evidence/trace-summary.sha256"

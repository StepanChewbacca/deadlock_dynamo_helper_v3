name: Recommendation Behavioral V7 Pipeline Validator

on:
  pull_request:
    paths:
      - 'apps/api/src/deadlock-live/hero-build-decision-dataset-v3.service.ts'
      - 'apps/api/src/deadlock-live/recommendation-historical-pro-replay.ts'
      - 'apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v6.ts'
      - 'apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v7.ts'
      - 'apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v7.spec.ts'
      - 'apps/api/src/deadlock-live/recommendation-observability-v7-*.ts'
      - 'apps/api/src/deadlock-live/recommendation-behavioral-v7-choice-set.ts'
      - 'apps/api/src/deadlock-live/recommendation-behavioral-v7.ts'
      - 'apps/api/test/recommendation-behavioral-v7.spec.ts'
      - 'apps/api/test/recommendation-observability-v7.spec.ts'
      - 'apps/api/test/recommendation-direct-player-identity-propagation.spec.ts'
      - 'scripts/audit-recommendation-behavioral-v7-observability-v2.mjs'
      - 'scripts/refine-recommendation-behavioral-v7-temporal-audit.mjs'
      - 'scripts/resolve-recommendation-behavioral-v7-player-identity.mjs'
      - 'scripts/export-recommendation-pro-decision-dataset-v7.mjs'
      - 'scripts/freeze-recommendation-pro-decision-dataset-v7-lineage.mjs'
      - 'scripts/audit-recommendation-behavioral-v7-choice-set.mjs'
      - 'scripts/audit-recommendation-behavioral-v7-choice-set-v2.mjs'
      - 'scripts/diagnose-recommendation-behavioral-v7-information-gain*.mjs'
      - 'scripts/recommendation-behavioral-v7-evaluation.mjs'
      - 'scripts/recommendation-behavioral-v7-model-families.mjs'
      - 'scripts/run-recommendation-behavioral-v7-bounded-screen.mjs'
      - 'scripts/run-recommendation-behavioral-v7-strict-crossfit.mjs'
      - 'scripts/run-recommendation-behavioral-v7-full-train.mjs'
      - 'scripts/verify-recommendation-behavioral-v7-full.mjs'
      - 'scripts/prepare-recommendation-behavioral-v7-runtime-release.mjs'
      - 'scripts/validate-recommendation-value-v8-v7-readiness.mjs'
      - '.github/workflows/recommendation-behavioral-v7-pipeline-validator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V7 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit-recommendation-behavioral-v7-observability-v2.mjs
          node --check scripts/refine-recommendation-behavioral-v7-temporal-audit.mjs
          node --check scripts/resolve-recommendation-behavioral-v7-player-identity.mjs
          node --check scripts/export-recommendation-pro-decision-dataset-v7.mjs
          node --check scripts/freeze-recommendation-pro-decision-dataset-v7-lineage.mjs
          node --check scripts/audit-recommendation-behavioral-v7-choice-set.mjs
          node --check scripts/audit-recommendation-behavioral-v7-choice-set-v2.mjs
          node --check scripts/diagnose-recommendation-behavioral-v7-information-gain.mjs
          node --check scripts/diagnose-recommendation-behavioral-v7-information-gain-v2.mjs
          node --check scripts/diagnose-recommendation-behavioral-v7-information-gain-v3.mjs
          node --check scripts/recommendation-behavioral-v7-evaluation.mjs
          node --check scripts/recommendation-behavioral-v7-model-families.mjs
          node --check scripts/run-recommendation-behavioral-v7-bounded-screen.mjs
          node --check scripts/run-recommendation-behavioral-v7-strict-crossfit.mjs
          node --check scripts/run-recommendation-behavioral-v7-full-train.mjs
          node --check scripts/verify-recommendation-behavioral-v7-full.mjs
          node --check scripts/prepare-recommendation-behavioral-v7-runtime-release.mjs
          node --check scripts/validate-recommendation-value-v8-v7-readiness.mjs
          grep -q 'MATCH_PLAYER_ACCOUNT_ID_DIRECT' apps/api/src/deadlock-live/hero-build-decision-dataset-v3.service.ts
          grep -q 'accountId: replayRow.accountId' apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v6.ts
          grep -q 'embeddedIdentityPreferred: true' scripts/resolve-recommendation-behavioral-v7-player-identity.mjs
          grep -q 'identityConflictAccepted: false' scripts/resolve-recommendation-behavioral-v7-player-identity.mjs
          grep -q 'databaseSurrogateMayRepresentSteamId: false' scripts/resolve-recommendation-behavioral-v7-player-identity.mjs
          grep -q 'RECOMMENDATION_PRO_DECISION_DATASET_V7_OBSERVABILITY_1' apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v7.ts
          grep -q 'observedActionInjected: false' apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v7.ts
          grep -q 'selectedAfterObservedAction: false' apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v7.ts
          grep -q 'sourceGameTimeS > decisionGameTimeS' apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v7.ts
          grep -q 'netWorthMayRepresentWallet: false' scripts/refine-recommendation-behavioral-v7-temporal-audit.mjs
          grep -q 'EVENT_LEDGER_PREFIX_ONLY' scripts/refine-recommendation-behavioral-v7-temporal-audit.mjs
          grep -q 'datasetPlayerIdMayRepresentSteamIdWithoutDirectBridge: false' scripts/refine-recommendation-behavioral-v7-temporal-audit.mjs
          grep -q 'latestAtOrBefore' scripts/export-recommendation-pro-decision-dataset-v7.mjs
          grep -q 'HISTORICAL_PREFIX_OBSERVABILITY_BACKFILL_3_EXPLICIT_IDENTITY' scripts/export-recommendation-pro-decision-dataset-v7.mjs
          grep -q 'EXPLICIT_DATASET_PLAYER_TO_STEAM_ID_SIDECAR_ONLY' scripts/export-recommendation-pro-decision-dataset-v7.mjs
          grep -q 'EXACT_FULL_SOURCE_ROWS_WHERE_SPLIT_NE_FUTURE_TEST' scripts/freeze-recommendation-pro-decision-dataset-v7-lineage.mjs
          grep -q 'nonFutureLogicalShaMatchesFullSourceProjection: true' scripts/freeze-recommendation-pro-decision-dataset-v7-lineage.mjs
          grep -q "payload.entity_type !== 'player_controller'" apps/api/src/deadlock-live/recommendation-observability-v7-raw-extractor.ts
          grep -q 'unknownAvailabilityRetained: true' scripts/audit-recommendation-behavioral-v7-choice-set.mjs
          grep -q 'overallCoverageAtLeast099' scripts/audit-recommendation-behavioral-v7-choice-set-v2.mjs
          grep -q 'allMajorGroupsAtLeast095' scripts/audit-recommendation-behavioral-v7-choice-set-v2.mjs
          grep -q 'behavioralChoiceSetActionKeys: selection.actionKeys' scripts/audit-recommendation-behavioral-v7-choice-set-v2.mjs
          grep -q 'gates?.overallCoverageAtLeast099 === true' scripts/diagnose-recommendation-behavioral-v7-information-gain-v3.mjs
          grep -q 'gates?.allMajorGroupsAtLeast095 === true' scripts/diagnose-recommendation-behavioral-v7-information-gain-v3.mjs
          grep -q 'const actionKeys = row.behavioralChoiceSetActionKeys' scripts/diagnose-recommendation-behavioral-v7-information-gain-v3.mjs
          grep -q "nextAuthorizedOperation = stageEGatePassed" scripts/diagnose-recommendation-behavioral-v7-information-gain-v3.mjs
          grep -q "'BOUNDED_BEHAVIORAL_V7_SCREEN'" scripts/diagnose-recommendation-behavioral-v7-information-gain-v3.mjs
          grep -q 'sameChoiceSetUsedForBaselineAndEnriched: true' scripts/diagnose-recommendation-behavioral-v7-information-gain.mjs
          grep -q 'tuningUsedForDiagnostic: false' scripts/diagnose-recommendation-behavioral-v7-information-gain.mjs
          grep -q "BEHAVIORAL_V7_LINEAR_FAMILY = 'LINEAR_LISTWISE_V7_OBSERVABILITY_1'" scripts/recommendation-behavioral-v7-model-families.mjs
          grep -q "BEHAVIORAL_V7_SEQUENCE_FAMILY = 'SEQUENCE_V7_OBSERVABILITY_V6_CAPACITY_1'" scripts/recommendation-behavioral-v7-model-families.mjs
          grep -q "capacityContract: SEQUENCE_CAPACITY_REFERENCE" scripts/recommendation-behavioral-v7-model-families.mjs
          grep -q "consumesV7Observability: true" scripts/recommendation-behavioral-v7-model-families.mjs
          grep -q "V7_STAGE_F_FIXED_FAMILY_COMPARISON_1" scripts/run-recommendation-behavioral-v7-bounded-screen.mjs
          grep -q 'championFamily' scripts/run-recommendation-behavioral-v7-bounded-screen.mjs
          grep -q "stageE.nextAuthorizedOperation !== 'BOUNDED_BEHAVIORAL_V7_SCREEN'" scripts/run-recommendation-behavioral-v7-bounded-screen.mjs
          grep -q 'boundedChampionFamilyPreserved: true' scripts/run-recommendation-behavioral-v7-strict-crossfit.mjs
          grep -q 'RECOMMENDATION_BEHAVIORAL_V7_OOF_PROPENSITY_1' scripts/run-recommendation-behavioral-v7-strict-crossfit.mjs
          grep -q 'futureTestUsedForPropensity: false' scripts/run-recommendation-behavioral-v7-strict-crossfit.mjs
          grep -q 'strictCrossFitFamilyPreserved: true' scripts/run-recommendation-behavioral-v7-full-train.mjs
          grep -q 'modelTrainingPerformedByVerifier: false' scripts/verify-recommendation-behavioral-v7-full.mjs
          grep -q 'valueV8StageEligible: releaseGatePassed' scripts/verify-recommendation-behavioral-v7-full.mjs
          grep -q "operation === 'ROLLBACK'" scripts/prepare-recommendation-behavioral-v7-runtime-release.mjs
          grep -q 'productionApiRestarted: false' scripts/prepare-recommendation-behavioral-v7-runtime-release.mjs
          grep -q 'BEHAVIORAL_V7_VERIFIED_RAW_OOF_PROPENSITY' scripts/validate-recommendation-value-v8-v7-readiness.mjs
          grep -q 'valueTrainingPerformedByReadinessCheck: false' scripts/validate-recommendation-value-v8-v7-readiness.mjs
          grep -q 'valueV8TrainingAuthorized: false' scripts/validate-recommendation-value-v8-v7-readiness.mjs
          grep -q 'RAW_SOFTMAX_WITHIN_DECISION' apps/api/src/deadlock-live/recommendation-behavioral-v7.ts

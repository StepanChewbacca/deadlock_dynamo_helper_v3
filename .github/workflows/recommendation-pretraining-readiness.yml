name: Recommendation Pretraining Readiness

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: Verified Recommendation Dataset V8 registry id
        required: true
        type: string
      dataset_dir:
        description: Pre-staged immutable dataset directory on the secure training runner
        required: true
        type: string
      expected_dataset_sha256:
        description: Expected immutable dataset SHA256
        required: true
        type: string
      expected_manifest_sha256:
        description: Expected canonical manifest SHA256 from the dataset registry
        required: true
        type: string
      action_contract_version:
        description: Action contract used by the dataset
        required: true
        default: recommendation-actions-v1
        type: string

permissions:
  contents: read

concurrency:
  group: recommendation-pretraining-readiness
  cancel-in-progress: false

jobs:
  final-readiness:
    environment: recommendation-training
    runs-on: [self-hosted, linux, x64, recommendation-training]
    timeout-minutes: 30
    env:
      DATASET_ID: ${{ inputs.dataset_id }}
      DATASET_DIR: ${{ inputs.dataset_dir }}
      EXPECTED_DATASET_SHA256: ${{ inputs.expected_dataset_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
      ACTION_CONTRACT_VERSION: ${{ inputs.action_contract_version }}
      TRAINING_PREFLIGHT_URL: ${{ vars.RECOMMENDATION_TRAINING_PREFLIGHT_URL }}
      TRAINING_TOKEN: ${{ secrets.RECOMMENDATION_TRAINING_TOKEN }}
    steps:
      - name: Checkout frozen training code
        uses: actions/checkout@v4

      - name: Validate secure runner and immutable input contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RECOMMENDATION_TRAINING_OUTPUT_ROOT:-}" || { echo "RECOMMENDATION_TRAINING_OUTPUT_ROOT is required" >&2; exit 1; }
          test -n "${RECOMMENDATION_DATASET_STAGING_ROOT:-}" || { echo "RECOMMENDATION_DATASET_STAGING_ROOT is required" >&2; exit 1; }
          test -n "${RECOMMENDATION_TRAINING_WHEELHOUSE:-}" || { echo "RECOMMENDATION_TRAINING_WHEELHOUSE is required" >&2; exit 1; }
          test -n "$TRAINING_PREFLIGHT_URL" || { echo "RECOMMENDATION_TRAINING_PREFLIGHT_URL is required" >&2; exit 1; }
          test -n "$TRAINING_TOKEN" || { echo "RECOMMENDATION_TRAINING_TOKEN is required" >&2; exit 1; }
          [[ "$DATASET_ID" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "dataset_id contains unsafe characters" >&2; exit 1; }
          [[ "$EXPECTED_DATASET_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "expected_dataset_sha256 is invalid" >&2; exit 1; }
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "expected_manifest_sha256 is invalid" >&2; exit 1; }
          [[ "$ACTION_CONTRACT_VERSION" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "action_contract_version contains unsafe characters" >&2; exit 1; }
          case "$RECOMMENDATION_TRAINING_OUTPUT_ROOT" in /*) ;; *) echo "Training output root must be absolute" >&2; exit 1;; esac
          case "$RECOMMENDATION_DATASET_STAGING_ROOT" in /*) ;; *) echo "Dataset staging root must be absolute" >&2; exit 1;; esac
          case "$RECOMMENDATION_TRAINING_WHEELHOUSE" in /*) ;; *) echo "Training wheelhouse must be absolute" >&2; exit 1;; esac
          OUTPUT_ROOT="$(realpath -e "$RECOMMENDATION_TRAINING_OUTPUT_ROOT")"
          STAGING_ROOT="$(realpath -e "$RECOMMENDATION_DATASET_STAGING_ROOT")"
          WHEELHOUSE="$(realpath -e "$RECOMMENDATION_TRAINING_WHEELHOUSE")"
          DATASET_REAL="$(realpath -e "$DATASET_DIR")"
          test -d "$OUTPUT_ROOT" && test -w "$OUTPUT_ROOT" || { echo "Training output root is not a writable directory" >&2; exit 1; }
          test -d "$STAGING_ROOT" || { echo "Dataset staging root must be a directory" >&2; exit 1; }
          test -d "$WHEELHOUSE" || { echo "Training wheelhouse must be a directory" >&2; exit 1; }
          test -d "$DATASET_REAL" || { echo "Dataset directory does not exist" >&2; exit 1; }
          case "$DATASET_REAL" in "$STAGING_ROOT"/*) ;; *) echo "Dataset directory must be inside staging root" >&2; exit 1;; esac
          READINESS_ROOT="$(mktemp -d "$OUTPUT_ROOT/pretraining-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          echo "READINESS_ROOT=$READINESS_ROOT" >> "$GITHUB_ENV"
          echo "DATASET_DIR=$DATASET_REAL" >> "$GITHUB_ENV"
          echo "TRAINING_WHEELHOUSE=$WHEELHOUSE" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build isolated environment from approved offline wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$READINESS_ROOT/venv"
          "$READINESS_ROOT/venv/bin/pip" install --no-index --find-links "$TRAINING_WHEELHOUSE" -r training/recommendation_v8/requirements-training.txt

      - name: Verify training runtime and CUDA device
        shell: bash
        env:
          PYTHONHASHSEED: '0'
          CUBLAS_WORKSPACE_CONFIG: ':4096:8'
        run: |
          set -euo pipefail
          "$READINESS_ROOT/venv/bin/python" training/recommendation_v8/pretraining_environment_check.py \
            | tee "$READINESS_ROOT/environment-readiness.json"

      - name: Verify immutable dataset bytes and split isolation
        shell: bash
        run: |
          set -euo pipefail
          "$READINESS_ROOT/venv/bin/python" training/recommendation_v8/verify_dataset.py \
            --dataset-dir "$DATASET_DIR" \
            --expected-dataset-sha256 "$EXPECTED_DATASET_SHA256" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            | tee "$READINESS_ROOT/dataset-verification.json"
          "$READINESS_ROOT/venv/bin/python" - "$DATASET_DIR" "$ACTION_CONTRACT_VERSION" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          manifest = json.loads((pathlib.Path(sys.argv[1]) / "manifest.json").read_text())
          if manifest.get("actionContractVersion") != sys.argv[2]:
              raise SystemExit("Dataset action contract mismatch")
          source_commit = manifest.get("sourceCommitSha")
          if not isinstance(source_commit, str) or source_commit.lower() != sys.argv[3].lower():
              raise SystemExit("Readiness workflow commit does not match immutable dataset sourceCommitSha")
          if manifest.get("futureTestTouched") is not False:
              raise SystemExit("FUTURE_TEST is not untouched")
          keys = manifest.get("directShopSourceApprovalKeys")
          if not isinstance(keys, list) or len(keys) != 1 or not isinstance(keys[0], str) or not keys[0]:
              raise SystemExit("Dataset must bind exactly one validated direct shop source approval key")
          subject = manifest.get("directShopSourceValidationSubjectSha256")
          if not isinstance(subject, str) or len(subject) != 64 or any(c not in "0123456789abcdefABCDEF" for c in subject):
              raise SystemExit("Dataset direct shop validation subject SHA is invalid")
          PY
          DIRECT_SHOP_APPROVAL_KEY="$("$READINESS_ROOT/venv/bin/python" -c 'import json, os, pathlib; print(json.loads((pathlib.Path(os.environ["DATASET_DIR"]) / "manifest.json").read_text())["directShopSourceApprovalKeys"][0])')"
          DIRECT_SHOP_VALIDATION_SUBJECT_SHA256="$("$READINESS_ROOT/venv/bin/python" -c 'import json, os, pathlib; print(json.loads((pathlib.Path(os.environ["DATASET_DIR"]) / "manifest.json").read_text())["directShopSourceValidationSubjectSha256"])')"
          test -n "$DIRECT_SHOP_APPROVAL_KEY" || { echo "Direct shop approval key is empty" >&2; exit 1; }
          [[ "$DIRECT_SHOP_VALIDATION_SUBJECT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Direct shop validation subject SHA is invalid" >&2; exit 1; }
          echo "DIRECT_SHOP_APPROVAL_KEY=$DIRECT_SHOP_APPROVAL_KEY" >> "$GITHUB_ENV"
          echo "DIRECT_SHOP_VALIDATION_SUBJECT_SHA256=$DIRECT_SHOP_VALIDATION_SUBJECT_SHA256" >> "$GITHUB_ENV"

      - name: Require roadmap and verified-registry API preflight for RNN
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            -H "x-recommendation-training-token: $TRAINING_TOKEN" \
            --data-binary @<(python -c 'import json; print(json.dumps({"config": json.load(open("training/recommendation_v8/config/rnn.json"))}))') \
            "$TRAINING_PREFLIGHT_URL/$DATASET_ID" \
            > "$READINESS_ROOT/preflight-rnn.json"
          python - "$READINESS_ROOT/preflight-rnn.json" "$EXPECTED_DATASET_SHA256" "$DIRECT_SHOP_APPROVAL_KEY" "$DIRECT_SHOP_VALIDATION_SUBJECT_SHA256" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          if data.get("ready") is not True:
              raise SystemExit("RNN API preflight blocked: " + ",".join(data.get("blockers", [])))
          if data.get("datasetSha256") != sys.argv[2]:
              raise SystemExit("RNN API preflight dataset SHA mismatch")
          gates = data.get("currentDataGates") or {}
          if gates.get("directShopSourceValidation") != "PASS":
              raise SystemExit("RNN API preflight direct shop validation is not PASS")
          if gates.get("directShopSourceApprovalKeys") != [sys.argv[3]]:
              raise SystemExit("RNN API preflight direct shop approval identity mismatch")
          if str(gates.get("directShopSourceValidationSubjectSha256", "")).lower() != sys.argv[4].lower():
              raise SystemExit("RNN API preflight direct shop validation snapshot mismatch")
          PY

      - name: Require roadmap and verified-registry API preflight for Transformer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            -H "x-recommendation-training-token: $TRAINING_TOKEN" \
            --data-binary @<(python -c 'import json; print(json.dumps({"config": json.load(open("training/recommendation_v8/config/transformer.json"))}))') \
            "$TRAINING_PREFLIGHT_URL/$DATASET_ID" \
            > "$READINESS_ROOT/preflight-transformer.json"
          python - "$READINESS_ROOT/preflight-transformer.json" "$EXPECTED_DATASET_SHA256" "$DIRECT_SHOP_APPROVAL_KEY" "$DIRECT_SHOP_VALIDATION_SUBJECT_SHA256" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          if data.get("ready") is not True:
              raise SystemExit("Transformer API preflight blocked: " + ",".join(data.get("blockers", [])))
          if data.get("datasetSha256") != sys.argv[2]:
              raise SystemExit("Transformer API preflight dataset SHA mismatch")
          gates = data.get("currentDataGates") or {}
          if gates.get("directShopSourceValidation") != "PASS":
              raise SystemExit("Transformer API preflight direct shop validation is not PASS")
          if gates.get("directShopSourceApprovalKeys") != [sys.argv[3]]:
              raise SystemExit("Transformer API preflight direct shop approval identity mismatch")
          if str(gates.get("directShopSourceValidationSubjectSha256", "")).lower() != sys.argv[4].lower():
              raise SystemExit("Transformer API preflight direct shop validation snapshot mismatch")
          PY

      - name: Emit final no-training readiness attestation
        shell: bash
        run: |
          set -euo pipefail
          python - "$READINESS_ROOT" "$DATASET_ID" "$EXPECTED_DATASET_SHA256" "$EXPECTED_MANIFEST_SHA256" "$GITHUB_SHA" "$DIRECT_SHOP_APPROVAL_KEY" "$DIRECT_SHOP_VALIDATION_SUBJECT_SHA256" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          rnn = json.loads((root / "preflight-rnn.json").read_text())
          transformer = json.loads((root / "preflight-transformer.json").read_text())
          rnn_gates = rnn.get("currentDataGates") or {}
          transformer_gates = transformer.get("currentDataGates") or {}
          if rnn_gates.get("candidateGeneratorVersion") != transformer_gates.get("candidateGeneratorVersion"):
              raise SystemExit("RNN and Transformer candidate generator scope mismatch")
          if rnn_gates.get("directShopSourceApprovalKeys") != transformer_gates.get("directShopSourceApprovalKeys"):
              raise SystemExit("RNN and Transformer direct shop approval identity mismatch")
          if rnn_gates.get("directShopSourceValidationSubjectSha256") != transformer_gates.get("directShopSourceValidationSubjectSha256"):
              raise SystemExit("RNN and Transformer direct shop validation snapshot mismatch")
          report = {
              "contractVersion": "recommendation-pretraining-runner-attestation-v1",
              "status": "READY_TO_START_BEHAVIORAL_TRAINING",
              "datasetId": sys.argv[2],
              "datasetSha256": sys.argv[3].lower(),
              "manifestSha256": sys.argv[4].lower(),
              "sourceCommitSha": sys.argv[5].lower(),
              "directShopSourceValidation": "PASS",
              "directShopSourceApprovalKey": sys.argv[6],
              "directShopSourceValidationSubjectSha256": sys.argv[7].lower(),
              "candidateGeneratorVersion": rnn_gates.get("candidateGeneratorVersion"),
              "environmentReady": True,
              "immutableDatasetBytesVerified": True,
              "splitIsolationPassed": True,
              "rnnApiPreflightReady": True,
              "transformerApiPreflightReady": True,
              "trainingPerformed": False,
              "futureTestEvaluated": False,
              "nextAction": "Run Recommendation Behavioral Training with the exact same dataset ids and SHA values.",
          }
          (root / "final-readiness.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, sort_keys=True))
          PY

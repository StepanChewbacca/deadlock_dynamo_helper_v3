name: Recommendation Value V8 Bounded V5.2 V2

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-value-v8-bounded-v5-2-v2.json'

permissions:
  contents: read

concurrency:
  group: recommendation-value-v8-bounded-v5-2-v2
  cancel-in-progress: true

jobs:
  bounded-value-v2:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout requested implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate authorization, lineage, and budget
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-value-v8-bounded-v5-2-v2.json'
          test -s "$request"
          jq -e '
            .schemaVersion == 1 and
            .executorVersion == "FULL_PROPENSITY_STREAM_AUDIT_2" and
            .operation == "RECOMMENDATION_VALUE_V8_BOUNDED_V5_2" and
            .valueV8DiagnosticAuthorized == true and
            .maximumTrainingMinutes == 20 and
            .maxRows == 50000 and
            .fullValueV8TrainingAuthorized == false and
            .offlineVerificationAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowAuthorized == false and
            .randomizedCanaryAuthorized == false and
            .datasetDirectory == "recommendation-pro-decision-dataset-v6-terminal-5000-v2" and
            .outputDirectory == "recommendation-value-v8-diagnostic-v5-2-v2"
          ' "$request"
          node --check scripts/audit-recommendation-behavioral-v5-2-propensities.mjs
          node --check scripts/run-recommendation-value-v8-bounded-v5-2.mjs

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          dataset_name="$(jq -r '.datasetDirectory' "$request")"
          behavioral_name="$(jq -r '.behavioralDirectory' "$request")"
          output_name="$(jq -r '.outputDirectory' "$request")"
          dataset="$storage/$dataset_name"
          behavioral="$storage/$behavioral_name"
          output="$storage/$output_name"
          dataset_sha="$(jq -r '.expectedDatasetSha256' "$request")"
          behavioral_propensity_sha="$(jq -r '.expectedBehavioralPropensitySha256' "$request")"
          behavioral_manifest_sha="$(jq -r '.expectedBehavioralManifestSha256' "$request")"
          [[ "$dataset_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$behavioral_propensity_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$behavioral_manifest_sha" =~ ^[a-f0-9]{64}$ ]]

          sudo test -s "$dataset/manifest.json"
          sudo test -s "$dataset/audit.json"
          sudo test -s "$behavioral/manifest.json"
          sudo test -s "$behavioral/audit.json"
          sudo test -s "$behavioral/evaluation.json"
          test "$(sudo sha256sum "$dataset/$(sudo jq -r '.artifact.fileName' "$dataset/manifest.json")" | awk '{print $1}')" = "$dataset_sha"
          test "$(sudo sha256sum "$behavioral/manifest.json" | awk '{print $1}')" = "$behavioral_manifest_sha"
          propensity_file="$(sudo jq -r '.artifacts.propensities.fileName' "$behavioral/manifest.json")"
          test "$(sudo sha256sum "$behavioral/$propensity_file" | awk '{print $1}')" = "$behavioral_propensity_sha"
          sudo jq -e '
            .schemaVersion == 1 and
            .modelVersion == "RECOMMENDATION_BEHAVIORAL_V5_2_LOW_RANK_TWO_TOWER_1_RAW_PROPENSITY" and
            .featureVersion == "RECOMMENDATION_BEHAVIORAL_V5_2_FEATURES_1_TWO_TOWER" and
            .auditPassed == true and
            .releaseGatePassed == true and
            .trainingArtifactEligible == true and
            .build.fullCorpus == true and
            .trainingContract.propensityOutput == "RAW_SOFTMAX_WITHIN_DECISION" and
            .trainingContract.candidateProbabilityFloorApplied == false and
            .trainingContract.ipsClippingApplied == false and
            .trainingContract.futureTestUsedForTraining == false and
            .trainingContract.futureTestUsedForSelection == false and
            .trainingContract.futureTestEvaluated == false
          ' "$behavioral/manifest.json"
          sudo jq -e '.passed == true and .trainingArtifactEligible == true' "$behavioral/audit.json"
          sudo jq -e '.releaseGate.passed == true and .futureTestPolicy.evaluated == false' "$behavioral/evaluation.json"

          if sudo test -e "$output"; then
            echo "Refusing destructive reuse of existing output: $output" >&2
            exit 1
          fi
          sudo mkdir "$output"
          evidence_dir="$RUNNER_TEMP/recommendation-value-v8-bounded-v5-2-v2-$GITHUB_RUN_ID"
          mkdir -p "$evidence_dir"
          {
            echo "storage=$storage"
            echo "dataset_name=$dataset_name"
            echo "behavioral_name=$behavioral_name"
            echo "output_name=$output_name"
            echo "dataset_sha=$dataset_sha"
            echo "behavioral_propensity_sha=$behavioral_propensity_sha"
            echo "behavioral_manifest_sha=$behavioral_manifest_sha"
            echo "propensity_file=$propensity_file"
            echo "evidence_dir=$evidence_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Build isolated Value V8 image
        shell: bash
        run: |
          set -euo pipefail
          sudo docker build \
            --label deadlock.recommendation.operation=value-v8-bounded-v5-2-v2 \
            --label deadlock.recommendation.git-sha="$GITHUB_SHA" \
            -t "deadlock-value-v8-bounded-v5-2-v2:$GITHUB_RUN_ID" .

      - name: Audit full propensity artifact and run bounded Value within 20 minutes
        id: training
        shell: bash
        run: |
          set -uo pipefail
          storage='${{ steps.preflight.outputs.storage }}'
          dataset_name='${{ steps.preflight.outputs.dataset_name }}'
          behavioral_name='${{ steps.preflight.outputs.behavioral_name }}'
          output_name='${{ steps.preflight.outputs.output_name }}'
          propensity_file='${{ steps.preflight.outputs.propensity_file }}'
          evidence_dir='${{ steps.preflight.outputs.evidence_dir }}'
          image="deadlock-value-v8-bounded-v5-2-v2:$GITHUB_RUN_ID"
          container_name="deadlock-value-v8-bounded-v5-2-v2-$GITHUB_RUN_ID"

          set +e
          timeout --signal=TERM --kill-after=60s 20m sudo docker run --rm \
            --name "$container_name" \
            --stop-timeout 15 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -e NODE_OPTIONS=--max-old-space-size=6144 \
            -e VALUE_V8_V5_2_BOUNDED_REQUEST_PATH='/app/.github/training-requests/recommendation-value-v8-bounded-v5-2-v2.json' \
            -e DEADLOCK_RECOMMENDATION_VALUE_V8_DATASET_DIR="/app/apps/api/storage/$dataset_name" \
            -e DEADLOCK_RECOMMENDATION_VALUE_V8_BEHAVIORAL_DIR="/app/apps/api/storage/$behavioral_name" \
            -e DEADLOCK_RECOMMENDATION_VALUE_V8_DIAGNOSTIC_DIR="/app/apps/api/storage/$output_name" \
            -e VALUE_V8_BOUNDED_EVIDENCE_PATH='/evidence/value-v8-bounded-evidence.json' \
            -e BEHAVIORAL_V5_2_PROPENSITY_PATH="/app/apps/api/storage/$behavioral_name/$propensity_file" \
            -e EXPECTED_DATASET_SHA256='${{ steps.preflight.outputs.dataset_sha }}' \
            -e EXPECTED_BEHAVIORAL_PROPENSITY_SHA256='${{ steps.preflight.outputs.behavioral_propensity_sha }}' \
            -e EXPECTED_BEHAVIORAL_MANIFEST_SHA256='${{ steps.preflight.outputs.behavioral_manifest_sha }}' \
            -v "$storage/$dataset_name:/app/apps/api/storage/$dataset_name:ro" \
            -v "$storage/$behavioral_name:/app/apps/api/storage/$behavioral_name:ro" \
            -v "$storage/$output_name:/app/apps/api/storage/$output_name:rw" \
            -v "$evidence_dir:/evidence:rw" \
            "$image" sh -lc \
            'node /app/scripts/audit-recommendation-behavioral-v5-2-propensities.mjs && node /app/scripts/run-recommendation-value-v8-bounded-v5-2.mjs' \
            2>&1 | tee "$evidence_dir/container.log"
          training_exit="${PIPESTATUS[0]}"
          set -e
          if [ "$training_exit" = '124' ] || [ "$training_exit" = '137' ]; then
            sudo docker stop --time 15 "$container_name" >/dev/null 2>&1 || true
            sudo docker rm -f "$container_name" >/dev/null 2>&1 || true
          fi
          echo "exit_code=$training_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify bounded Value evidence
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.training.outputs.exit_code }}' = '0'
          evidence='${{ steps.preflight.outputs.evidence_dir }}/value-v8-bounded-evidence.json'
          test -s "$evidence"
          jq -e '
            .gateChecks.auditPassed == true and
            .gateChecks.diagnosticArtifactEligible == true and
            .gateChecks.diagnosticGatePassed == true and
            .gateChecks.fullTrainingRecommended == true and
            .gateChecks.diagnosticOnly == true and
            .gateChecks.maxRows == true and
            .gateChecks.futureNotTraining == true and
            .gateChecks.futureNotSelection == true and
            .gateChecks.futureNotEvaluated == true and
            .gateChecks.tuningNotTraining == true and
            .fullValueV8TrainingAuthorized == false and
            .offlineVerificationAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowAuthorized == false and
            .randomizedCanaryAuthorized == false
          ' "$evidence"

      - name: Upload bounded Value evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-value-v8-bounded-v5-2-v2-${{ github.run_id }}
          path: ${{ steps.preflight.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup transient container and image
        if: always()
        shell: bash
        run: |
          sudo docker rm -f "deadlock-value-v8-bounded-v5-2-v2-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          sudo docker image rm "deadlock-value-v8-bounded-v5-2-v2:$GITHUB_RUN_ID" >/dev/null 2>&1 || true

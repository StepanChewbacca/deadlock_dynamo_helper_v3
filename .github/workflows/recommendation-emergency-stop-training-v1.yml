name: Recommendation Emergency Stop Training V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-emergency-stop-training-v1.yml'
      - '.github/training-requests/recommendation-emergency-stop-training-v1.json'

permissions:
  contents: read

concurrency:
  group: recommendation-emergency-stop-training-v1
  cancel-in-progress: true

jobs:
  stop-training:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Stop all recommendation training workloads and persist local evidence
        shell: bash
        run: |
          set -euo pipefail
          training_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          evidence_root="$training_root/emergency-stop-evidence"
          evidence="$evidence_root/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          latest="$evidence_root/latest"
          pause_marker="$training_root/PAUSED_BY_USER"
          process_pattern='(node|bash|sh|docker)[^\n]*(scripts/[^ ]*(train|training|ablation|bounded-screen)|run-[^ ]*(train|training|ablation)|train-[^ ]*recommendation|behavioral[^ ]*(train|training|ablation|bounded-screen))'

          sudo mkdir -p "$training_root" "$evidence" "$evidence_root"
          sudo chown -R "$(id -u):$(id -g)" "$evidence_root"

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'generatedAt=%s\nrunId=%s\nrunAttempt=%s\n' \
            "$generated_at" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            | tee "$evidence/summary.txt"
          df -h | tee "$evidence/df-before.txt"
          sudo docker ps --no-trunc | tee "$evidence/docker-before.txt"
          sudo systemctl list-units --type=service --all --no-legend \
            | tee "$evidence/systemd-services-before.txt" >/dev/null
          sudo systemctl list-units --type=timer --all --no-legend \
            | tee "$evidence/systemd-timers-before.txt" >/dev/null
          ps -eo pid,ppid,user,etime,args --width 300 \
            | tee "$evidence/processes-before.txt" >/dev/null

          printf 'pausedAt=%s\npausedBy=github-actions\nreason=user-requested-emergency-stop\nrunId=%s\n' \
            "$generated_at" "$GITHUB_RUN_ID" \
            | sudo tee "$pause_marker" >/dev/null

          mapfile -t timers < <(
            sudo systemctl list-units --type=timer --all --no-legend 2>/dev/null \
              | awk '{print $1}' \
              | grep -Ei '(training|trainer|ablation)' || true
          )
          for unit in "${timers[@]}"; do
            [ -n "$unit" ] || continue
            echo "STOP timer $unit" | tee -a "$evidence/summary.txt"
            sudo systemctl stop "$unit" || true
          done

          mapfile -t services < <(
            sudo systemctl list-units --type=service --all --no-legend 2>/dev/null \
              | awk '{print $1}' \
              | grep -Ei '(training|trainer|ablation)' || true
          )
          for unit in "${services[@]}"; do
            [ -n "$unit" ] || continue
            echo "STOP service $unit" | tee -a "$evidence/summary.txt"
            sudo systemctl stop "$unit" || true
          done

          mapfile -t containers < <(
            sudo docker ps --format '{{.ID}} {{.Names}}' \
              | awk 'BEGIN{IGNORECASE=1} $0 ~ /(training|trainer|ablation)/ {print $1}' || true
          )
          for cid in "${containers[@]}"; do
            [ -n "$cid" ] || continue
            name="$(sudo docker inspect --format='{{.Name}}' "$cid" | sed 's#^/##')"
            echo "STOP container $name ($cid)" | tee -a "$evidence/summary.txt"
            sudo docker stop -t 20 "$cid" || true
          done

          mapfile -t pids < <(
            ps -eo pid=,args= --width 300 \
              | grep -Ei "$process_pattern" \
              | grep -Ev 'grep -E|actions-runner|Runner\.(Listener|Worker)|recommendation-emergency-stop-training-v1' \
              | awk '{print $1}' || true
          )
          for pid in "${pids[@]}"; do
            [ -n "$pid" ] || continue
            [ "$pid" != "$$" ] || continue
            [ "$pid" != "$PPID" ] || continue
            cmd="$(sudo ps -p "$pid" -o args= 2>/dev/null || true)"
            [ -n "$cmd" ] || continue
            echo "TERM process $pid $cmd" | tee -a "$evidence/summary.txt"
            sudo kill -TERM "$pid" 2>/dev/null || true
          done

          sleep 3
          for pid in "${pids[@]}"; do
            [ -n "$pid" ] || continue
            [ "$pid" != "$$" ] || continue
            [ "$pid" != "$PPID" ] || continue
            if sudo kill -0 "$pid" 2>/dev/null; then
              cmd="$(sudo ps -p "$pid" -o args= 2>/dev/null || true)"
              [ -n "$cmd" ] || continue
              echo "KILL process $pid $cmd" | tee -a "$evidence/summary.txt"
              sudo kill -KILL "$pid" 2>/dev/null || true
            fi
          done

          sudo docker ps --no-trunc | tee "$evidence/docker-after.txt"
          sudo systemctl list-units --type=service --state=running --no-legend \
            | tee "$evidence/systemd-services-after.txt" >/dev/null
          sudo systemctl list-units --type=timer --state=active --no-legend \
            | tee "$evidence/systemd-timers-after.txt" >/dev/null
          ps -eo pid,ppid,user,etime,args --width 300 \
            | tee "$evidence/processes-after.txt" >/dev/null
          df -h | tee "$evidence/df-after.txt"

          running_training_containers="$(sudo docker ps --format '{{.Names}}' | grep -Ei '(training|trainer|ablation)' || true)"
          running_training_services="$(sudo systemctl list-units --type=service --state=running --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          running_training_timers="$(sudo systemctl list-units --type=timer --state=active --no-legend 2>/dev/null | grep -Ei '(training|trainer|ablation)' || true)"
          running_training_processes="$(ps -eo pid=,args= --width 300 | grep -Ei "$process_pattern" | grep -Ev 'grep -E|actions-runner|Runner\.(Listener|Worker)|recommendation-emergency-stop-training-v1' || true)"

          {
            echo '--- remaining matching containers ---'
            printf '%s\n' "$running_training_containers"
            echo '--- remaining matching services ---'
            printf '%s\n' "$running_training_services"
            echo '--- remaining matching timers ---'
            printf '%s\n' "$running_training_timers"
            echo '--- remaining matching processes ---'
            printf '%s\n' "$running_training_processes"
          } | tee -a "$evidence/summary.txt"

          test -s "$pause_marker"
          test -z "$running_training_containers"
          test -z "$running_training_services"
          test -z "$running_training_timers"
          test -z "$running_training_processes"

          ln -sfn "runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$latest"
          sha256sum "$pause_marker" > "$evidence/pause-marker.sha256"
          printf 'emergencyStopPassed=true\ntrainingPaused=true\nevidencePath=%s\n' "$evidence" \
            | tee -a "$evidence/summary.txt"

name: Value V5 validation

on:
  pull_request:
    paths:
      - 'apps/api/src/deadlock-live/recommendation-value-v5-*'
      - 'apps/api/src/deadlock-live/recommendation-offline-split.ts'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/recommendation-value-v5-*'
      - 'docs/recommendation-value-v5.md'
      - '.github/workflows/value-v5-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn workspace @deadlock-live-probe/shared build
      - run: yarn workspace @deadlock-live-probe/build-domain build
      - run: yarn workspace @deadlock-live-probe/api build
      - run: yarn workspace @deadlock-live-probe/api test --runInBand recommendation-value-v5-core.spec.ts

name: Recommendation Production Recovery Inventory V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-production-recovery-inventory-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-production-recovery-inventory-v1
  cancel-in-progress: true

jobs:
  paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Recommendation production recovery inventory is paused.'

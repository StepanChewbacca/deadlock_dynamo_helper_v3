name: Recommendation Production Recovery Inventory V1

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-production-recovery-inventory-v1.yml'

permissions:
  contents: read

concurrency:
  group: recommendation-production-recovery-inventory-v1
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/recommendation-behavioral-v6-feasible-choice-set-1'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head for provenance only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Capture production recovery inventory
        shell: bash
        run: |
          set -euo pipefail
          target='/home/ubuntu/apps/deadlock_dynamo_helper'
          test -d "$target"
          test -r "$target/.env"
          mkdir -p "$RUNNER_TEMP/recovery-inventory/container-artifacts"

          {
            echo "generatedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "requestedHead=${{ github.event.pull_request.head.sha }}"
            echo "productionTarget=$target"
            if [ -d "$target/.git" ]; then
              echo "productionSourceHead=$(git -C "$target" rev-parse HEAD 2>/dev/null || true)"
            fi
          } > "$RUNNER_TEMP/recovery-inventory/provenance.txt"

          df -h > "$RUNNER_TEMP/recovery-inventory/df-h.txt"
          sudo docker ps -a --no-trunc > "$RUNNER_TEMP/recovery-inventory/docker-ps-a.txt"
          sudo docker images --no-trunc --digests > "$RUNNER_TEMP/recovery-inventory/docker-images.txt"
          sudo docker volume ls > "$RUNNER_TEMP/recovery-inventory/docker-volumes.txt"

          cd "$target"
          sudo docker compose --env-file .env ps --format json > "$RUNNER_TEMP/recovery-inventory/compose-ps.json" 2>/dev/null || printf '[]\n' > "$RUNNER_TEMP/recovery-inventory/compose-ps.json"
          sudo docker compose --env-file .env config > "$RUNNER_TEMP/recovery-inventory/compose-config.yml"

          api_container="$(sudo docker compose --env-file .env ps -q api 2>/dev/null || true)"
          printf '%s\n' "$api_container" > "$RUNNER_TEMP/recovery-inventory/current-api-container.txt"
          if [ -n "$api_container" ]; then
            sudo docker inspect "$api_container" > "$RUNNER_TEMP/recovery-inventory/current-api-inspect.json"
            sudo docker inspect --format='{{.Image}}' "$api_container" > "$RUNNER_TEMP/recovery-inventory/current-api-image.txt"
            sudo docker inspect --format='{{json .Mounts}}' "$api_container" | jq . > "$RUNNER_TEMP/recovery-inventory/current-api-mounts.json"
            sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$api_container" > "$RUNNER_TEMP/recovery-inventory/current-api-health.txt"

            sudo docker compose --env-file .env exec -T api sh -lc '
              set -eu
              echo "storage-root:"; ls -la /app/apps/api/storage || true
              echo "contextual-v3-training:"; ls -la /app/apps/api/storage/contextual-v3-training || true
              if [ -f /app/apps/api/storage/contextual-v3-training/manifest.json ]; then
                sha256sum /app/apps/api/storage/contextual-v3-training/manifest.json
                cat /app/apps/api/storage/contextual-v3-training/manifest.json
              fi
            ' > "$RUNNER_TEMP/recovery-inventory/current-api-storage.txt" 2>&1 || true
          else
            printf '[]\n' > "$RUNNER_TEMP/recovery-inventory/current-api-inspect.json"
            printf '[]\n' > "$RUNNER_TEMP/recovery-inventory/current-api-mounts.json"
            : > "$RUNNER_TEMP/recovery-inventory/current-api-image.txt"
            printf 'missing\n' > "$RUNNER_TEMP/recovery-inventory/current-api-health.txt"
            printf 'api container missing\n' > "$RUNNER_TEMP/recovery-inventory/current-api-storage.txt"
          fi

          sudo find /var/lib/docker/volumes -type f -path '*/contextual-v3-training/manifest.json' -print 2>/dev/null \
            | sort > "$RUNNER_TEMP/recovery-inventory/volume-manifests.txt"
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            printf '%s  ' "$manifest"
            sudo sha256sum "$manifest" | awk '{print $1}'
          done < "$RUNNER_TEMP/recovery-inventory/volume-manifests.txt" \
            > "$RUNNER_TEMP/recovery-inventory/volume-manifest-sha256.txt"

          sudo find "$target" -type f -path '*/contextual-v3-training/manifest.json' -print 2>/dev/null \
            | sort > "$RUNNER_TEMP/recovery-inventory/source-manifests.txt"

          # docker cp is read-only for container files and also works for stopped containers.
          # Inspect every existing container for a retained contextual-v3 artifact without starting it.
          : > "$RUNNER_TEMP/recovery-inventory/container-manifests.tsv"
          for cid in $(sudo docker ps -aq); do
            name="$(sudo docker inspect --format='{{.Name}}' "$cid" | sed 's#^/##')"
            image="$(sudo docker inspect --format='{{.Image}}' "$cid")"
            out="$RUNNER_TEMP/recovery-inventory/container-artifacts/${cid}.manifest.json"
            if sudo docker cp "$cid:/app/apps/api/storage/contextual-v3-training/manifest.json" "$out" >/dev/null 2>&1; then
              sha="$(sha256sum "$out" | awk '{print $1}')"
              printf '%s\t%s\t%s\t%s\n' "$cid" "$name" "$image" "$sha" >> "$RUNNER_TEMP/recovery-inventory/container-manifests.tsv"
            fi
          done

          if [ -n "$api_container" ]; then
            sudo docker compose --env-file .env exec -T api node - <<'NODE' > "$RUNNER_TEMP/recovery-inventory/recommendation-status.json"
          async function get(url) {
            try {
              const response = await fetch(url);
              const text = await response.text();
              let body;
              try { body = JSON.parse(text); } catch { body = { rawText: text }; }
              return { url, httpStatus: response.status, httpOk: response.ok, body };
            } catch (error) {
              return { url, httpOk: false, error: error instanceof Error ? error.message : String(error) };
            }
          }
          (async () => {
            const contextualV3 = await get('http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status');
            const liveBuildRecommendations = await get('http://127.0.0.1:3000/deadlock/live/build-recommendations/status');
            process.stdout.write(JSON.stringify({ contextualV3, liveBuildRecommendations }, null, 2) + '\n');
          })();
          NODE
          else
            printf '{"error":"api container missing"}\n' > "$RUNNER_TEMP/recovery-inventory/recommendation-status.json"
          fi

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg requestedHead '${{ github.event.pull_request.head.sha }}' \
            --arg apiContainerId "$api_container" \
            --arg apiImageId "$(cat "$RUNNER_TEMP/recovery-inventory/current-api-image.txt")" \
            --arg apiHealth "$(cat "$RUNNER_TEMP/recovery-inventory/current-api-health.txt")" \
            --argjson volumeManifestCount "$(wc -l < "$RUNNER_TEMP/recovery-inventory/volume-manifests.txt")" \
            --argjson containerManifestCount "$(wc -l < "$RUNNER_TEMP/recovery-inventory/container-manifests.tsv")" \
            '{
              schemaVersion: 1,
              operation: "RECOMMENDATION_PRODUCTION_RECOVERY_INVENTORY",
              generatedAt: $generatedAt,
              requestedHead: $requestedHead,
              apiContainerId: (if $apiContainerId == "" then null else $apiContainerId end),
              apiImageId: (if $apiImageId == "" then null else $apiImageId end),
              apiHealth: $apiHealth,
              volumeManifestCount: $volumeManifestCount,
              containerManifestCount: $containerManifestCount,
              productionMutationPerformed: false,
              trainingPerformed: false,
              valueTrainingPerformed: false,
              futureTestEvaluated: false
            }' > "$RUNNER_TEMP/recovery-inventory/summary.json"

          cat "$RUNNER_TEMP/recovery-inventory/summary.json"
          echo '--- volume manifests ---'
          cat "$RUNNER_TEMP/recovery-inventory/volume-manifest-sha256.txt"
          echo '--- container manifests ---'
          cat "$RUNNER_TEMP/recovery-inventory/container-manifests.tsv"
          echo '--- recommendation status ---'
          cat "$RUNNER_TEMP/recovery-inventory/recommendation-status.json"

      - name: Upload recovery inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-production-recovery-inventory-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-inventory
          if-no-files-found: error
          retention-days: 14

name: Recommendation Behavioral V5.2 Bounded V5 Detached Trigger

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-behavioral-v5-2-bounded-v5-detached.json'

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-v5-2-bounded-v5-detached
  cancel-in-progress: false

jobs:
  trigger-training:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout requested implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for preflight
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate authorization and immutable lineage
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          request='.github/training-requests/recommendation-behavioral-v5-2-bounded-v5-detached.json'
          test -s "$request"

          jq -e '
            .schemaVersion == 5 and
            .operation == "RECOMMENDATION_BEHAVIORAL_V5_2_BOUNDED_ARCHITECTURE_SWEEP" and
            .executorVersion == "ELIGIBILITY_FILTERED_2" and
            .launcherVersion == "DETACHED_DOCKER_TRIGGER_1" and
            .actionTriggerOnlyAuthorized == true and
            .trainingProcessBoundToActionLifetime == false and
            .boundedArchitectureSweepAuthorized == true and
            .boundedRefinementAuthorized == false and
            .fullTrainingAuthorized == false and
            .valueV8TrainingAuthorized == false and
            .productionRankingChanged == false and
            .passiveShadowAuthorized == false and
            .randomizedCanaryAuthorized == false and
            .auditThresholdsLowered == false and
            .sourceDirectory == "recommendation-pro-decision-dataset-v6-terminal-5000-v2" and
            .sampleDirectory == "recommendation-behavioral-v5-1-sweep-b-v1" and
            .v51SweepSummaryDirectory == "recommendation-behavioral-v5-1-sweep-v1" and
            .outputDirectory == "recommendation-behavioral-v5-2-bounded-v5-detached-1" and
            .expectedDatasetSha256 == "e8b11e26df37ff1e17b334eda18ea2141cfb7fa78f0a34eaf95d448c22962235" and
            .expectedDiagnosticSampleSha256 == "8d87519d797b54fc3f726837e80bb79968b44dc59960dadcb934261f329ce1ac" and
            .expectedV51SweepSummarySha256 == "0e06b01e8f33257754d6994a10411b5b76da16d07d17c2fc6c7c236b776d4f4e" and
            .eligibilityFilteringAppliedAfterPinnedSampleVerification == true
          ' "$request"

          node --check scripts/run-recommendation-behavioral-v5-2-bounded-v2.mjs

          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          source_name="$(jq -r '.sourceDirectory' "$request")"
          sample_name="$(jq -r '.sampleDirectory' "$request")"
          v51_name="$(jq -r '.v51SweepSummaryDirectory' "$request")"
          output_name="$(jq -r '.outputDirectory' "$request")"

          source="$storage/$source_name"
          sample="$storage/$sample_name/diagnostic-sample.ndjson.gz"
          v51_summary="$storage/$v51_name/sweep-summary.json"
          output="$storage/$output_name"

          sudo test -s "$source/manifest.json"
          sudo test -s "$source/audit.json"
          sudo test -s "$sample"
          sudo test -s "$v51_summary"

          dataset_file="$(sudo jq -r '.artifact.fileName' "$source/manifest.json")"
          test "$(sudo sha256sum "$source/$dataset_file" | awk '{print $1}')" = 'e8b11e26df37ff1e17b334eda18ea2141cfb7fa78f0a34eaf95d448c22962235'
          test "$(sudo sha256sum "$sample" | awk '{print $1}')" = '8d87519d797b54fc3f726837e80bb79968b44dc59960dadcb934261f329ce1ac'
          test "$(sudo sha256sum "$v51_summary" | awk '{print $1}')" = '0e06b01e8f33257754d6994a10411b5b76da16d07d17c2fc6c7c236b776d4f4e'
          sudo jq -e '.auditPassed == true and .trainingArtifactEligible == true' "$source/manifest.json"
          sudo jq -e '.passed == true and .trainingArtifactEligible == true' "$source/audit.json"

          free_bytes="$(sudo df -B1 --output=avail "$storage" | tail -n 1 | tr -d ' ')"
          reserve_bytes=$((12 * 1024 * 1024 * 1024))
          test "$free_bytes" -gt "$reserve_bytes"

          if sudo docker ps --format '{{.Names}}' | grep -Eq '^deadlock-behavioral-v5-2-bounded-v5-detached-'; then
            echo 'A detached V5.2 bounded training container is already running.' >&2
            exit 1
          fi

          if sudo test -e "$output"; then
            echo "Refusing destructive reuse of existing output: $output" >&2
            exit 1
          fi

          sudo mkdir "$output"

          request_sha256="$(sha256sum "$request" | awk '{print $1}')"
          {
            printf 'runId=%s\n' "$GITHUB_RUN_ID"
            printf 'gitSha=%s\n' "$GITHUB_SHA"
            printf 'launcherVersion=DETACHED_DOCKER_TRIGGER_1\n'
            printf 'requestSha256=%s\n' "$request_sha256"
            printf 'sourceDirectory=%s\n' "$source_name"
            printf 'sampleDirectory=%s\n' "$sample_name"
            printf 'v51SweepSummaryDirectory=%s\n' "$v51_name"
            printf 'outputDirectory=%s\n' "$output_name"
          } | sudo tee "$output/launch-request.txt" >/dev/null

          {
            echo "storage=$storage"
            echo "source_name=$source_name"
            echo "sample_name=$sample_name"
            echo "v51_name=$v51_name"
            echo "output_name=$output_name"
          } >> "$GITHUB_OUTPUT"

      - name: Build isolated Behavioral V5.2 image
        shell: bash
        run: |
          set -euo pipefail
          sudo docker build \
            --label deadlock.recommendation.operation=behavioral-v5-2-bounded-v5-detached \
            --label deadlock.recommendation.git-sha="$GITHUB_SHA" \
            -t "deadlock-behavioral-v5-2-bounded-v5-detached:$GITHUB_RUN_ID" \
            .

      - name: Launch detached training on VPS
        id: launch
        shell: bash
        run: |
          set -euo pipefail

          storage='${{ steps.preflight.outputs.storage }}'
          source_name='${{ steps.preflight.outputs.source_name }}'
          sample_name='${{ steps.preflight.outputs.sample_name }}'
          v51_name='${{ steps.preflight.outputs.v51_name }}'
          output_name='${{ steps.preflight.outputs.output_name }}'

          image="deadlock-behavioral-v5-2-bounded-v5-detached:$GITHUB_RUN_ID"
          container_name="deadlock-behavioral-v5-2-bounded-v5-detached-$GITHUB_RUN_ID"
          output="$storage/$output_name"

          container_id="$(sudo docker run -d \
            --name "$container_name" \
            --stop-timeout 30 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --label deadlock.recommendation.operation=behavioral-v5-2-bounded-v5-detached \
            --label deadlock.recommendation.workflow-run-id="$GITHUB_RUN_ID" \
            --label deadlock.recommendation.output-directory="$output_name" \
            -e NODE_OPTIONS=--max-old-space-size=6144 \
            -e DEADLOCK_RECOMMENDATION_BEHAVIORAL_V5_2_SOURCE_DIR="/app/apps/api/storage/$source_name" \
            -e BEHAVIORAL_V5_2_SAMPLE_PATH="/app/apps/api/storage/$sample_name/diagnostic-sample.ndjson.gz" \
            -e BEHAVIORAL_V5_1_SWEEP_SUMMARY_PATH="/app/apps/api/storage/$v51_name/sweep-summary.json" \
            -e BEHAVIORAL_V5_2_OUTPUT_DIR="/app/apps/api/storage/$output_name" \
            -e TRAINING_OUTPUT_DIR="/app/apps/api/storage/$output_name" \
            -e EXPECTED_DATASET_SHA256='e8b11e26df37ff1e17b334eda18ea2141cfb7fa78f0a34eaf95d448c22962235' \
            -e EXPECTED_DIAGNOSTIC_SAMPLE_SHA256='8d87519d797b54fc3f726837e80bb79968b44dc59960dadcb934261f329ce1ac' \
            -e EXPECTED_V5_1_SWEEP_SUMMARY_SHA256='0e06b01e8f33257754d6994a10411b5b76da16d07d17c2fc6c7c236b776d4f4e' \
            -v "$storage/$source_name:/app/apps/api/storage/$source_name:ro" \
            -v "$storage/$sample_name:/app/apps/api/storage/$sample_name:ro" \
            -v "$storage/$v51_name:/app/apps/api/storage/$v51_name:ro" \
            -v "$storage/$output_name:/app/apps/api/storage/$output_name:rw" \
            "$image" \
            sh -lc 'set +e; node /app/scripts/run-recommendation-behavioral-v5-2-bounded-v2.mjs > "$TRAINING_OUTPUT_DIR/container.log" 2>&1; code=$?; printf "%s\n" "$code" > "$TRAINING_OUTPUT_DIR/training-exit-code.txt"; exit "$code"')"

          printf '%s\n' "$container_id" | sudo tee "$output/container-id.txt" >/dev/null
          printf '%s\n' "$container_name" | sudo tee "$output/container-name.txt" >/dev/null
          printf '%s\n' "$image" | sudo tee "$output/image-name.txt" >/dev/null
          date -u +'%Y-%m-%dT%H:%M:%SZ' | sudo tee "$output/launched-at.txt" >/dev/null

          sleep 3

          running="$(sudo docker inspect --format='{{.State.Running}}' "$container_name")"
          oom_killed="$(sudo docker inspect --format='{{.State.OOMKilled}}' "$container_name")"

          test "$running" = 'true'
          test "$oom_killed" = 'false'

          {
            printf 'containerName=%s\n' "$container_name"
            printf 'containerId=%s\n' "$container_id"
            printf 'running=%s\n' "$running"
            printf 'oomKilled=%s\n' "$oom_killed"
          } | sudo tee "$output/launch-status.txt" >/dev/null

          echo "container_name=$container_name" >> "$GITHUB_OUTPUT"
          echo "container_id=$container_id" >> "$GITHUB_OUTPUT"

      - name: Confirm trigger completed
        shell: bash
        run: |
          set -euo pipefail
          echo "Detached training container: ${{ steps.launch.outputs.container_name }}"
          echo "Container ID: ${{ steps.launch.outputs.container_id }}"
          echo 'GitHub Actions trigger is complete. Training continues independently on the VPS.'

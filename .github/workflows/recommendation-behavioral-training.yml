name: Recommendation Behavioral Training

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: Verified Recommendation Dataset V8 registry id
        required: true
        type: string
      dataset_dir:
        description: Pre-staged immutable dataset directory on the secure training runner
        required: true
        type: string
      expected_dataset_sha256:
        description: Expected immutable dataset SHA256
        required: true
        type: string
      expected_manifest_sha256:
        description: Expected canonical manifest SHA256 from the dataset registry
        required: true
        type: string
      model_version_prefix:
        description: Optional immutable version prefix; defaults to the workflow run identity
        required: false
        type: string
      action_contract_version:
        description: Action contract used by the dataset
        required: true
        default: recommendation-actions-v1
        type: string

permissions:
  contents: read

concurrency:
  group: recommendation-behavioral-training
  cancel-in-progress: false

jobs:
  train-buildlm:
    environment: recommendation-training
    runs-on: [self-hosted, linux, x64, recommendation-training]
    timeout-minutes: 360
    env:
      DATASET_ID: ${{ inputs.dataset_id }}
      DATASET_DIR: ${{ inputs.dataset_dir }}
      EXPECTED_DATASET_SHA256: ${{ inputs.expected_dataset_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
      MODEL_VERSION_PREFIX_INPUT: ${{ inputs.model_version_prefix }}
      ACTION_CONTRACT_VERSION: ${{ inputs.action_contract_version }}
      TRAINING_PREFLIGHT_URL: ${{ vars.RECOMMENDATION_TRAINING_PREFLIGHT_URL }}
      TRAINING_TOKEN: ${{ secrets.RECOMMENDATION_TRAINING_TOKEN }}
    steps:
      - name: Checkout frozen training code
        uses: actions/checkout@v4

      - name: Validate secure runner contract and inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RECOMMENDATION_TRAINING_OUTPUT_ROOT:-}" || { echo "RECOMMENDATION_TRAINING_OUTPUT_ROOT is required on the secure runner" >&2; exit 1; }
          test -n "${RECOMMENDATION_DATASET_STAGING_ROOT:-}" || { echo "RECOMMENDATION_DATASET_STAGING_ROOT is required on the secure runner" >&2; exit 1; }
          test -n "${RECOMMENDATION_TRAINING_WHEELHOUSE:-}" || { echo "RECOMMENDATION_TRAINING_WHEELHOUSE is required on the secure runner" >&2; exit 1; }
          test -n "$TRAINING_PREFLIGHT_URL" || { echo "RECOMMENDATION_TRAINING_PREFLIGHT_URL repository/environment variable is required" >&2; exit 1; }
          test -n "$TRAINING_TOKEN" || { echo "RECOMMENDATION_TRAINING_TOKEN environment secret is required" >&2; exit 1; }
          case "$TRAINING_PREFLIGHT_URL" in
            */preflight) TRAINING_FINAL_READINESS_URL="${TRAINING_PREFLIGHT_URL%/preflight}/final-readiness" ;;
            *) echo "RECOMMENDATION_TRAINING_PREFLIGHT_URL must end with /preflight" >&2; exit 1 ;;
          esac
          [[ "$DATASET_ID" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "dataset_id contains unsafe characters" >&2; exit 1; }
          [[ "$EXPECTED_DATASET_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "expected_dataset_sha256 is invalid" >&2; exit 1; }
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "expected_manifest_sha256 is invalid" >&2; exit 1; }
          [[ "$ACTION_CONTRACT_VERSION" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "action_contract_version contains unsafe characters" >&2; exit 1; }
          case "$RECOMMENDATION_TRAINING_OUTPUT_ROOT" in /*) ;; *) echo "RECOMMENDATION_TRAINING_OUTPUT_ROOT must be absolute" >&2; exit 1;; esac
          case "$RECOMMENDATION_DATASET_STAGING_ROOT" in /*) ;; *) echo "RECOMMENDATION_DATASET_STAGING_ROOT must be absolute" >&2; exit 1;; esac
          case "$RECOMMENDATION_TRAINING_WHEELHOUSE" in /*) ;; *) echo "RECOMMENDATION_TRAINING_WHEELHOUSE must be absolute" >&2; exit 1;; esac
          OUTPUT_ROOT="$(realpath -e "$RECOMMENDATION_TRAINING_OUTPUT_ROOT")"
          STAGING_ROOT="$(realpath -e "$RECOMMENDATION_DATASET_STAGING_ROOT")"
          WHEELHOUSE="$(realpath -e "$RECOMMENDATION_TRAINING_WHEELHOUSE")"
          DATASET_REAL="$(realpath -e "$DATASET_DIR")"
          test -d "$OUTPUT_ROOT" && test -w "$OUTPUT_ROOT" || { echo "Training output root must be a writable directory" >&2; exit 1; }
          test -d "$STAGING_ROOT" || { echo "Dataset staging root must be a directory" >&2; exit 1; }
          test -d "$WHEELHOUSE" || { echo "Training wheelhouse must be a directory" >&2; exit 1; }
          test -d "$DATASET_REAL" || { echo "Dataset directory does not exist" >&2; exit 1; }
          case "$DATASET_REAL" in "$STAGING_ROOT"/*) ;; *) echo "Dataset directory must be inside RECOMMENDATION_DATASET_STAGING_ROOT" >&2; exit 1;; esac
          RUN_ROOT="$OUTPUT_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$RUN_ROOT" || { echo "Training run output already exists: $RUN_ROOT" >&2; exit 1; }
          mkdir "$RUN_ROOT"
          echo "RUN_ROOT=$RUN_ROOT" >> "$GITHUB_ENV"
          echo "DATASET_DIR=$DATASET_REAL" >> "$GITHUB_ENV"
          echo "TRAINING_WHEELHOUSE=$WHEELHOUSE" >> "$GITHUB_ENV"
          echo "TRAINING_FINAL_READINESS_URL=$TRAINING_FINAL_READINESS_URL" >> "$GITHUB_ENV"
          PREFIX="$MODEL_VERSION_PREFIX_INPUT"
          if [ -z "$PREFIX" ]; then PREFIX="buildlm-v8-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
          [[ "$PREFIX" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "model_version_prefix contains unsafe characters" >&2; exit 1; }
          echo "MODEL_VERSION_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create isolated training environment from approved wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUN_ROOT/venv"
          "$RUN_ROOT/venv/bin/pip" install --no-index --find-links "$TRAINING_WHEELHOUSE" -r training/recommendation_v8/requirements-training.txt

      - name: Recheck training runtime and CUDA device
        shell: bash
        env:
          PYTHONHASHSEED: '0'
          CUBLAS_WORKSPACE_CONFIG: ':4096:8'
        run: |
          set -euo pipefail
          "$RUN_ROOT/venv/bin/python" training/recommendation_v8/pretraining_environment_check.py \
            | tee "$RUN_ROOT/environment-readiness.json"

      - name: Verify immutable dataset bytes and frozen identity
        shell: bash
        run: |
          set -euo pipefail
          "$RUN_ROOT/venv/bin/python" training/recommendation_v8/verify_dataset.py \
            --dataset-dir "$DATASET_DIR" \
            --expected-dataset-sha256 "$EXPECTED_DATASET_SHA256" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            | tee "$RUN_ROOT/dataset-verification.json"
          "$RUN_ROOT/venv/bin/python" - "$DATASET_DIR" "$ACTION_CONTRACT_VERSION" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          manifest = json.loads((pathlib.Path(sys.argv[1]) / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("actionContractVersion") != sys.argv[2]:
              raise SystemExit("Dataset action contract mismatch")
          source_commit = manifest.get("sourceCommitSha")
          if not isinstance(source_commit, str) or source_commit.lower() != sys.argv[3].lower():
              raise SystemExit("Training workflow commit does not match immutable dataset sourceCommitSha")
          if manifest.get("futureTestTouched") is not False:
              raise SystemExit("FUTURE_TEST is not untouched")
          keys = manifest.get("directShopSourceApprovalKeys")
          if not isinstance(keys, list) or len(keys) != 1 or not isinstance(keys[0], str) or not keys[0]:
              raise SystemExit("Dataset must bind exactly one validated direct shop source approval key")
          subject = manifest.get("directShopSourceValidationSubjectSha256")
          if not isinstance(subject, str) or len(subject) != 64 or any(c not in "0123456789abcdefABCDEF" for c in subject):
              raise SystemExit("Dataset direct shop validation subject SHA is invalid")
          PY
          DIRECT_SHOP_APPROVAL_KEY="$("$RUN_ROOT/venv/bin/python" -c 'import json, os, pathlib; print(json.loads((pathlib.Path(os.environ["DATASET_DIR"]) / "manifest.json").read_text())["directShopSourceApprovalKeys"][0])')"
          DIRECT_SHOP_VALIDATION_SUBJECT_SHA256="$("$RUN_ROOT/venv/bin/python" -c 'import json, os, pathlib; print(json.loads((pathlib.Path(os.environ["DATASET_DIR"]) / "manifest.json").read_text())["directShopSourceValidationSubjectSha256"])')"
          echo "DIRECT_SHOP_APPROVAL_KEY=$DIRECT_SHOP_APPROVAL_KEY" >> "$GITHUB_ENV"
          echo "DIRECT_SHOP_VALIDATION_SUBJECT_SHA256=$DIRECT_SHOP_VALIDATION_SUBJECT_SHA256" >> "$GITHUB_ENV"

      - name: Require final server-owned readiness before optimizer steps
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="$RUN_ROOT/final-readiness-request.json"
          RESPONSE_FILE="$RUN_ROOT/final-readiness-server.json"
          "$RUN_ROOT/venv/bin/python" - "$REQUEST_FILE" <<'PY'
          import json, os, sys
          request = {
              "rnnConfig": json.load(open("training/recommendation_v8/config/rnn.json", encoding="utf-8")),
              "transformerConfig": json.load(open("training/recommendation_v8/config/transformer.json", encoding="utf-8")),
              "runner": {
                  "expectedDatasetSha256": os.environ["EXPECTED_DATASET_SHA256"],
                  "expectedManifestSha256": os.environ["EXPECTED_MANIFEST_SHA256"],
                  "sourceCommitSha": os.environ["GITHUB_SHA"],
                  "splitIsolationPassed": True,
                  "immutableDatasetBytesVerified": True,
                  "offlineWheelhouseReady": True,
                  "trainingDeviceReady": True,
              },
          }
          with open(sys.argv[1], "x", encoding="utf-8") as handle:
              json.dump(request, handle, separators=(",", ":"), sort_keys=True)
              handle.write("\n")
          PY
          curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            -H "x-recommendation-training-token: $TRAINING_TOKEN" \
            --data-binary "@$REQUEST_FILE" \
            "$TRAINING_FINAL_READINESS_URL/$DATASET_ID" \
            > "$RESPONSE_FILE"
          TRAINING_READINESS_SUBJECT_SHA256="$("$RUN_ROOT/venv/bin/python" - "$RESPONSE_FILE" "$EXPECTED_DATASET_SHA256" "$EXPECTED_MANIFEST_SHA256" "$GITHUB_SHA" "$DIRECT_SHOP_APPROVAL_KEY" "$DIRECT_SHOP_VALIDATION_SUBJECT_SHA256" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("ready") is not True:
              raise SystemExit("Final Behavioral readiness blocked: " + ",".join(data.get("blockers", [])))
          if (data.get("finalReadiness") or {}).get("readyToStartBehavioralTraining") is not True:
              raise SystemExit("Shared final readiness contract did not authorize Behavioral training")
          if (data.get("pairValidation") or {}).get("valid") is not True:
              raise SystemExit("RNN/Transformer equal-observables pair is invalid")
          if str(data.get("datasetSha256", "")).lower() != sys.argv[2].lower():
              raise SystemExit("Final readiness dataset SHA mismatch")
          if str(data.get("manifestSha256", "")).lower() != sys.argv[3].lower():
              raise SystemExit("Final readiness manifest SHA mismatch")
          if str(data.get("sourceCommitSha", "")).lower() != sys.argv[4].lower():
              raise SystemExit("Final readiness source commit mismatch")
          if data.get("trainingPerformed") is not False or data.get("futureTestEvaluated") is not False:
              raise SystemExit("Final readiness is not pre-training/pre-FUTURE_TEST")
          for name in ["rnnPreflight", "transformerPreflight"]:
              preflight = data.get(name) or {}
              if preflight.get("ready") is not True:
                  raise SystemExit(f"{name} is not ready")
              gates = preflight.get("currentDataGates") or {}
              if gates.get("directShopSourceValidation") != "PASS":
                  raise SystemExit(f"{name} direct shop validation is not PASS")
              if gates.get("directShopSourceApprovalKeys") != [sys.argv[5]]:
                  raise SystemExit(f"{name} direct shop approval identity mismatch")
              if str(gates.get("directShopSourceValidationSubjectSha256", "")).lower() != sys.argv[6].lower():
                  raise SystemExit(f"{name} direct shop validation snapshot mismatch")
          subject = str(data.get("readinessSubjectSha256", ""))
          if not re.fullmatch(r"[a-fA-F0-9]{64}", subject):
              raise SystemExit("Final readiness subject SHA is invalid")
          print(subject)
          PY
          )"
          [[ "$TRAINING_READINESS_SUBJECT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Training readiness subject SHA is invalid" >&2; exit 1; }
          echo "TRAINING_READINESS_SUBJECT_SHA256=$TRAINING_READINESS_SUBJECT_SHA256" >> "$GITHUB_ENV"

      - name: Train RNN baseline
        shell: bash
        env:
          PYTHONHASHSEED: '0'
          CUBLAS_WORKSPACE_CONFIG: ':4096:8'
        run: |
          set -euo pipefail
          set +e
          "$RUN_ROOT/venv/bin/python" training/recommendation_v8/train_behavioral.py \
            --dataset-dir "$DATASET_DIR" \
            --config training/recommendation_v8/config/rnn.json \
            --output-dir "$RUN_ROOT/rnn" \
            --model-id deadlock-buildlm-behavioral-v8 \
            --model-version "$MODEL_VERSION_PREFIX-rnn" \
            --source-commit-sha "$GITHUB_SHA" \
            --expected-dataset-sha256 "$EXPECTED_DATASET_SHA256" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 2 ]; then exit "$STATUS"; fi
          echo "RNN_GATE_EXIT=$STATUS" >> "$GITHUB_ENV"

      - name: Train Transformer BuildLM candidate
        shell: bash
        env:
          PYTHONHASHSEED: '0'
          CUBLAS_WORKSPACE_CONFIG: ':4096:8'
        run: |
          set -euo pipefail
          set +e
          "$RUN_ROOT/venv/bin/python" training/recommendation_v8/train_behavioral.py \
            --dataset-dir "$DATASET_DIR" \
            --config training/recommendation_v8/config/transformer.json \
            --output-dir "$RUN_ROOT/transformer" \
            --model-id deadlock-buildlm-behavioral-v8 \
            --model-version "$MODEL_VERSION_PREFIX-transformer" \
            --source-commit-sha "$GITHUB_SHA" \
            --expected-dataset-sha256 "$EXPECTED_DATASET_SHA256" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 2 ]; then exit "$STATUS"; fi
          echo "TRANSFORMER_GATE_EXIT=$STATUS" >> "$GITHUB_ENV"

      - name: Compare equal-observables architectures
        shell: bash
        run: |
          set -euo pipefail
          "$RUN_ROOT/venv/bin/python" training/recommendation_v8/compare_behavioral.py \
            --rnn-metrics "$RUN_ROOT/rnn/metrics.json" \
            --transformer-metrics "$RUN_ROOT/transformer/metrics.json" \
            --output "$RUN_ROOT/ablation-report.json"

      - name: Build immutable Transformer model bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$TRANSFORMER_GATE_EXIT" -eq 0 || { echo "Transformer Behavioral gate failed" >&2; exit 1; }
          "$RUN_ROOT/venv/bin/python" training/recommendation_v8/build_model_bundle.py \
            --training-output "$RUN_ROOT/transformer" \
            --dataset-dir "$DATASET_DIR" \
            --ablation-report "$RUN_ROOT/ablation-report.json" \
            --bundle-dir "$RUN_ROOT/bundle" \
            --action-contract-version "$ACTION_CONTRACT_VERSION" \
            --source-commit-sha "$GITHUB_SHA"

      - name: Emit immutable staging summary
        shell: bash
        run: |
          set -euo pipefail
          "$RUN_ROOT/venv/bin/python" - "$RUN_ROOT" "$TRAINING_READINESS_SUBJECT_SHA256" "$EXPECTED_DATASET_SHA256" "$EXPECTED_MANIFEST_SHA256" "$GITHUB_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = root / "bundle" / "manifest.json"
          raw = manifest.read_bytes()
          summary = {
              "status": "TRAINING_COMPLETE_NOT_ACTIVATED",
              "runRoot": str(root),
              "bundleManifest": str(manifest),
              "bundleManifestSha256Bytes": hashlib.sha256(raw).hexdigest(),
              "trainingReadinessSubjectSha256": sys.argv[2].lower(),
              "datasetSha256": sys.argv[3].lower(),
              "datasetManifestSha256": sys.argv[4].lower(),
              "sourceCommitSha": sys.argv[5].lower(),
              "nextRequiredStep": "Upload bundle to approved immutable artifact store, register, independently verify hashes, then activate only with required serving gates.",
              "futureTestEvaluated": False,
          }
          (root / "run-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, sort_keys=True))
          PY

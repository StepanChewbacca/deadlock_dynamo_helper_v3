name: V6 CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build
      - name: Build domain package
        run: yarn workspace @deadlock-live-probe/build-domain build
      - name: Build API
        run: yarn workspace @deadlock-live-probe/api build
      - name: Test Recommendation Value V6 integration
        run: >-
          yarn workspace @deadlock-live-probe/api test --runInBand
          recommendation-value-v6-features.spec.ts
          recommendation-value-v6-live.spec.ts
          recommendation-value-v6-telemetry.spec.ts

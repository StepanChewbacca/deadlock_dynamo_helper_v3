name: Recommendation Behavioral V6 Tuning Diagnostics Validator

on:
  pull_request:
    paths:
      - 'scripts/evaluate-recommendation-behavioral-v6-tuning-diagnostics.mjs'
      - '.github/workflows/recommendation-behavioral-v6-tuning-diagnostics-validator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate read-only TUNING diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/evaluate-recommendation-behavioral-v6-tuning-diagnostics.mjs'
          node --check "$script"
          grep -q "expectedChoiceSetDefinition = 'MERGED_TOP_96'" "$script"
          grep -q "TUNING_INFERENCE_STREAMING_1" "$script"
          grep -q "trainingPerformed: false" "$script"
          grep -q "valueTrainingPerformed: false" "$script"
          grep -q "futureTestEvaluated: false" "$script"
          grep -q "meanMulticlassBrier" "$script"
          grep -q "expectedCalibrationError" "$script"
          grep -q "zeroSeparationRate" "$script"
          grep -q "top1Top2ProbabilityMargin" "$script"
          grep -q "RAW_SOFTMAX_WITHIN_DECISION" "$script" || grep -q 'RECOMMENDATION_BEHAVIORAL_V6_PROBABILITY_CONTRACT' "$script"
          ! grep -q 'trainRecommendationBehavioralV6Decision' "$script"

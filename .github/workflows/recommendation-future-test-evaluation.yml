name: Recommendation FUTURE_TEST Evaluation

on:
  workflow_dispatch:
    inputs:
      evaluation_artifact_path:
        description: Pre-staged frozen RecommendationFutureTestEvaluationArtifactV1 JSON on the protected runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recommendation-future-test-evaluation
  cancel-in-progress: false

jobs:
  materialize-future-test:
    environment: recommendation-future-test
    runs-on: [self-hosted, linux, x64, recommendation-future-test]
    timeout-minutes: 20
    env:
      EVALUATION_ARTIFACT_PATH_INPUT: ${{ inputs.evaluation_artifact_path }}
      ROADMAP_API_BASE_URL: ${{ vars.RECOMMENDATION_ROADMAP_API_BASE_URL }}
      ROADMAP_TOKEN: ${{ secrets.RECOMMENDATION_ROADMAP_EVIDENCE_TOKEN }}
    steps:
      - name: Checkout frozen FUTURE_TEST guard code
        uses: actions/checkout@v4

      - name: Validate one-shot frozen evaluation artifact
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RECOMMENDATION_FUTURE_TEST_STAGING_ROOT:-}" || { echo "RECOMMENDATION_FUTURE_TEST_STAGING_ROOT is required" >&2; exit 1; }
          test -n "$ROADMAP_API_BASE_URL" || { echo "RECOMMENDATION_ROADMAP_API_BASE_URL is required" >&2; exit 1; }
          test -n "$ROADMAP_TOKEN" || { echo "RECOMMENDATION_ROADMAP_EVIDENCE_TOKEN is required" >&2; exit 1; }
          STAGING_ROOT="$(realpath -e "$RECOMMENDATION_FUTURE_TEST_STAGING_ROOT")"
          ARTIFACT="$(realpath -e "$EVALUATION_ARTIFACT_PATH_INPUT")"
          case "$ARTIFACT" in "$STAGING_ROOT"/*) ;; *) echo "Evaluation artifact must be inside FUTURE_TEST staging root" >&2; exit 1;; esac
          test -f "$ARTIFACT" || { echo "Evaluation artifact is not a file" >&2; exit 1; }
          python3 - "$ARTIFACT" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("contractVersion") != "recommendation-future-test-evaluation-v1":
              raise SystemExit("FUTURE_TEST evaluation contract mismatch")
          for key in ["policyManifestSha256", "evaluationPlanSha256", "evaluationArtifactSha256"]:
              if not re.fullmatch(r"[a-fA-F0-9]{64}", str(data.get(key, ""))):
                  raise SystemExit(f"{key} is invalid")
          if data.get("futureTestAccessCount") != 1:
              raise SystemExit("FUTURE_TEST must be accessed exactly once")
          for key in ["architectureFrozen", "hyperparametersFrozen", "candidateGeneratorFrozen", "targetFrozen"]:
              if data.get(key) is not True:
                  raise SystemExit(f"{key} must be true")
          if data.get("gateStatus") not in ["PASS", "FAIL"]:
              raise SystemExit("gateStatus must be PASS or FAIL")
          print(json.dumps({
              "status": "FROZEN_ARTIFACT_VALIDATED_NOT_YET_MATERIALIZED",
              "policyManifestSha256": data["policyManifestSha256"],
              "gateStatus": data["gateStatus"],
              "futureTestAccessCount": data["futureTestAccessCount"],
          }, sort_keys=True))
          PY
          echo "EVALUATION_ARTIFACT_PATH=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Materialize one-shot FUTURE_TEST result
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/recommendation-future-test-response-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            -H "x-recommendation-roadmap-token: $ROADMAP_TOKEN" \
            --data-binary "@$EVALUATION_ARTIFACT_PATH" \
            "$ROADMAP_API_BASE_URL/deadlock-live/recommendation-roadmap/v1/materialize/future-test" \
            > "$RESPONSE_FILE"
          python3 - "$RESPONSE_FILE" <<'PY'
          import json, sys
          response = json.load(open(sys.argv[1], encoding="utf-8"))
          status = (response.get("evaluation") or {}).get("gateStatus")
          if status not in ["PASS", "FAIL"]:
              raise SystemExit("FUTURE_TEST materializer returned an invalid status")
          print(json.dumps({
              "status": "FUTURE_TEST_MATERIALIZED",
              "gateStatus": status,
              "evaluationSnapshotSha256": response.get("evaluationSnapshotSha256"),
          }, sort_keys=True))
          PY
